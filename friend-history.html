<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#145c3b">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>我的本機帳單</title>
  <style>
    :root { color-scheme: light; --ink:#1d2a21; --muted:#58665d; --line:#9aa69c; --green:#176a43; --paper:#f4f6f2; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px max(16px,calc((100vw - 900px)/2)); border-bottom:1px solid var(--line); background:#fff; }
    button { min-height:44px; padding:8px 13px; border:1px solid #315c43; border-radius:9px; background:#e7f2e9; color:#104d31; font:inherit; font-weight:750; cursor:pointer; }
    a { color:#104d31; font-weight:750; }
    main { width:min(100% - 28px,900px); margin:24px auto 54px; }
    h1 { margin:0 0 7px; font-size:clamp(24px,5vw,32px); line-height:1.2; }
    .intro { margin:0 0 18px; color:var(--muted); }
    #history-status { margin:16px 0; color:var(--muted); }
    #friend-history-list { display:grid; gap:16px; }
    .saved-bill { overflow:hidden; border:1px solid #708075; border-radius:16px; background:#fff; box-shadow:0 8px 22px rgba(27,54,35,.05); }
    .saved-bill-head { padding:17px 18px; border-bottom:1px solid #c5cec7; }
    .saved-bill-head h2 { margin:0 0 4px; font-size:21px; }
    .saved-bill-head p { margin:3px 0; color:var(--muted); }
    .saved-total { color:#104d31 !important; font-size:19px; font-weight:850; }
    .saved-items { display:grid; gap:8px; margin:0; padding:14px 18px; list-style:none; }
    .saved-items li { display:flex; justify-content:space-between; gap:14px; padding:8px 0; border-bottom:1px solid #e0e5e1; }
    .saved-items li:last-child { border-bottom:0; }
    .saved-photos { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:10px; padding:0 18px 18px; }
    .saved-photos img { display:block; width:100%; max-height:440px; object-fit:contain; border:1px solid #9aa69c; border-radius:10px; background:#f0f2ee; }
    .empty { padding:20px; border:1px dashed #859187; border-radius:12px; background:#fff; color:var(--muted); }
    @media(max-width:500px) { header { padding:9px 12px; } main { width:calc(100% - 22px); margin-top:18px; } .saved-items li { align-items:flex-start; } }
  </style>
</head>
<body>
  <header>
    <button id="history-back" type="button">返回上一頁</button>
    <button id="history-reload" type="button">重新載入</button>
  </header>
  <main>
    <h1>我的本機帳單</h1>
    <p class="intro">只在這部裝置和這個瀏覽器保存；清除瀏覽器資料會一併刪除。每張帳單只顯示你自己的明細及收據。</p>
    <p id="history-status" role="status" aria-live="polite">正在讀取…</p>
    <section id="friend-history-list" aria-label="已保存的本機帳單"></section>
  </main>
  <script>
    'use strict';
    const list = document.getElementById('friend-history-list');
    const status = document.getElementById('history-status');
    const validImage = image => image && typeof image.data === 'string' && /^[A-Za-z0-9+/]+={0,2}$/.test(image.data) && ['image/jpeg','image/png','image/webp'].includes(image.mimeType);
    const money = (amount, currency) => {
      try { return new Intl.NumberFormat('zh-HK', { style:'currency', currency: /^[A-Z]{3}$/.test(currency || '') ? currency : 'HKD' }).format(Number(amount) || 0); }
      catch (_) { return `${Number(amount) || 0} ${currency || 'HKD'}`; }
    };
    function openHistoryDb() {
      if (!window.indexedDB) return Promise.reject(new Error('本機資料庫不可用'));
      return new Promise((resolve,reject) => {
        const request = indexedDB.open('billSplitterFriendHistory', 1);
        request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains('bills')) request.result.createObjectStore('bills', { keyPath:'id' }); };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('本機資料庫不可用'));
      });
    }
    function savedBillCard(record) {
      const article = document.createElement('article'); article.className = 'saved-bill';
      const head = document.createElement('div'); head.className = 'saved-bill-head';
      const title = document.createElement('h2'); title.textContent = `${String(record.name || '朋友')}的帳單`;
      const bill = record.bill && typeof record.bill === 'object' ? record.bill : {};
      const meta = document.createElement('p'); meta.textContent = [bill.date, bill.payer ? `代墊：${bill.payer}` : '', record.savedAt ? `保存：${new Intl.DateTimeFormat('zh-HK', { dateStyle:'medium', timeStyle:'short' }).format(new Date(record.savedAt))}` : ''].filter(Boolean).join(' · ');
      const total = document.createElement('p'); total.className = 'saved-total'; total.textContent = `你要埋單：${money(record.total, bill.currency || 'HKD')}`;
      head.append(title, meta, total); article.append(head);
      const items = document.createElement('ul'); items.className = 'saved-items';
      for (const item of Array.isArray(record.items) ? record.items : []) {
        const ownShares = (Array.isArray(item.shares) ? item.shares : []).filter(share => share?.person === record.name);
        if (!ownShares.length) continue;
        for (const share of ownShares) {
          const row = document.createElement('li');
          const label = document.createElement('span'); label.textContent = `${String(item.number || item.id || '')} ${String(item.name || '未命名項目')}${Number(share.quantity) ? ` · ${share.quantity}${share.unit ? ` ${share.unit}` : ''}` : ''}`;
          const amount = document.createElement('strong'); amount.textContent = money(share.amount, bill.sourceCurrency || bill.currency || 'HKD');
          row.append(label, amount); items.append(row);
        }
      }
      if (items.children.length) article.append(items);
      const photos = (Array.isArray(record.images) ? record.images : []).filter(validImage);
      if (photos.length) {
        const gallery = document.createElement('div'); gallery.className = 'saved-photos';
        photos.forEach((image,index) => { const photo = document.createElement('img'); photo.loading = 'lazy'; photo.alt = `收據 ${index + 1}`; photo.src = `data:${image.mimeType};base64,${image.data}`; gallery.append(photo); });
        article.append(gallery);
      }
      return article;
    }
    async function loadHistory() {
      status.textContent = '正在讀取…'; list.replaceChildren();
      let db;
      try {
        db = await openHistoryDb();
        const records = await new Promise((resolve,reject) => {
          if (!db.objectStoreNames.contains('bills')) { resolve([]); return; }
          const tx = db.transaction('bills','readonly');
          const request = tx.objectStore('bills').getAll();
          request.onsuccess = () => resolve(Array.isArray(request.result) ? request.result : []);
          request.onerror = () => reject(request.error || new Error('讀取失敗'));
          tx.onerror = () => reject(tx.error || new Error('讀取失敗'));
        });
        records.sort((a,b) => String(b.savedAt || '').localeCompare(String(a.savedAt || '')));
        if (!records.length) {
          status.textContent = '';
          const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = '尚未保存帳單。請從朋友分享結果頁揀你的姓名，再按「保存我的帳單和收據到此裝置」。';
          list.append(empty); return;
        }
        status.textContent = `已保存 ${records.length} 張帳單`;
        records.forEach(record => list.append(savedBillCard(record)));
      } catch (_) {
        status.textContent = '未能讀取本機帳單；請確認使用保存時的同一部裝置和瀏覽器。';
      } finally { db?.close(); }
    }
    document.getElementById('history-back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = './index.html'; });
    document.getElementById('history-reload').addEventListener('click', loadHistory);
    loadHistory();
  </script>
</body>
</html>
