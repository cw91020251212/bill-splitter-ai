            <Button data-testid="attach-receipt-image" variant="secondary" className={`!w-full !py-2 ${shareMode ? '!h-[44px] !min-h-[44px] !py-1 !border-blue-500 !bg-white !text-blue-900 !text-sm !shadow-none' : remindBillPhoto ? '!h-[44px] !min-h-[44px] !py-1 !border-amber-600 !bg-white !text-amber-950 !text-sm !shadow-none' : ''}`} style={shareMode ? { height: '44px', minHeight: '44px', backgroundColor: '#fff', color: '#1e3a8a', borderColor: '#3b82f6', boxShadow: 'none' } : remindBillPhoto ? { height: '44px', minHeight: '44px', backgroundColor: '#fff', color: '#78350f', borderColor: '#d97706', boxShadow: 'none' } : undefined} disabled={tutorialDemo || isAnalyzing || isPreparingRedacted} onClick={() => openReceiptImagePicker(receiptAttachmentInputRef)}>
              <Icon path={icons.fileImage} size={18}/>{bi(remindBillPhoto ? '補貼原帳單' : shareMode ? (lastImageData.length > 0 ? '再加帳單圖' : '加入帳單圖') : '後加圖片', remindBillPhoto ? 'Attach original bill' : shareMode ? (lastImageData.length > 0 ? 'Add another bill photo' : 'Add bill photo') : 'Add photo')}
            </Button>
            {lastImageData.length > 0 && !shareMode && <p data-testid="receipt-attachment-status" className="text-center text-xs text-slate-600" role="status" aria-live="polite">{bi(`已加${lastImageData.length}張`, `${lastImageData.length} added`)}</p>}
          </div>
        </Card>
      );

      const calculateSplit = () => {
        setStepError('');
        if (legacyClaimReviewRequired) {
          setStepError(bi('舊草稿的項目編號未核對；請返回第二步逐項確認認領。', 'Item IDs in this older draft are not verified. Review the claims in Step 2 first.'));
          setStep(2);
          window.setTimeout(() => document.querySelector('[data-testid="legacy-claim-review"]')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
          return false;
        }
        if (!payer.trim()) { setStepError("⚠️ 請填寫墊支人姓名！"); focusField('payer'); return; }
        if (!validateBillItems(true)) return false;
        if (!validateTaxAmount(true)) return false;
        const parsedTaxAmount = String(taxAmount ?? '').trim() === '' ? 0 : Number(taxAmount);
        const taxNum = ReceiptMath.roundMoney(parsedTaxAmount, detectedCurrency);

        const parsed = parseClaims(friendsReplies, items);
        const personClaims = parsed.claims;
        const claimUnits = parsed.claimUnits || {};
        const claimModes = parsed.claimModes || {};
        const shareExplicit = parsed.shareExplicit || {};

        if (parsed.people.length === 0) {
          setStepError(bi('未有可用認帳；請貼上朋友認領項目和數量。', 'No usable claims yet. Paste a friend’s item and quantity.'));
          setStep(2); window.setTimeout(() => focusField('replies'), 120); return false;
        }

        let conversionRate;
        try { conversionRate = ExchangeRates.requireRate(exchangeRate, detectedCurrency, currency); }
        catch (error) {
          setStepError(exchangeRate.status === 'loading'
            ? '⚠️ 正在取得最新匯率，請稍候再按「產生分帳報告」。'
            : '⚠️ 未能取得這組貨幣的匯率，請重試或選擇其他結算貨幣；未換算前不會產生報告。');
          return false;
        }

        const sourceTotal = ReceiptMath.roundMoney(
          items.reduce((sum, item) => sum + itemAmount(item), 0)
            + taxNum
            - ReceiptMath.roundMoney(toNum(discountAmount), detectedCurrency),
          detectedCurrency
        );
        const calculationItems = items.map(item => ({ ...item, total: itemAmount(item) }));

        const removedItemClaims = (parsed.issues || []).filter(issue => issue.type === 'unknown_id');
        if (removedItemClaims.length) {
          setStepError(bi(`認帳引用已刪除或不存在的項目編號 ${removedItemClaims[0].id}；請更新朋友回覆後再結算。`, `A reply references removed or unknown item ${removedItemClaims[0].id}. Update the replies before settling.`));
          setStep(2); window.setTimeout(() => focusField('replies'), 120); return false;
        }
        const claimants = Object.keys(personClaims).filter(person => calculationItems.some(item => Number(personClaims[person]?.[item.id]) > 0));
        if (!claimants.length) {
          setStepError(bi('尚未有人認領任何項目；請先補上認帳。', 'No one has claimed an item yet. Add claims before settling.'));
          setStep(2); window.setTimeout(() => focusField('replies'), 120); return false;
        }

        const itemClaimTotals = {};
        calculationItems.forEach(item => { itemClaimTotals[item.id] = claimants.reduce((sum, person) => sum + (Number(personClaims[person]?.[item.id]) || 0), 0); });
        const unclaimedItems = calculationItems.filter(item => toNum(item.total) > 0 && itemClaimTotals[item.id] <= 0);
        if (unclaimedItems.length) {
          const missingNames = unclaimedItems.slice(0, 3).map(item => `${item.id} ${displayItemName(item).trim() || bi('未命名項目', 'unnamed item')}`).join('、');
          const remaining = unclaimedItems.length > 3 ? bi(`，另有 ${unclaimedItems.length - 3} 項`, `, and ${unclaimedItems.length - 3} more`) : '';
          setStepError(bi(`有金額的項目尚未認領：${missingNames}${remaining}。請補認帳或刪除，不能略過。`, `Items with a price have no claim: ${missingNames}${remaining}. Add a claim or remove the item; it cannot be skipped.`));
          setStep(2); window.setTimeout(() => focusField('replies'), 120); return false;
        }

        const sharedShareProblems = calculationItems.flatMap(item => {
          if (toNum(item.total) <= 0) return [];
          const actualPeople = claimants.filter(person => claimUnits[person]?.[item.id] && (personClaims[person]?.[item.id] || 0) > 0);
          const sharedPeople = claimants.filter(person => (personClaims[person]?.[item.id] || 0) > 0 && !actualPeople.includes(person));
          const newSharedPeople = sharedPeople.filter(person => claimModes[person]?.[item.id] === 'shared');
          const legacySharePeople = sharedPeople.filter(person => claimModes[person]?.[item.id] !== 'shared');
          if (newSharedPeople.length && legacySharePeople.length) return [`${item.id} ${displayItemName(item).trim() || bi('項目', 'item')}：新舊份數回覆混用；請把舊份數改成「共享」模式後再結算。`];
          if (!newSharedPeople.length) return [];
          const explicitPeople = newSharedPeople.filter(person => shareExplicit[person]?.[item.id] === true);
          const explicitTotal = explicitPeople.reduce((sum, person) => sum + (Number(personClaims[person]?.[item.id]) || 0), 0);
          const blankCount = newSharedPeople.length - explicitPeople.length;
          if (explicitTotal > newSharedPeople.length + 0.000001) return [`${item.id} ${displayItemName(item).trim() || bi('項目', 'item')}：共享份數超過 ${newSharedPeople.length} 位共享者。`];
          if (!blankCount && explicitTotal < newSharedPeople.length - 0.000001) return [`${item.id} ${displayItemName(item).trim() || bi('項目', 'item')}：尚有共享餘額未分配；請調整份數，或讓其他共享者留空平均分。`];
          return [];
        });
        if (sharedShareProblems.length) {
          setStepError(bi(`有共享份數未能對上共享人數，請先修正：${sharedShareProblems.slice(0, 2).join('；')}`, `Shared portions do not match the number of sharers. Correct them first: ${sharedShareProblems.slice(0, 2).join('; ')}`));
          setStep(2); window.setTimeout(() => focusField('replies'), 120); return false;
        }

        const reconciliationIssues = calculationItems.map(item => {
          const totalQty = toNum(item.totalQty);
          if (totalQty <= 0 || toNum(item.total) <= 0) return null;
          const actualPeople = claimants.filter(person => claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          const sharePeople = claimants.filter(person => !claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          const newSharedPeople = sharePeople.filter(person => claimModes[person]?.[item.id] === 'shared');
          const claimedQty = actualPeople.reduce((sum, person) => sum + personClaims[person][item.id], 0);
          const difference = totalQty - claimedQty;
          if (difference < -0.0001) {
            const allocation = allocateCurrencyAmount(item.total, { claimed: Math.max(0, claimedQty), remaining: 0 }, detectedCurrency, 6);
            return { itemId: item.id, name: item.name, unit: item.unit || '單位', totalQty, claimedQty, difference, amount: allocation.remaining || 0,
              shareClaimCount: sharePeople.length, shareClaimTotal: sharePeople.reduce((sum, person) => sum + (Number(personClaims[person][item.id]) || 0), 0),
              claimantKeys: [...new Set([...actualPeople, ...sharePeople])].sort(), requiresClaimCorrection: false };
          }
          if (newSharedPeople.length) {
            if (Math.abs(difference) < 0.0001) return { itemId: item.id, name: item.name, unit: item.unit || '單位', totalQty, claimedQty, difference, amount: 0,
              shareClaimCount: sharePeople.length, shareClaimTotal: sharePeople.reduce((sum, person) => sum + (Number(personClaims[person][item.id]) || 0), 0),
              claimantKeys: [...new Set([...actualPeople, ...sharePeople])].sort(), requiresClaimCorrection: true };
            return null;
          }
          if (!sharePeople.length && Math.abs(difference) < 0.0001) return null;
          const allocation = allocateCurrencyAmount(item.total, { claimed: Math.max(0, claimedQty), remaining: Math.max(0, difference) }, detectedCurrency, 6);
          return { itemId: item.id, name: item.name, unit: item.unit || '單位', totalQty, claimedQty, difference, amount: allocation.remaining || 0,
            shareClaimCount: sharePeople.length, shareClaimTotal: sharePeople.reduce((sum, person) => sum + (Number(personClaims[person][item.id]) || 0), 0),
            claimantKeys: [...new Set([...actualPeople, ...sharePeople])].sort(),
            requiresClaimCorrection: sharePeople.length > 0 && Math.abs(difference) < 0.0001 };
        }).filter(Boolean);
        const reconciliationSignature = JSON.stringify(reconciliationIssues.map(issue => ({ itemId: issue.itemId, unit: issue.unit, totalQty: issue.totalQty, claimedQty: issue.claimedQty, difference: issue.difference, shareClaimCount: issue.shareClaimCount, shareClaimTotal: issue.shareClaimTotal, claimantKeys: issue.claimantKeys })));
        const previousReconciliationSignature = reconciliation?.issues
          ? JSON.stringify(reconciliation.issues.map(issue => ({ itemId: issue.itemId, unit: issue.unit, totalQty: issue.totalQty, claimedQty: issue.claimedQty, difference: issue.difference, shareClaimCount: issue.shareClaimCount, shareClaimTotal: issue.shareClaimTotal, claimantKeys: issue.claimantKeys })))
          : '';
        const selectedReconciliationPolicy = reconciliationSignature === previousReconciliationSignature ? reconciliation?.policy || '' : '';
        const hasOverClaim = reconciliationIssues.some(issue => issue.difference < 0);
        if (hasOverClaim) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError('⚠️ 有項目認帳數量超過單據總量，請返回修改後再計算。');
          return;
        }
        if (reconciliationIssues.some(issue => issue.requiresClaimCorrection)) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError(bi('已認實物數量已達單據總量，但仍有人只填「份數」；請先修正朋友回覆或單據總量，不能把份數當成額外件數。', 'The counted physical quantity already reaches the receipt total, but someone entered a share without a unit. Correct the reply or receipt quantity first; a share is not an extra item.'));
          return false;
        }
        if (reconciliationIssues.length && !selectedReconciliationPolicy) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError('⚠️ 有實際單位尚未完成數量核對，請選擇剩餘數量由誰承擔。');
          return;
        }

        const roundSplitAmount = value => roundAllocationAmount(value, detectedCurrency);
        const personTotals = {}; let totalItemsCost = 0;
        claimants.forEach(person => { personTotals[person] = { items: [], adjustments: [], subtotal: 0, discount: 0, tax: 0, sourceTotal: 0, total: 0 }; });

        calculationItems.forEach(item => {
          const totalClaimed = itemClaimTotals[item.id];
          if (totalClaimed <= 0) return;
          const totalQty = toNum(item.totalQty);
          const canUseActualUnits = totalQty > 0;
          const actualPeople = claimants.filter(person => canUseActualUnits && claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          const sharePeople = claimants.filter(person => (personClaims[person][item.id] || 0) > 0 && !actualPeople.includes(person));
          const actualTotal = actualPeople.reduce((sum, person) => sum + (Number(personClaims[person][item.id]) || 0), 0);
          const shareTotal = sharePeople.reduce((sum, person) => sum + (Number(personClaims[person][item.id]) || 0), 0);
          const itemNeedsReconciliation = reconciliationIssues.some(issue => issue.itemId === item.id);
          const newSharedPeople = sharePeople.filter(person => claimModes[person]?.[item.id] === 'shared');
          const explicitSharePeople = newSharedPeople.filter(person => shareExplicit[person]?.[item.id] === true);
          const blankSharePeople = newSharedPeople.filter(person => shareExplicit[person]?.[item.id] !== true);
          const explicitShareTotal = explicitSharePeople.reduce((sum, person) => sum + (Number(personClaims[person][item.id]) || 0), 0);
          const remainingShareUnits = Math.max(0, newSharedPeople.length - explicitShareTotal);
          const sharedWeights = Object.fromEntries(explicitSharePeople.map(person => [person, Number(personClaims[person][item.id]) || 0]));
          if (blankSharePeople.length) blankSharePeople.forEach(person => { sharedWeights[person] = remainingShareUnits / blankSharePeople.length; });
          const allocateSharedAmount = amount => newSharedPeople.length
            ? allocateCurrencyAmount(amount, sharedWeights, detectedCurrency, 6)
            : {};
          let itemShares = {};
          let sharedAmount = item.total;
          if (newSharedPeople.length && canUseActualUnits && actualTotal > 0) {
            const remainingQty = Math.max(0, totalQty - actualTotal);
            const groupShares = allocateCurrencyAmount(item.total, { actual: actualTotal, shared: remainingQty }, detectedCurrency, 6);
            sharedAmount = groupShares.shared || 0;
            Object.assign(itemShares, allocateCurrencyAmount(groupShares.actual || 0,
              Object.fromEntries(actualPeople.map(person => [person, Number(personClaims[person][item.id]) || 0])), detectedCurrency, 6));
            Object.assign(itemShares, allocateSharedAmount(sharedAmount));
          } else if (newSharedPeople.length) {
            Object.assign(itemShares, allocateSharedAmount(item.total));
          } else if (canUseActualUnits && actualTotal > 0) {
            const remainingQty = Math.max(0, totalQty - actualTotal);
            const groupShares = allocateCurrencyAmount(item.total, { actual: actualTotal, shared: remainingQty }, detectedCurrency, 6);
            Object.assign(itemShares, allocateCurrencyAmount(groupShares.actual || 0,
              Object.fromEntries(actualPeople.map(person => [person, Number(personClaims[person][item.id]) || 0])), detectedCurrency, 6));
            if (shareTotal > 0 && !itemNeedsReconciliation) Object.assign(itemShares, allocateCurrencyAmount(groupShares.shared || 0,
              Object.fromEntries(sharePeople.map(person => [person, Number(personClaims[person][item.id]) || 0])), detectedCurrency, 6));
          } else {
            itemShares = allocateCurrencyAmount(item.total,
              Object.fromEntries(claimants.map(person => [person, Number(personClaims[person][item.id]) || 0])), detectedCurrency, 6);
          }
          claimants.forEach(person => {
            const claimedQty = personClaims[person][item.id] || 0;
            if (claimedQty <= 0) return;
            const enteredUnit = claimUnits[person]?.[item.id] || '';
            const isActualUnit = canUseActualUnits && Boolean(enteredUnit);
            const explicitMode = claimModes[person]?.[item.id] === 'shared';
            const allocationTotal = isActualUnit ? totalQty : explicitMode ? newSharedPeople.length : (actualTotal > 0 ? shareTotal : totalClaimed);
            const cost = itemShares[person] || 0;
            personTotals[person].items.push({ name: item.name, nameEn: item.nameEn || '', original: item.original || '', ja: item.ja || '', id: item.id, amount: cost, qty: claimedQty, totalClaimed, unit: enteredUnit, unitName: item.unit || '', allocationTotal, isActualUnit,
              claimMode: explicitMode ? 'shared' : '', shareExplicit: explicitMode && shareExplicit[person]?.[item.id] === true });
            personTotals[person].subtotal = roundSplitAmount(personTotals[person].subtotal + cost);
            totalItemsCost = roundSplitAmount(totalItemsCost + cost);
          });
        });

        reconciliationIssues.forEach(issue => {
          const policy = selectedReconciliationPolicy;
          const item = calculationItems.find(candidate => candidate.id === issue.itemId);
          const amount = roundSplitAmount(issue.amount);
          if (policy === 'payer') {
            if (!personTotals[payer]) personTotals[payer] = { items: [], adjustments: [], subtotal: 0, discount: 0, tax: 0, sourceTotal: 0, total: 0 };
            personTotals[payer].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference, unit: issue.unit, amount, reason: '墊支人承擔未認帳數量' });
            personTotals[payer].subtotal = roundSplitAmount(personTotals[payer].subtotal + amount);
            totalItemsCost = roundSplitAmount(totalItemsCost + amount);
          } else if (policy === 'equal') {
            const issueClaimants = claimants.filter(person => personClaims[person][item.id] > 0);
            const shares = allocateCurrencyAmount(amount, Object.fromEntries(issueClaimants.map(person => [person, 1])), detectedCurrency, 6);
            issueClaimants.forEach(person => {
              const share = shares[person] || 0;
              personTotals[person].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference / issueClaimants.length, unit: issue.unit, amount: share, reason: '已認帳人士平均承擔未認帳數量' });
              personTotals[person].subtotal = roundSplitAmount(personTotals[person].subtotal + share);
              totalItemsCost = roundSplitAmount(totalItemsCost + share);
            });
          } else if (policy && policy.startsWith('person:')) {
            const person = policy.slice(7);
            if (!personTotals[person]) personTotals[person] = { items: [], adjustments: [], subtotal: 0, discount: 0, tax: 0, sourceTotal: 0, total: 0 };
            personTotals[person].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference, unit: issue.unit, amount, reason: '指定承擔未認帳數量' });
            personTotals[person].subtotal = roundSplitAmount(personTotals[person].subtotal + amount);
            totalItemsCost = roundSplitAmount(totalItemsCost + amount);
          }
        });
        const reconciliationAllocations = reconciliationIssues.map(issue => ({ ...issue, policy: selectedReconciliationPolicy }));

        const discountNum = ReceiptMath.roundMoney(toNum(discountAmount), detectedCurrency);
        if (discountNum < 0 || !ReceiptMath.isDiscountWithinSubtotal(discountNum, totalItemsCost, detectedCurrency)) {
          setStepError('⚠️ 整張單折扣不可多於已分攤項目小計，請核對折扣金額。'); focusField('discount-amount'); return;
        }
        const preDiscountItemsCost = ReceiptMath.roundMoney(totalItemsCost, detectedCurrency);
        const discountShares = allocateCurrencyAmount(discountNum,
          Object.fromEntries(Object.entries(personTotals).map(([person, summary]) => [person, Math.max(0, summary.subtotal)])), detectedCurrency);
        Object.keys(personTotals).forEach(person => {
          const share = discountShares[person] || 0;
          personTotals[person].discount = share;
          personTotals[person].subtotal = roundSplitAmount(Math.max(0, personTotals[person].subtotal - share));
        });
        totalItemsCost = ReceiptMath.roundMoney(Math.max(0, preDiscountItemsCost - discountNum), detectedCurrency);
        const taxWeights = Object.fromEntries(Object.entries(personTotals).map(([person, summary]) => [person,
          taxSplitMethod === 'equal' ? 1 : Math.max(0, summary.subtotal)]));
        if (taxNum > 0 && taxSplitMethod === 'proportional' && !Object.values(taxWeights).some(weight => weight > 0)) {
          setStepError(bi('沒有可按比例分攤的消費，請改選平均分攤。', 'No positive spending to split tax proportionally; choose equal split.'));
          return false;
        }
        const taxShares = allocateCurrencyAmount(taxNum, taxWeights, detectedCurrency);
        Object.keys(personTotals).forEach(person => {
          const taxShare = taxShares[person] || 0;
          personTotals[person].tax = taxShare;
          personTotals[person].sourceTotal = roundSplitAmount(personTotals[person].subtotal + taxShare);
        });

        const sourceBillTotal = ReceiptMath.roundMoney(totalItemsCost + taxNum, detectedCurrency);
        const receiptTotalMismatch = Boolean(receiptTotalCheck) && (
          receiptTotalCheck.legacyMismatch === true
          || String(receiptTotalCheck.currency || '').toUpperCase() !== String(detectedCurrency || '').toUpperCase()
          || receiptTotalCheck.amount === null
          || !ReceiptMath.moneyEquals(receiptTotalCheck.amount, sourceBillTotal, detectedCurrency)
        );
        const receiptTotalReviewSignature = JSON.stringify({ printedAmount: receiptTotalCheck?.amount ?? null, printedCurrency: receiptTotalCheck?.currency || '', legacyMismatch: receiptTotalCheck?.legacyMismatch === true, calculatedAmount: sourceBillTotal, calculatedCurrency: detectedCurrency });
        if (receiptTotalMismatch && receiptTotalAcknowledgement !== receiptTotalReviewSignature) {
          setReceiptTotalReview({
            signature: receiptTotalReviewSignature,
            printedAmount: receiptTotalCheck.amount,
            printedCurrency: receiptTotalCheck.currency || detectedCurrency,
            calculatedAmount: sourceBillTotal,
            calculatedCurrency: detectedCurrency,
            legacyMismatch: receiptTotalCheck.legacyMismatch === true
          });
          setStepError('');
          return false;
        }
        const sourceAmounts = Object.fromEntries(Object.entries(personTotals).map(([person, summary]) => [person, summary.sourceTotal]));
        let convertedTotals;
        try {
          convertedTotals = ExchangeRates.convertAggregatedAmounts({ amounts: sourceAmounts, totalAmount: sourceBillTotal, rate: conversionRate, targetCurrency: currency, moneyMath: ReceiptMath });
        } catch (error) {
          setStepError('⚠️ 原幣分帳小計未能與全單總額核對，請檢查認帳數量及折扣／稅費。');
          return false;
        }
        Object.entries(convertedTotals.amounts).forEach(([person, amount]) => {
          personTotals[person].total = amount;
          const individualRounded = ExchangeRates.convertMoney(personTotals[person].sourceTotal, conversionRate, currency, ReceiptMath);
          personTotals[person].settlementRoundingAdjustment = ReceiptMath.roundMoney(amount - individualRounded, currency);
        });
        const billTotal = convertedTotals.total;
        const calculatedResults = { calculationVersion: 3, personTotals, totalItemsCost, itemsSubtotal: preDiscountItemsCost, discountAmount: discountNum, taxAmount: taxNum, sourceBillTotal, receiptTotalReview: receiptTotalMismatch ? { acknowledged: true, printedAmount: receiptTotalCheck.amount, printedCurrency: receiptTotalCheck.currency || detectedCurrency, calculatedAmount: sourceBillTotal, calculatedCurrency: detectedCurrency } : null, settlementRoundingAdjustmentUnits: convertedTotals.roundingAdjustmentUnits, billTotal, sourceCurrency: detectedCurrency, sourceTotal, exchangeRate: conversionRate, exchangeRateDate: exchangeRate.date || null, exchangeProvider: exchangeRate.provider || 'Frankfurter', reconciliationAllocations, date: new Date().toISOString().split('T')[0], currency };
        autoPublishResultRef.current = !tutorialDemo && claimSessionRef.current?.link ? calculatedResults : null;
        setResults(calculatedResults);
        setIsSaved(false); setIsSavingRecord(false); setStep(4);
        return true;
      };

      const paymentDisplay = (value, language = uiLang) => {
        const map = {
          '轉數快 (FPS)': 'FPS (Faster Payment System)',
          'PayMe': 'PayMe',
          '現金': 'Cash',
          '銀行轉帳': 'Bank transfer',
          'Alipay': 'Alipay',
          '未指定': 'Not specified'
        };
        if (language !== 'en') return value || '未指定';
        return map[value] || value || 'Not specified';
      };
      const unitDisplay = (value, language = uiLang, quantity = null) => {
        if (language !== 'en') return value || '單位';
        const map = { '件': 'piece(s)', '杯': 'cup(s)', '碟': 'plate(s)', '罐': 'can(s)', '份': 'serving(s)', '個': 'piece(s)', '支': 'piece(s)', '串': 'skewer(s)', '碗': 'bowl(s)', '瓶': 'bottle(s)', '包': 'pack(s)', '條': 'piece(s)', '隻': 'piece(s)', '單位': 'unit(s)' };
        return map[value] || value || 'unit(s)';

            <p className="text-sm font-bold text-slate-800">{bi(`只供「${claimApprovalCode.name}」本人使用：`, `For ${claimApprovalCode.name} only:`)}</p>

            <p data-testid="claim-approval-expiry" className="text-xs leading-relaxed text-slate-700">{bi('到期時間：', 'Expires: ')}{new Intl.DateTimeFormat(uiLang === 'en' ? 'en-HK' : 'zh-HK', { timeZone: 'Asia/Hong_Kong', dateStyle: 'medium', timeStyle: 'short' }).format(new Date(claimApprovalCode.expiresAt))}{bi('（香港時間）', ' (Hong Kong time)')}</p>

            <Button data-testid="claim-copy-approval-code" variant="secondary" className="!w-full" onClick={() => { if (claimApprovalCode.expiresMs <= Date.now()) { setClaimApprovalCode(null); setClaimApprovalPhase('expired'); return; } copyToClipboard(claimApprovalCode.setupCode, bi('確認碼', 'Confirmation code')); }}><Icon path={icons.copy} size={18}/>{bi('複製確認碼', 'Copy confirmation code')}</Button>

      ) : !tutorialDemo && claimRoom && !claimSession ? (

          <p role="status" className="text-sm font-semibold leading-relaxed text-amber-950">{bi('此連結只有舊接收房間，無法安全加入密碼。已停用公開自動接收，不會接納未驗證的認帳。請建立並分享新的受保護連結；原認帳及結果仍保留，亦可手動貼上 WhatsApp 回覆核對及計算。', 'This link has only an old relay room, so password protection cannot safely be added. Public automatic receiving is disabled and unverified claims will not be accepted. Create and share a new protected link. Existing claims and results are kept; you can still manually paste WhatsApp replies, check them and calculate.')}</p>
          <Button data-testid="claim-new-protected-link" variant="primary" className="!w-full" onClick={generateFriendClaimLink}>{bi('建立新的受保護連結', 'Create a new protected link')}</Button>

                <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                  <img src="./icons/icon.svg" alt="" width="48" height="48" className="app-brand-icon shrink-0" />
                  <div>
                  <h1 className="text-xl font-extrabold text-slate-800 tracking-tight"><span className="app-brand-name block sm:inline whitespace-nowrap">{tr("分帳管家")}</span><span className="inline-flex items-baseline gap-1 sm:ml-1 whitespace-nowrap"><span data-testid="app-pro-label" className="text-brand-600 font-black">Pro</span><span data-testid="app-version-label" className="text-[10px] leading-3 font-semibold tracking-normal text-brand-700">R143</span></span></h1>

                    <Icon path={icons.arrowLeft} size={16}/>{tr(" 返回")}</button>

                          <button type="button" data-testid="app-text-size-large" aria-label={bi('大字體', 'Large text')} aria-pressed={appTextSize === 'large'} onClick={() => chooseAppTextSize('large')} style={{ minWidth: '44px', minHeight: '52px' }} className="text-size-hit"><span className="text-size-face text-size-face-lg">A+</span></button>
                        </div>
                      </div>
                      <button type="button" data-testid="start-tutorial" disabled={!draftReady || isAnalyzing || isSavingRecord} onClick={() => {

                        {tr("教學")}

                        {tr("設定")}

                        {tr("紀錄")}

                        <span className="block">{bi('清空本單', 'Clear bill')}</span>
                        <span id="header-clear-current-help" className="block text-xs font-normal text-slate-600">{bi('保留歷史及收據', 'History & receipts stay')}</span>
                      </button>
                    </div>
                  </div>

              <div className="stepper-panel bg-slate-50/80 px-4 py-3 border-t border-slate-400 max-w-2xl mx-auto">
                <div className="step-progress mb-2" data-testid="step-progress" data-step={step} role="progressbar" aria-valuemin={1} aria-valuemax={4} aria-valuenow={step} aria-valuetext={bi(`第 ${step} 步：${STEP_ACCESSIBLE_LABELS[step - 1]}，共 4 步`, `Step ${step}: ${STEP_LABELS_EN[step - 1]} of 4`)}>
                  <div className="step-progress-fill" style={{ width: `${(step / 4) * 100}%` }}></div>

                        setShowSettings(false);
                        setShowTutorial(true);
                      }} className="shrink-0 rounded-md border border-brand-600 px-2 py-1 text-xs font-semibold text-brand-700 hover:bg-brand-50">{bi('影片教學', 'Video guide')}</button>
                    </div>
                    <div className="provider-status mb-6 rounded-xl p-3">
                      <span className="provider-status-kicker">{bi('目前', 'Current')}</span>
                      <div className="font-bold text-base text-slate-900">{ocrEngine === 'paddlejs' ? bi('本機 OCR＋OpenRouter 文字整理', 'Local OCR + OpenRouter text processing') : apiModel === Ocr.RANDOM_ROUTER_MODEL_ID ? bi('OpenRouter 免費隨機路由', 'OpenRouter free random route') : bi('OpenRouter 固定模型', 'OpenRouter fixed model')}</div>
                    </div>

                    <div className="border-t border-slate-400 pt-6 space-y-5">
                      <div>
                        <Label className="text-base">{bi('今次辨識用邊個模型？', 'Choose a model for this scan')}</Label>
                        <select
                          data-testid="model-select"
                          value={ocrEngine === 'paddlejs' ? LOCAL_PADDLE_MODEL_ID : resolveBillModel(apiModel, allowPaidModels)}
                          onChange={(event) => {
                            chooseOcrModel(event.target.value);
                          }}
                          className="w-full rounded-xl p-3.5 text-base font-semibold text-slate-800 bg-white"
                        >
                          <optgroup label={bi('OpenRouter 免費模型', 'OpenRouter free models')}>
                            {FREE_MODELS.map(([id, zh, en]) => <option key={id} value={id}>{bi(zh, en)}</option>)}
                          </optgroup>
                          <optgroup label={bi('本機 OCR', 'On-device OCR')}>
                            <option value={LOCAL_PADDLE_MODEL_ID}>{bi('PaddleOCR.js 本機＋Dots3-Note 整理', 'PaddleOCR.js local + Dots3-Note')}</option>
                          </optgroup>
                        </select>
                        {renderModelDescriptionDisclosure('settings', showSettingsModelDescription, setModelDescriptionVisibility)}
                      </div>

                      <div>
                        <Label className="text-base flex justify-between items-center">{bi('API 金鑰', 'API key')}<a data-testid="get-free-api-key" data-key-saved={!isEditingKey && Boolean(apiKey.trim()) ? 'true' : 'false'} href="https://openrouter.ai/settings/keys" target="_blank" rel="noreferrer" className={`text-sm underline font-semibold ${!isEditingKey && apiKey.trim() ? 'text-brand-700 hover:text-brand-800' : 'text-red-700 hover:text-red-900'}`}>{bi('取得免費金鑰 ↗', 'Get a free key ↗')}</a>
                        </Label>
                        {!isEditingKey && apiKey ? (
                          <div className="bg-slate-50 border border-slate-400 rounded-xl p-4 mt-2">
                            <div className="field-round font-mono text-sm text-slate-700 p-2.5 mb-3 break-all font-semibold">{maskKey(apiKey)}</div>
                            <div className="grid grid-cols-2 gap-2">
                              <Button variant="secondary" className="min-w-0 !px-2 !py-2 border-slate-500" onClick={() => { editKeyRef.current = apiKey; setApiKey(''); setIsEditingKey(true); }}><Icon path={icons.edit} size={16}/>{tr(" 更換")}</Button>
                              <Button variant="secondary" className="min-w-0 !px-2 !py-2 text-blue-700 border-slate-500" onClick={testKey}>{tr("🧪 測試連線")}</Button>
                              <Button variant="secondary" className="col-span-2 !py-2 !px-3 text-red-700 border-red-500 hover:bg-red-50" onClick={forgetApiKey}><Icon path={icons.trash} size={16}/>{bi('移除金鑰', 'Remove key')}</Button>
                            </div>
                            {keyTestResult && <div className={`text-sm font-bold mt-3 px-3 py-2 rounded-lg border ${keyTestResult.ok ? 'bg-brand-50 text-brand-800 border-brand-500' : 'bg-red-50 text-red-800 border-red-500'}`}>{tr(keyTestResult.msg)}</div>}
                          </div>
                        ) : (
                          <div className="mt-2 space-y-3">
                            <div className="relative">
                              <input
                                type={showKey ? 'text' : 'password'} value={apiKey} onChange={(e) => setApiKey(e.target.value)}
                                placeholder={tr("在此貼上您的 API 金鑰")}
                                className="w-full rounded-xl p-3.5 pr-12 font-mono text-base focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none transition-all"
                              />
                              <button onMouseDown={() => setShowKey(true)} onMouseUp={() => setShowKey(false)} onTouchStart={() => setShowKey(true)} onTouchEnd={() => setShowKey(false)} className="absolute right-3 top-3.5 text-slate-500 hover:text-slate-800"><Icon path={icons.eye} size={20}/></button>
                            </div>
                            <div className="flex gap-2">
                              {editKeyRef.current && <Button variant="secondary" className="flex-1 !py-2.5 text-sm border-slate-500" onClick={() => { setApiKey(editKeyRef.current); setIsEditingKey(false); editKeyRef.current=''; }}>{tr("取消修改")}</Button>}
                              <Button variant="primary" className="host-primary flex-1 !py-2.5 text-sm" disabled={!apiKey.trim()} onClick={saveApiConfig}>{tr("💾 儲存並驗證")}</Button>
                            </div>
                          </div>
                        )}
                      </div>

                      <label className="flex items-start gap-3 p-4 bg-slate-50 rounded-xl border border-slate-400 cursor-pointer hover:bg-slate-100 transition-colors">
                        <input type="checkbox" checked={rememberKey} onChange={(e) => {
                          if (tutorialDemo) return;
                          const shouldRemember = e.target.checked;
                          setRememberKey(shouldRemember);
                          try {
                            if (shouldRemember && apiKey.trim()) {
                              const payload = JSON.stringify({ engine: 'openrouter', ocrEngine, keys: { openrouter: apiKey.trim() }, model: resolveBillModel(apiModel, allowPaidModels), allowPaidModels: allowPaidModels === true, ocrModelPreferenceVersion: Ocr.MODEL_PREFERENCE_VERSION });
                              localStorage.setItem('billSplitterApiConfig', payload);
                              sessionStorage.setItem('billSplitterApiConfig', payload);
                            } else if (!shouldRemember) {
                              localStorage.removeItem('billSplitterApiConfig');
                            }
                          } catch(e) {
                            setRememberKey(false);
                            toast(tr("⚠️ 無法儲存到此瀏覽器，請關閉私密瀏覽或允許網站儲存資料"), 'error');
                          }
                        }} className="w-5 h-5 mt-0.5 text-brand-600 focus:ring-brand-500 rounded" />
                        <div>
                          <div className="font-bold text-slate-800 text-base">{bi('記住金鑰', 'Remember key')}</div>
                          <div className="text-base text-slate-700 mt-1 font-medium leading-relaxed">{bi('只保存在此瀏覽器，不會上傳。', 'Stored only in this browser; not uploaded.')}</div>
                        </div>
                      </label>
                    </div>
                  </Card>
                  <Button variant="secondary" className="w-full border-slate-500" onClick={() => setShowSettings(false)}>{tr("返回系統")}</Button>
               </div>
            )}

            {cameraOpen && (
              <div className="fixed inset-0 z-[10000] bg-black/95 flex flex-col items-center justify-center p-4" role="dialog" aria-label={tr("相機拍攝")}>
                <div className="w-full max-w-lg flex items-center justify-between text-white mb-3">
                  <h2 className="text-lg font-bold">{tr("影相上載單據")}</h2>
                  <button type="button" onClick={closeCamera} className="rounded-lg bg-white/15 px-4 py-2 font-semibold">{tr("取消")}</button>
                </div>
                <video ref={cameraVideoRef} playsInline muted autoPlay className="w-full max-w-lg max-h-[68vh] rounded-2xl bg-black object-contain" />
                <p className="text-white/80 text-sm mt-3">{tr("將單據放入畫面，按下面按鈕拍攝")}</p>
                <button type="button" onClick={captureCameraPhoto} className="host-primary green-action mt-4 w-20 h-20 rounded-full border-4 border-white bg-brand-500 shadow-lg active:scale-95" aria-label={tr("拍攝相片")}>
                  <span className="block w-12 h-12 mx-auto rounded-full border-2 border-white" />
                </button>
              </div>
            )}
          </main>
        </React.Fragment>
      );
    }

    function Application() {
      const [tourOpen, setTourOpen] = useState(false);
      const savedUi = useRef(null);
      const openHelp = useRef(null);
      const restoreFrame = useRef(0);
      const startTour = (showHelp, returnPosition) => {
        cancelAnimationFrame(restoreFrame.current);
        savedUi.current = { x: returnPosition?.x ?? window.scrollX, y: returnPosition?.y ?? window.scrollY, focus: document.activeElement };
        openHelp.current = showHelp;
        setTourOpen(true);
      };
      const closeTour = (showHelp = false) => {
        setTourOpen(false);
        if (showHelp) openHelp.current?.();
        const saved = savedUi.current;
        restoreFrame.current = requestAnimationFrame(() => {
          if (showHelp) window.scrollTo({ left: 0, top: 0, behavior: 'instant' });
          else if (saved) {
            const savedFocus = saved.focus?.isConnected && saved.focus.getClientRects().length ? saved.focus : null;
            const fallbackFocus = document.querySelector('[data-testid="header-action-menu-toggle"]')
              || document.querySelector('[data-testid="start-interactive-tutorial"]')
              || document.querySelector('[data-testid="start-tutorial"]');
            (savedFocus || fallbackFocus)?.focus({ preventScroll: true });
            window.scrollTo({ left: saved.x, top: saved.y, behavior: 'instant' });
          }
        });
      };
      useEffect(() => () => cancelAnimationFrame(restoreFrame.current), []);
      return <React.Fragment>
        <div data-live-app hidden={tourOpen} {...(tourOpen ? { inert: '' } : {})}>
          <App tutorialSuspended={tourOpen} onStartTutorial={startTour} />
        </div>
        {tourOpen && <window.BillTutorial language={window.BillI18n.language}
          onClose={() => closeTour(false)} onOpenHelp={() => closeTour(true)}
          renderDemo={(stage, onAction) => <App tutorialDemo tutorialStage={stage} onTutorialAction={onAction} />} />}
      </React.Fragment>;
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Application />);
  </script>
</body>
</html>
