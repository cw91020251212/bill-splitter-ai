<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>分帳管家 AI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857', 900: '#064e3b' }
          },
          boxShadow: {
            'card': '0 2px 8px -2px rgba(0, 0, 0, 0.05), 0 4px 16px -4px rgba(0, 0, 0, 0.02)',
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    
    /* --- 增強視覺對比：全局輪廓線最幼 (1px) 且加深為深灰色 --- */
    input[type="text"], input[type="number"], input[type="password"], textarea {
      border-width: 1px !important;
      border-color: #64748b !important; /* 深灰色 slate-500 */
      background-color: #ffffff !important;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #059669 !important; /* 聚焦時變為品牌深綠 */
    }
    
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    input, textarea { font-size: 16px !important; }
    
    @keyframes flashTarget {
      0%, 100% { background-color: transparent; box-shadow: none; }
      25%, 75% { background-color: #fef08a; box-shadow: 0 0 0 2px rgba(253, 224, 71, 0.8); }
    }
    .flash-target { animation: flashTarget 1.5s ease-in-out; border-radius: 8px; }
    
    /* 自訂卷軸 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo } = React;

    const Icon = ({ path, size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: path}} />
    );
    const icons = {
      upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
      receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/>',
      fileText: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/>',
      trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
      plus: '<line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/>',
      copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
      arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
      calculator: '<rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>',
      loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
      check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
      msg: '<path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/>',
      alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
      history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
      key: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
      lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
      fileImage: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><circle cx="10" cy="13" r="2"/><path d="m20 17-1.09-1.09a2 2 0 0 0-2.82 0L10 22"/>',
      book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
      help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/>',
      chevronDown: '<path d="m6 9 6 6 6-6"/>',
      chevronUp: '<path d="m18 15-6-6-6 6"/>',
      arrowLeft: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
      send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
      eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
    };

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
      const baseStyle = "flex items-center justify-center gap-2 px-5 py-3.5 rounded-xl font-semibold text-base transition-all duration-200 active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed w-full md:w-auto outline-none focus:ring-2 focus:ring-offset-2";
      const variants = {
        primary: "bg-brand-600 text-white hover:bg-brand-700 shadow-md focus:ring-brand-500 border border-brand-700",
        secondary: "bg-white text-slate-800 border border-slate-400 hover:bg-slate-100 shadow-sm focus:ring-slate-400",
        outline: "border border-brand-600 text-brand-700 bg-transparent hover:bg-brand-50 focus:ring-brand-500",
        danger: "bg-red-600 text-white hover:bg-red-700 shadow-md focus:ring-red-500 border border-red-700",
      };
      return <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>{children}</button>;
    };

    const Card = ({ children, className = '' }) => (
      <div className={`bg-white rounded-2xl shadow-card border border-slate-400 p-5 md:p-6 ${className}`}>{children}</div>
    );

    const Label = ({ children, required, className = '' }) => (
      <label className={`font-bold text-slate-800 block mb-1.5 ${className}`}>
        {children} 
        {required && <span className="ml-2 inline-block px-2 py-0.5 rounded bg-red-50 text-red-700 text-xs tracking-wide border border-red-500">必填</span>}
      </label>
    );

    const Accordion = ({ title, icon, children, defaultOpen = false, tone = 'slate' }) => {
      const [open, setOpen] = useState(defaultOpen);
      const tones = {
        slate: 'bg-white border border-slate-500', 
        amber: 'bg-amber-50 border border-amber-500',
        emerald: 'bg-emerald-50 border border-brand-500', 
        blue: 'bg-blue-50 border border-blue-500',
      };
      return (
        <div className={`rounded-xl border overflow-hidden ${tones[tone]} shadow-sm`}>
          <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between gap-3 p-4 text-left outline-none hover:bg-slate-50 transition-colors">
            <span className="flex items-center gap-2.5 font-bold text-slate-800 text-base">
              {icon && <Icon path={icon} size={20} className="text-slate-600 shrink-0"/>}
              {title}
            </span>
            <Icon path={open ? icons.chevronUp : icons.chevronDown} size={20} className="text-slate-500 shrink-0"/>
          </button>
          {open && <div className="px-4 pb-4 pt-1 text-sm text-slate-700 leading-relaxed space-y-3">{children}</div>}
        </div>
      );
    };

    const PROVIDERS = {
      openrouter: {
        models: [
          "openrouter/free",
          "google/gemma-4-31b-it:free",
          "google/gemma-4-26b-a4b-it:free",
          "minimax/minimax-m3:free",
          "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free",
          "thinkingmachines/inkling:free",
          "thinkingmachines/inkling-small:free",
          "dots-studio/dots-3-note-preview:free"
        ]
      }
    };

    const toNum = (v) => {
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      if (v === null || v === undefined) return 0;
      const m = String(v).replace(/[^\d.\-]/g, '');
      const n = parseFloat(m);
      return isNaN(n) ? 0 : n;
    };

    const extractPayload = (rawText) => {
      let txt = String(rawText).replace(/```json/gi, '').replace(/```/g, '').trim();
      let data = null;
      try { data = JSON.parse(txt); } catch (e) {
        const objMatch = txt.match(/\{[\s\S]*\}/);
        const arrMatch = txt.match(/\[[\s\S]*\]/);
        const candidate = (objMatch && arrMatch) ? (objMatch.index <= arrMatch.index ? objMatch[0] : arrMatch[0]) : (objMatch ? objMatch[0] : (arrMatch ? arrMatch[0] : null));
        if (!candidate) throw new Error('AI 回傳的內容不是有效 JSON，請重試或改用其他模型。');
        data = JSON.parse(candidate);
      }
      if (Array.isArray(data)) return { items: data, taxTotal: null, taxNote: '', currency: 'HKD', date: null, receiptTotal: null };
      const items = Array.isArray(data.items) ? data.items : (Array.isArray(data.data) ? data.data : []);
      let taxTotal = null;
      if (data.taxTotal !== undefined && data.taxTotal !== null && data.taxTotal !== '') taxTotal = toNum(data.taxTotal);
      else if (data.tax !== undefined && data.tax !== null && data.tax !== '') taxTotal = toNum(data.tax);
      const rawDate = data.date || data.receiptDate || data.Date || null;
      const date = (typeof rawDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(rawDate.trim())) ? rawDate.trim() : null;
      const rawTotal = (data.receiptTotal !== undefined && data.receiptTotal !== null && data.receiptTotal !== '') ? data.receiptTotal : null;
      const receiptTotal = rawTotal === null ? null : toNum(rawTotal);
      return { items, taxTotal, taxNote: data.taxNote || data.tax_note || '', currency: data.currency || data.Currency || 'HKD', date, receiptTotal };
    };

    const STEP_LABELS = ['上載睇單', '朋友認領', '分帳運算', '最終結果'];
    const SEP  = '\n\n➖➖➖➖➖➖➖➖➖➖\n\n';
    const TAIL = '\n\n';                 

    const appendReply = (existing, incoming) => {
      const clean = String(incoming || '').trim();
      if (!clean) return { text: existing, added: false };
      const base = String(existing || '').replace(/\s+$/, '');
      const text = base ? base + SEP + clean + TAIL : clean + TAIL;
      return { text, added: true, blockStart: base ? base.length + SEP.length : 0 };
    };

    const parkCaret = (el) => {
      if (!el) return;
      requestAnimationFrame(() => {
        const end = el.value.length;
        el.setSelectionRange(end, end);
      });
    };

    const ensureTail = (t) => {
      const s = String(t || '');
      if (!s.trim()) return s;                      
      return s.replace(/\s+$/, '') + TAIL;
    };

    const normalizeReplies = (raw) => {
      const lines = String(raw || '').split('\n');
      const out = [];
      const isNameLine = (s) => /(?:👤|姓名)\s*[:：=＝]/.test(s);
      const isSepLine  = (s) => /➖{3,}/.test(s);

      lines.forEach((line, i) => {
        if (i > 0 && isNameLine(line)) {
          let j = out.length - 1;
          while (j >= 0 && out[j].trim() === '') j--;
          const prev = j >= 0 ? out[j] : '';
          if (prev && !isSepLine(prev)) {
            while (out.length && out[out.length - 1].trim() === '') out.pop();
            out.push('', '➖➖➖➖➖➖➖➖➖➖', '');
          }
        }
        out.push(line);
      });
      return out.join('\n');
    };

    const parseClaimValue = (raw) => {
      const text = String(raw || '').replace(/＝/g, '=').trim();
      const match = text.match(/([\d.]+)\s*([^\d\s=，,。！？]*)/);
      return { qty: match ? parseFloat(match[1]) : NaN, unit: match ? String(match[2] || '').trim() : '' };
    };

    const parseClaims = (raw, items) => {
      const lines = String(raw || '').split('\n');
      const claims = {};
      const claimUnits = {};
      const people = [];
      const duplicatePeople = [];
      const unknownIds = new Set();
      let currentPerson = null;
      let lastSeenId = null;
      let totalClaimLines = 0;
      const issues = [];
      const itemIds = new Set(items.map(i => i.id));

      lines.forEach((line, index) => {
        const lineNo = index + 1;
        let cleanLine = line.replace(/\u3000/g, ' ').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
        cleanLine = cleanLine.replace(/[\uff01-\uff5e]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0));
        
        if (!cleanLine) return;

        if (cleanLine.includes('👤') || cleanLine.includes('姓名')) {
          const nameMatch = cleanLine.split(/[:=]/);
          if (nameMatch.length > 1) {
            currentPerson = nameMatch[1].trim();
            lastSeenId = null; 
            if (currentPerson) {
              if (people.includes(currentPerson)) {
                if (!duplicatePeople.includes(currentPerson)) duplicatePeople.push(currentPerson);
              } else {
                people.push(currentPerson);
              }
              if (!claims[currentPerson]) claims[currentPerson] = {};
              if (!claimUnits[currentPerson]) claimUnits[currentPerson] = {};
            }
          } else {
            issues.push({ type: 'name_no_delim', line: lineNo, text: cleanLine.substring(0, 40) });
          }
        } else if (currentPerson) {
          if (cleanLine.match(/^\D*\d{2}.*=/)) {
            const idMatch = cleanLine.match(/\d{2}/);
            const parts = cleanLine.split(/=/);
            const parsedValue = parseClaimValue(parts.slice(1).join('='));
            const qty = parsedValue.qty;
            
            if (idMatch) {
                const id = idMatch[0];
                if (!itemIds.has(id)) {
                    unknownIds.add(id);
                    issues.push({ type: 'unknown_id', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson, id });
                }
                if (!isNaN(qty)) {
                    if (qty > 0) {
                        claims[currentPerson][id] = qty;
                        claimUnits[currentPerson][id] = parsedValue.unit;
                        totalClaimLines++;
                    } else if (qty < 0) {
                        issues.push({ type: 'qty_negative', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
                    } else {
                        issues.push({ type: 'qty_zero', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
                    }
                } else {
                    issues.push({ type: 'qty_not_number', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
                }
            }
          } else if (cleanLine.match(/^\D*\d{2}/)) {
            const idMatch = cleanLine.match(/\d{2}/);
            if (idMatch) {
              lastSeenId = idMatch[0];
              if (!itemIds.has(lastSeenId)) {
                  unknownIds.add(lastSeenId);
                  issues.push({ type: 'unknown_id', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson, id: lastSeenId });
              }
            }
          } else if (lastSeenId && (cleanLine.includes('數量') || cleanLine.includes('='))) {
            const parts = cleanLine.split(/=/);
            const qtyStr = parts.length >= 2 ? parts.slice(1).join('=') : cleanLine;
            const parsedValue = parseClaimValue(qtyStr);
            const qty = parsedValue.qty;
            
            if (!isNaN(qty)) {
                if (qty > 0) {
                    claims[currentPerson][lastSeenId] = qty;
                    claimUnits[currentPerson][lastSeenId] = parsedValue.unit;
                    totalClaimLines++;
                } else if (qty < 0) {
                    issues.push({ type: 'qty_negative', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
                } else {
                    issues.push({ type: 'qty_zero', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
                }
                lastSeenId = null;
            } else {
                issues.push({ type: 'qty_not_number', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
            }
          } else if (/\d/.test(cleanLine) && !cleanLine.includes('➖➖')) {
             issues.push({ type: 'stray_number', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
          }
        } else if (cleanLine.includes('數量') || cleanLine.includes('=')) {
           issues.push({ type: 'no_person', line: lineNo, text: cleanLine.substring(0, 40) });
        }
      });

      const peopleWithNoClaims = people.filter(p => !claims[p] || Object.keys(claims[p]).length === 0);
      return { claims, claimUnits, people, totalClaimLines, issues, duplicatePeople, unknownIds: Array.from(unknownIds), peopleWithNoClaims };
    };

    const KEY_RULES = {
      openrouter: { prefix: 'sk-or-', expectLen: 73, pattern: /^sk-or-v1-[a-f0-9]{64}$/i, label: 'OpenRouter' },
      gemini: { prefix: 'AIza', expectLen: 39, pattern: /^AIza[0-9A-Za-z\-_]{35}$/, label: 'Gemini' }
    };

    const sanitizeKey = (raw) => {
      let s = String(raw || '');
      const notes = [];
      s = s.replace(/[\uff01-\uff5e]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0));
      const before = s;
      s = s.replace(/[\u200B-\u200D\uFEFF\u00A0\s]/g, ''); 
      if (s !== before) notes.push('removed_invisible');
      s = s.replace(/^["'「『]+|["'」』]+$/g, '');
      s = s.replace(/^Bearer/i, '');
      for (const prefix of ['sk-or-v1-', 'sk-or-', 'AIza']) {
        const idx = s.lastIndexOf(prefix);
        if (idx > 0) {
          s = s.slice(idx);
          notes.push('deduped');
          break;
        }
      }
      return { key: s, notes };
    };

    const validateKey = (key, engine) => {
      const r = KEY_RULES[engine];
      const k = String(key || '');
      const checks = {
        notEmpty:   k.length > 0,
        prefixOk:   k.startsWith(r.prefix),
        lengthOk:   k.length === r.expectLen,
        charsOk:    /^[\x21-\x7E]+$/.test(k),
        patternOk:  r.pattern.test(k)
      };
      const tooLong  = k.length > r.expectLen * 1.5;
      const severity = !checks.notEmpty ? 'empty' : tooLong ? 'likely_duplicate' : !checks.prefixOk ? 'bad_prefix' : !checks.lengthOk ? 'bad_length' : !checks.patternOk? 'bad_chars' : 'ok';
      return { checks, severity, expectLen: r.expectLen, actualLen: k.length, label: r.label };
    };

    const maskKey = (k) => {
      const s = String(k || '');
      if (s.length <= 12) return '•'.repeat(s.length);
      return s.slice(0, 13) + '•'.repeat(Math.min(18, s.length - 17)) + s.slice(-4);
    };

    const getCurrencySymbol = (curr) => {
      const map = { 'HKD': '$', 'MOP': 'MOP$', 'USD': 'US$', 'TWD': 'NT$', 'JPY': '¥', 'KRW': '₩', 'THB': '฿', 'EUR': '€', 'GBP': '£', 'CNY': '¥', 'AUD': 'A$', 'CAD': 'C$', 'SGD': 'S$' };
      return map[curr?.toUpperCase()] || curr + ' ';
    };

    const getCurrencyName = (curr) => {
      const map = { 'HKD': '港幣 (HKD)', 'JPY': '日元 (JPY)', 'KRW': '韓圜 (KRW)', 'TWD': '台幣 (TWD)', 'THB': '泰銖 (THB)', 'USD': '美金 (USD)', 'EUR': '歐元 (EUR)', 'GBP': '英鎊 (GBP)', 'CNY': '人民幣 (CNY)' };
      return map[curr?.toUpperCase()] || curr;
    };

    const formatMoney = (amount, curr) => {
      const num = Number(amount || 0);
      const sym = getCurrencySymbol(curr);
      if (['JPY', 'KRW'].includes(curr?.toUpperCase())) {
        return `${sym}${Math.round(num)}`;
      }
      return `${sym}${num.toFixed(2)}`;
    };

    function App() {

      const testKey = async () => {
        setKeyTesting(true);

        try {
          if (aiEngine === 'openrouter') {
            const r = await fetch('https://openrouter.ai/api/v1/models', { headers: { 'Authorization': `Bearer ${apiKey.trim()}` } });
            if (r.status === 401) throw new Error('鎖匙被拒（401）—— 請檢查有冇漏字或黏埋舊鎖匙');

            setKeyTestResult({ ok: true, msg: '✓ 鎖匙有效 (Valid API Key)' });
          } else {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey.trim()}`);
            if (!r.ok) throw new Error(r.status === 400 ? '鎖匙無效' : `HTTP ${r.status}`);
            setKeyTestResult({ ok: true, msg: '✓ 鎖匙有效 (Valid API Key)' });
          }
        } catch (e) {
          setKeyTestResult({ ok: false, msg: e.message });

      const saveApiConfig = () => {
        const v = validateKey(apiKey, aiEngine);
        if (v.severity === 'likely_duplicate') {
          setKeyHint(`鎖匙長度 ${v.actualLen} 字，正常應為 ${v.expectLen} 字 —— 似乎兩條黏埋咗。`);

        }
        if (v.severity !== 'ok' && v.severity !== 'empty') {
          setKeyHint('鎖匙格式似乎唔對，請核對頭尾同長度。');
          return;
        }
        setKeyHint('');
        const payload = JSON.stringify({ engine: aiEngine, keys, model: apiModel });
        try {
          // Write the durable copy first. The session copy is a backup for
          // browsers that temporarily reject persistent storage.
          localStorage.setItem('billSplitterApiConfig', payload);
          sessionStorage.setItem('billSplitterApiConfig', payload);
          setRememberKey(true);
        } catch(e) {
          try {
            sessionStorage.setItem('billSplitterApiConfig', payload);
            toast('⚠️ 瀏覽器拒絕永久儲存，只能暫存於目前分頁；請關閉私密瀏覽或允許網站儲存資料', 'error');
          } catch (sessionError) {
            toast('⚠️ 瀏覽器拒絕儲存設定，請關閉私密瀏覽或允許網站儲存資料', 'error');
            return;
          }
        }
        setIsEditingKey(false);
        setShowSettings(false);
        toast('✅ 設定已永久記存於本機');
      };

      const forgetApiKey = () => {
        if(window.confirm("確定要清除鎖匙嗎？這將會刪除您本機上的設定。")) {
          try { localStorage.removeItem('billSplitterApiConfig'); sessionStorage.removeItem('billSplitterApiConfig'); } catch(e) {}
          setApiKey(''); setIsEditingKey(true); setRememberKey(false);
          toast('🗑️ 已清除鎖匙', 'error');
        }
      };

      const saveCurrentRecord = () => {
        if (!results) return;
        const billTotal = items.reduce((sum, item) => sum + toNum(item.total), 0) + toNum(taxAmount);
        const newRecord = { id: Date.now(), date: results.date, payer, totalAmount: billTotal, currency: results.currency, simplifiedText: getSimplifiedResult(), detailedText: getDetailedResult('zh'), detailedFullText: getDetailedResult('full') };
        setSavedHistory([newRecord, ...savedHistory]);
        setIsSaved(true);
        toast('✅ 紀錄已成功儲存！');
      };

      const deleteRecord = (id) => { 
        if (window.confirm("確定刪除此歷史紀錄？資料將無法復原。")) { setSavedHistory(savedHistory.filter(r => r.id !== id)); }
      };

      const exportCSV = () => {
        if (savedHistory.length === 0) return;
        const headers = ['日期', '墊支人', '總金額', '貨幣', '追數版內容', '詳細版內容'];
        const escapeCSV = (str) => { if (str === null || str === undefined) return '""'; return `"${String(str).replace(/"/g, '""')}"`; };
        const rows = savedHistory.map(record => [ escapeCSV(record.date), escapeCSV(record.payer), escapeCSV(record.totalAmount?.toFixed(2)), escapeCSV(record.currency), escapeCSV(record.simplifiedText), escapeCSV(record.detailedText) ].join(','));
        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.setAttribute('download', `分帳紀錄_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
        toast('✅ 成功匯出 CSV！');
      };

      const handleGoToStep1 = () => { 
        setStepError(''); setItems([]); setFriendsReplies(''); setResults(null); 
        setIsSaved(false); setTaxAmount(''); setTaxNote(''); 
        setCurrency('HKD'); setDetectedCurrency('HKD'); setPaymentMethod('轉數快 (FPS)'); setStep(1); 
      };
      
      const handleGoToStep2 = (manual = false) => { setStepError(''); if (manual) setItems([]); setStep(2); };
      
      const handleGoToStep3 = () => {
        setStepError('');
        if (items.length === 0) { setStepError("⚠️ 請至少新增一個項目！"); return; }
        for (let i = 0; i < items.length; i++) {

        if (!friendsReplies.trim()) { setStepError("⚠️ 尚未貼上朋友的認領回覆！"); focusField('replies'); return; }

      const jumpToStep = (target) => {

      const onFocusReplies = (e) => {

      const triggerUpload = () => {
        if (!apiKey.trim()) { toast('⚠️ 請先前往設定輸入 API 鎖匙', 'error'); setShowSettings(true); return; }
        if(fileInputRef.current) fileInputRef.current.click();

      const triggerCamera = () => {
        if (!apiKey.trim()) { toast('⚠️ 請先前往設定輸入 API 鎖匙', 'error'); setShowSettings(true); return; }
        if (!navigator.mediaDevices?.getUserMedia) {

        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
          .then(stream => {

      };

      const closeCamera = () => {
        if (cameraStreamRef.current) {

        setCameraOpen(false);
      };

      const captureCameraPhoto = () => {
        const video = cameraVideoRef.current;
        if (!video || !video.videoWidth || !video.videoHeight) {
          toast('⚠️ 相機仍在啟動，請稍候再按一次', 'error');
          return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (!blob) { toast('⚠️ 未能擷取相片，請再試一次', 'error'); return; }
          closeCamera();
          handleFileUpload({ target: { files: [new File([blob], `receipt-camera-${Date.now()}.jpg`, { type: 'image/jpeg' })], value: '' } });
        }, 'image/jpeg', 0.92);
      };

      const handleFileUpload = async (event) => {
        const files = Array.from(event.target.files);
        if (files.length === 0) return;
        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        const totalSize = files.reduce((sum, file) => sum + file.size, 0);
        
        if (files.length > 5) { setUploadError({ main: '一次最多可上傳 5 張圖片', sub: '', action: null }); event.target.value = ''; return; }
        if (files.some(file => !allowedTypes.includes(file.type))) { setUploadError({ main: '只支援 JPG、PNG 或 WebP 圖片格式', sub: '', action: null }); event.target.value = ''; return; }
        if (totalSize > 12 * 1024 * 1024) { setUploadError({ main: '圖片總容量不可超過 12 MB', sub: '請壓縮後再試', action: null }); event.target.value = ''; return; }
        
        setIsAnalyzing(true);
        setUploadError('');
        setProgress(5);
        setProgressText('正在讀取圖片...');
        
        let progressInterval = setInterval(() => {
          setProgress(prev => {
            if (prev < 30) { setProgressText('傳送至 AI 伺服器分析...'); return prev + 15; }
            if (prev < 60) { setProgressText('AI 正在精準提取文字與價錢...'); return prev + 10; }
            if (prev < 85) { setProgressText('整理消費項目與稅費中...'); return prev + 5; }
            if (prev < 98) { setProgressText('即將完成，請稍候...'); return prev + 1; }
            return prev;
          });
        }, 1200);

        try {
          const base64Promises = files.map(file => {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve({ mimeType: file.type, data: reader.result.split(',')[1] });
              reader.onerror = () => reject(new Error(`未能讀取圖片：${file.name}`));
              reader.readAsDataURL(file);
            });
          });
          const imageDataArray = await Promise.all(base64Promises);
          // Keep the last successfully read batch so a transient AI/OCR
          // failure can be retried without selecting the files again.
          setLastImageData(imageDataArray);

          const promptText = `你是一個專門分析單據的 OCR 分帳助手。任務：讀取單據文字，抽取消費項目、稅費，並判斷貨幣，輸出 JSON。不要做任何運算解釋、不要加註解、不要輸出 Markdown。
【語言硬性要求】所有翻譯後的中文（尤其是 items[].name）必須使用「繁體中文-香港（zh-HK）」；禁止輸出簡體字、簡體中文或中國大陸用語。請將單據上的簡體中文、日文或其他語言轉換成香港繁體字，例如「饮料」必須寫成「飲品」、「账单」必須寫成「帳單」、「发票」必須寫成「發票」。不可只複製原文中的簡體字。items[].original 必須保留單據原文，但 items[].name 必須是香港繁體中文。
這裡有 ${files.length} 張單據。請合併成一份清單。
【A. 消費項目 items】"name":繁體中文名稱, "original":單據原文字樣, "ja":日文名稱(如有), "price":單價(數字), "qty":單據數量(數字), "totalQty":可分配總數量(數字，單據冇寫總量就填 null), "unit":單位（件/杯/碟/罐/份等，未知留空）, "total":該項總額(數字)。不可含稅金服務費折扣。
【B. 稅費 taxTotal】附加費用（消費税/服務料/加一/VAT）總和。若已內含填0。"taxNote"：簡短說明。
【C. 結算貨幣 currency】標準3字母代碼(HKD, JPY, TWD等)。無法確定填 HKD。
【D. 單據日期 date】YYYY-MM-DD。無則 null。切勿用今日日期。
【E. 單據總額 receiptTotal】單據上的「最後應付總額」。無則 null。
【F. 輸出格式】嚴格輸出 JSON: {"items":[{"name":"薄餅","original":"Pizza","ja":"","price":120,"qty":1,"totalQty":8,"unit":"件","total":120}],"taxTotal":45,"taxNote":"消費税 ¥45（外税）","currency":"JPY","date":"2026-03-14","receiptTotal":165}`;

          let parsedItems = [];
          let parsedTax = null;
          let parsedTaxNote = '';
          let parsedCurrency = 'HKD';

          if (aiEngine === 'gemini') {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey.trim()}`;
            const imageParts = imageDataArray.map(img => ({ inlineData: { mimeType: img.mimeType, data: img.data } }));
            const payload = { contents: [{ role: "user", parts: [{ text: promptText }, ...imageParts] }], generationConfig: { responseMimeType: "application/json" } };
            const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

            const data = await response.json();

      const calculateSplit = () => {
        setStepError('');
        if (!payer.trim()) { setStepError("⚠️ 請填寫墊支人姓名！"); focusField('payer'); return; }

        const parsed = parseClaims(friendsReplies, items);

        const itemClaimTotals = {};
        items.forEach(item => { itemClaimTotals[item.id] = 0; Object.keys(personClaims).forEach(person => { itemClaimTotals[item.id] += (personClaims[person][item.id] || 0); }); });

        const reconciliationIssues = items.map(item => {
          const totalQty = toNum(item.totalQty);
          if (totalQty <= 0) return null;
          const actualPeople = Object.keys(personClaims).filter(person => claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          const sharePeople = Object.keys(personClaims).filter(person => !claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          if (!actualPeople.length || sharePeople.length) return null;
          const claimedQty = actualPeople.reduce((sum, person) => sum + personClaims[person][item.id], 0);
          const difference = totalQty - claimedQty;
          if (Math.abs(difference) < 0.0001) return null;
          return { itemId: item.id, name: item.name, unit: item.unit || '單位', totalQty, claimedQty, difference, amount: Math.abs(difference) * (toNum(item.total) / totalQty) };
        }).filter(Boolean);
        const hasOverClaim = reconciliationIssues.some(issue => issue.difference < 0);
        if (hasOverClaim) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError('⚠️ 有項目認領數量超過單據總量，請返回修改後再計算。');
          return;
        }
        if (reconciliationIssues.length && !reconciliation?.policy) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError('⚠️ 有實際單位尚未完成數量核對，請選擇剩餘數量由誰承擔。');
          return;
        }

        const personTotals = {}; let totalItemsCost = 0;
        Object.keys(personClaims).forEach(person => { personTotals[person] = { items: [], adjustments: [], subtotal: 0, tax: 0, total: 0 }; });

        items.forEach(item => {
          const totalClaimed = itemClaimTotals[item.id];
          if (totalClaimed <= 0) return;
          const people = Object.keys(personClaims);
          const totalQty = toNum(item.totalQty);
          const canUseActualUnits = totalQty > 0;
          const actualTotal = people.reduce((sum, person) => sum + (canUseActualUnits && claimUnits[person]?.[item.id] ? (personClaims[person][item.id] || 0) : 0), 0);
          const shareTotal = people.reduce((sum, person) => sum + (!(canUseActualUnits && claimUnits[person]?.[item.id]) ? (personClaims[person][item.id] || 0) : 0), 0);
          const unitValue = toNum(item.total) / totalQty;
          const actualCostTotal = actualTotal > 0 ? actualTotal * unitValue : 0;
          const remainingCost = Math.max(0, toNum(item.total) - actualCostTotal);
          people.forEach(person => {
            const claimedQty = personClaims[person][item.id] || 0;
            if (claimedQty <= 0) return;
            const enteredUnit = claimUnits[person]?.[item.id] || '';
            const isActualUnit = canUseActualUnits && Boolean(enteredUnit);
            const cost = isActualUnit
              ? claimedQty * unitValue
              : (actualTotal > 0 ? (shareTotal > 0 ? claimedQty / shareTotal * remainingCost : 0) : claimedQty / totalClaimed * toNum(item.total));
            personTotals[person].items.push({ name: item.name, original: item.original || '', ja: item.ja || '', id: item.id, amount: cost, qty: claimedQty, totalClaimed, unit: enteredUnit, unitName: item.unit || '', isActualUnit });
            personTotals[person].subtotal += cost; totalItemsCost += cost;

        });

        reconciliationIssues.forEach(issue => {

            personTotals[payer].subtotal += amount; totalItemsCost += amount;
          } else if (policy === 'equal') {
            const claimants = Object.keys(personClaims).filter(person => personClaims[person][item.id] > 0);
            claimants.forEach(person => {
              const share = amount / claimants.length;
              personTotals[person].adjustments.push({ name: item.name, qty: issue.difference / claimants.length, unit: issue.unit, amount: share, reason: '已認領人士平均承擔未認領數量' });
              personTotals[person].subtotal += share; totalItemsCost += share;

            personTotals[person].subtotal += amount; totalItemsCost += amount;

          personTotals[person].tax = taxShare; personTotals[person].total = personTotals[person].subtotal + taxShare;

      const getSimplifiedResult = () => {

          return (
              <React.Fragment>
                  {/* 小巧底欄 (點擊觸發彈出視窗) */}
                  <div role="status" aria-live="polite" onClick={() => setExpanded(true)} className={`fixed bottom-0 left-0 right-0 z-30 border-t ${TONE.bg} ${TONE.border} shadow-[0_-2px_10px_rgba(0,0,0,0.05)] cursor-pointer hover:brightness-95 transition-all`} style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
                      <div className={`flex items-center gap-2.5 px-3 ${kbOpen ? 'py-1.5' : 'py-2'}`}>
                          <span className="shrink-0 text-sm leading-none">{TONE.dot}</span>
                          <div className="flex-1 min-w-0">
                              <div className={`font-bold text-xs leading-tight line-clamp-1 ${TONE.text}`}>
                                  {top.main} {statuses.length > 1 && <span className="opacity-70 ml-1">(+{statuses.length - 1})</span>}
                              </div>
                              {!kbOpen && top.sub && (<div className="text-[10px] text-slate-500 font-medium mt-0.5 leading-tight line-clamp-1">{top.sub}</div>)}
                          </div>
                          {!kbOpen && (
                              <div className="shrink-0 text-[10px] font-bold text-slate-500 bg-white/80 px-2 py-1 rounded-md border border-slate-500 shadow-sm">
                                  點擊展開 ⤴
                              </div>
                          )}
                      </div>
                  </div>

                  {/* 彈出視窗 (Modal) - 顯示完整文字，不截斷 */}
                  {expanded && (
                      <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-in fade-in duration-200" onClick={() => setExpanded(false)}>
                          <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden mb-4 sm:mb-0 animate-in slide-in-from-bottom-4 duration-300 border border-slate-400" onClick={e => e.stopPropagation()}>
                              <div className="p-4 border-b border-slate-400 flex justify-between items-center bg-slate-50">
                                  <h3 className="font-bold text-slate-800 text-base">系統提示與建議 ({statuses.length})</h3>
                                  <button onClick={() => setExpanded(false)} className="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-slate-400 text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors">
                                      <Icon path={icons.x} size={16}/>
                                  </button>
                              </div>
                              <div className="max-h-[60vh] overflow-y-auto p-3 space-y-3 bg-slate-50/50">
                                  {statuses.map(s => {
                                      const ST = { 1: { dot: '🔴', bg: 'bg-red-50', text: 'text-red-800', border: 'border-red-500' }, 2: { dot: '🟠', bg: 'bg-orange-50', text: 'text-orange-800', border: 'border-orange-500' }, 3: { dot: '🟡', bg: 'bg-amber-50', text: 'text-amber-900', border: 'border-amber-500' }, 4: { dot: '🔵', bg: 'bg-blue-50', text: 'text-blue-800', border: 'border-blue-500' }, 5: { dot: '🟢', bg: 'bg-brand-50', text: 'text-brand-800', border: 'border-brand-500' }, 6: { dot: '⚪', bg: 'bg-white', text: 'text-slate-700', border: 'border-slate-500' } }[s.level] || { dot: '⚪', bg: 'bg-white', text: 'text-slate-700', border: 'border-slate-500' };
                                      return (
                                          <div key={s.id} className={`flex flex-col gap-2 p-3.5 rounded-xl border ${ST.border} shadow-sm ${ST.bg}`}>
                                              <div className="flex items-start gap-2.5">
                                                  <span className="shrink-0 text-base mt-0.5">{ST.dot}</span>
                                                  <div className="flex-1">
                                                      <div className={`font-bold text-sm leading-relaxed ${ST.text}`}>{s.main}</div>
                                                      {s.sub && <div className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{s.sub}</div>}
                                                  </div>
                                              </div>
                                              {s.action && (
                                                  <div className="flex justify-end mt-2">
                                                      <button onClick={() => { s.action.run(); setExpanded(false); }} className="px-4 py-2 bg-white border border-slate-500 rounded-lg text-xs font-bold shadow-sm text-slate-800 hover:bg-slate-50 active:scale-[0.98] transition-all">
                                                          {s.action.label} →
                                                      </button>
                                                  </div>
                                              )}
                                          </div>
                                      );
                                  })}
                              </div>
                          </div>
                      </div>
                  )}
              </React.Fragment>
          );
      };

      return (
        <React.Fragment>
          {/* Header */}
          <header className="bg-white border-b border-slate-400 sticky top-0 z-20 shadow-sm backdrop-blur-md bg-white/90">
            <div className="w-full px-4 py-3.5 flex items-center justify-between max-w-2xl mx-auto">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-brand-600 text-white rounded-xl flex items-center justify-center shadow-inner shrink-0">
                  <Icon path={icons.calculator} size={22} />
                </div>
                <h1 className="text-xl font-extrabold text-slate-800 tracking-tight">分帳管家 <span className="text-brand-600 font-black">Pro</span></h1>
              </div>
              <div className="flex items-center gap-2">
                {(showHistory || showSettings || showTutorial) ? (
                  <button onClick={() => {setShowHistory(false); setShowSettings(false); setShowTutorial(false);}} className="flex items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition-colors border border-slate-400">
                    <Icon path={icons.arrowLeft} size={16}/> 返回
                  </button>
                ) : (
                  <React.Fragment>
                    <button onClick={() => setShowTutorial(true)} title="新手教學" className="flex items-center gap-1.5 px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-500 rounded-lg text-sm font-semibold transition-colors">
                      <Icon path={icons.book} size={16}/> 教學
                    </button>
                    <button onClick={() => setShowSettings(true)} title="設定" className="flex items-center gap-1.5 px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-400 rounded-lg text-sm font-semibold transition-colors">
                      <Icon path={icons.settings} size={16}/>
                    </button>
                    <button onClick={() => setShowHistory(true)} title="紀錄" className="flex items-center gap-1.5 px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-400 rounded-lg text-sm font-semibold transition-colors">
                      <Icon path={icons.history} size={16}/>
                    </button>
                  </React.Fragment>
                )}
              </div>
            </div>
            
            {/* Steps Indicator */}
            {(!showHistory && !showSettings && !showTutorial) && (
              <div className="bg-slate-50/80 px-4 py-3 border-t border-slate-400 max-w-2xl mx-auto">
                <div className="flex w-full gap-2 mb-2.5">
                  {[1, 2, 3, 4].map(num => (
                    <div key={num} className={`flex-1 h-1.5 rounded-full transition-colors duration-300 ${step > num ? 'bg-brand-500' : step === num ? 'bg-brand-400' : 'bg-slate-300'}`}></div>
                  ))}
                </div>
                <div className="flex items-center justify-between px-1">
                  {STEP_LABELS.map((label, i) => {
                    const num = i + 1;
                    const done = step > num;
                    const active = step === num;
                    return (
                      <button key={num} onClick={() => jumpToStep(num)} className={`flex items-center gap-2 rounded-lg px-2 py-1 -mx-2 transition-all active:scale-[0.98] outline-none ${active ? 'text-brand-700 bg-brand-50' : done ? 'text-slate-600 hover:bg-slate-100' : 'text-slate-400'}`}>
                        <span className={`w-5 h-5 shrink-0 rounded-full flex items-center justify-center text-[11px] font-bold border ${active ? 'bg-brand-600 border-brand-600 text-white shadow-sm' : done ? 'bg-white border-brand-500 text-brand-600' : 'bg-white border-slate-400 text-slate-500'}`}>{done ? '✓' : num}</span>
                        <span className="text-xs font-semibold">{label}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </header>

          <StatusBar statuses={statuses} expanded={statusExpanded} setExpanded={setStatusExpanded} kbOpen={kbOpen} />

          {/* Main Content Area */}
          <main className="w-full px-4 py-6 md:py-8 max-w-2xl mx-auto pb-24">
            
            {/* Step 1: Upload */}
            {step === 1 && !showSettings && !showHistory && !showTutorial && (
              <div className="space-y-6 animate-in fade-in duration-500">
                <div className="flex items-center gap-2 mb-2">
                  <span className="w-8 h-8 rounded-full bg-brand-100 border border-brand-500 text-brand-700 flex items-center justify-center font-bold">1</span>
                  <h2 className="text-2xl font-bold text-slate-800 tracking-tight">上載並分析單據</h2>
                </div>

                <Card className="bg-gradient-to-br from-brand-50 to-white border-brand-500">
                  <button 
                    onClick={() => setShowSettings(true)}
                    className={`w-full flex items-center gap-4 p-4 rounded-xl border transition-all active:scale-[0.99] text-left shadow-sm ${
                      apiKey.trim() 
                        ? 'bg-white border-brand-500 hover:border-brand-600 text-slate-700' 
                        : 'bg-red-50 border-red-500 hover:bg-red-100 text-red-800'
                    }`}
                  >
                    <span className={`w-12 h-12 shrink-0 rounded-full flex items-center justify-center text-white shadow-sm ${apiKey.trim() ? 'bg-brand-500' : 'bg-red-500'}`}>
                      <Icon path={icons.key} size={24}/>
                    </span>
                    <div className="flex-1">
                      <span className="block font-bold text-[15px] mb-0.5">
                        {apiKey.trim() ? `✅ API 金鑰已設定 (${aiEngine === 'openrouter' ? 'OpenRouter' : 'Gemini'})` : '⚠️ 尚未設定 API 金鑰'}
                      </span>
                      <span className={`block text-xs font-medium ${apiKey.trim() ? 'text-slate-500' : 'text-red-600'}`}>
                        {apiKey.trim() ? '系統已準備就緒，可進行高效 AI 辨識' : '點擊此處設定免費金鑰以啟用智能掃描'}
                      </span>
                    </div>
                    <Icon path={icons.settings} size={20} className="shrink-0 text-slate-500"/>
                  </button>
                </Card>

                <div 
                  onClick={!isAnalyzing ? triggerUpload : undefined} 
                  className={`w-full rounded-2xl border border-dashed p-10 flex flex-col items-center justify-center text-center transition-all cursor-pointer ${isAnalyzing ? 'border-brand-500 bg-brand-50 shadow-inner' : 'border-slate-500 bg-white hover:border-brand-500 hover:bg-slate-50 shadow-sm'}`}
                >
                  <input type="file" accept="image/jpeg,image/png,image/webp" multiple className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
                  <input type="file" accept="image/jpeg,image/png,image/webp" capture="environment" className="hidden" ref={cameraInputRef} onChange={handleFileUpload} />
                  
                  {isAnalyzing ? (
                    <div className="w-full max-w-xs mx-auto">
                      <div className="flex justify-between text-sm font-bold text-brand-700 mb-2"><span>{progressText}</span><span>{progress}%</span></div>
                      <div className="w-full bg-brand-100 border border-brand-300 rounded-full h-3 overflow-hidden shadow-inner">
                        <div className="bg-brand-500 h-3 rounded-full transition-all duration-300 ease-out relative overflow-hidden" style={{width: `${progress}%`}}>
                          <div className="absolute inset-0 bg-white/20 animate-pulse"></div>
                        </div>
                      </div>
                      <p className="text-xs text-brand-600/80 mt-4 font-medium">請稍候，AI 正在進行深度解析 (約 10-20 秒)</p>
                    </div>
                  ) : uploadError ? (
                    <div className="flex flex-col items-center max-w-md mx-auto" onClick={(e) => e.stopPropagation()}>
                      <div className="w-20 h-20 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mb-4 shadow-sm border border-amber-300"><Icon path={icons.alert} size={36} /></div>
                      <h3 className="text-lg font-bold text-slate-800">今次未能完整讀取單據</h3>
                      <p className="text-sm font-medium text-slate-600 mt-2">AI 偶爾第一次未能成功辨識，未必係張相有問題；可以用同一張圖片即時再試一次。</p>
                      {uploadError.sub && <p className="text-xs text-slate-500 mt-2 break-words">{uploadError.sub}</p>}
                      {lastImageData.length ? (
                        <Button variant="primary" className="mt-4 w-full sm:w-auto" onClick={retryLastUpload}>↻ 用剛才圖片再試一次</Button>
                      ) : (
                        <Button variant="secondary" className="mt-4 w-full sm:w-auto" onClick={() => { setUploadError(''); triggerUpload(); }}>重新選擇圖片</Button>
                      )}
                    </div>
                  ) : (
                    <div className="flex flex-col items-center">
                      <div className="w-20 h-20 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center mb-4 shadow-sm border border-slate-400 transition-transform group-hover:scale-105"><Icon path={icons.fileImage} size={36} /></div>
                      <h3 className="text-lg font-bold text-slate-800">選擇單據圖片</h3>
                      <p className="text-sm font-medium text-slate-500 mt-2">可以直接影相，或者從手機選擇圖片（最多 5 張）</p>
                      <div className="flex flex-col sm:flex-row gap-3 mt-5 w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
                        <Button variant="primary" className="flex-1 !py-3" onClick={triggerCamera}>📷 直接影相</Button>
                        <Button variant="secondary" className="flex-1 !py-3" onClick={triggerUpload}><Icon path={icons.fileImage} size={18}/> 選擇圖片</Button>
                      </div>
                    </div>
                  )}
                </div>

                <div className="flex items-center gap-4 py-2">
                  <div className="h-px bg-slate-400 flex-1"></div>
                  <span className="text-xs font-semibold text-slate-500 uppercase tracking-widest">OR</span>
                  <div className="h-px bg-slate-400 flex-1"></div>
                </div>

                <Button variant="secondary" className="w-full border-slate-500" onClick={() => handleGoToStep2(true)}>
                  手動輸入項目 <Icon path={icons.arrowRight} size={18}/>
                </Button>
              </div>
            )}

            {/* Step 2: Items & Claims */}
            {step === 2 && (
              <div className="space-y-6 animate-in fade-in duration-500">
                <div className="flex items-center gap-2 mb-2">
                  <span className="w-8 h-8 rounded-full bg-brand-100 border border-brand-500 text-brand-700 flex items-center justify-center font-bold">2</span>
                  <h2 className="text-2xl font-bold text-slate-800 tracking-tight">核對項目與朋友認領</h2>
                </div>
                
                <div className="space-y-4">
                  <div className="flex justify-between items-end mb-1">
                    <Label className="!mb-0 text-lg">消費明細清單</Label>
                    <span className="text-sm font-semibold text-brand-700 bg-brand-50 px-2.5 py-1 rounded-md border border-brand-500">共 {items.length} 項</span>
                  </div>
                  
                  {items.map((item, idx) => (
                    <Card key={idx} className="relative overflow-visible !p-4 group">
                      <button onClick={() => removeItem(idx)} className="absolute -top-3 -right-3 w-8 h-8 bg-white border border-slate-400 text-slate-500 hover:text-red-700 hover:border-red-500 hover:bg-red-50 rounded-full flex items-center justify-center shadow-sm transition-colors z-10 opacity-0 group-hover:opacity-100 md:opacity-100">
                        <Icon path={icons.trash} size={14} />
                      </button>
                      <div className="grid gap-4">
                        <div>
                          <label className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5 block">編號 {item.id} - 名稱</label>
                          <input type="text" ref={el => fieldRefs.current[`item-name-${idx}`] = el} value={item.name} onChange={(e) => updateItem(idx, 'name', e.target.value)} onKeyDown={(e) => handleItemKeyDown(e, 'name', idx)} className="w-full text-base font-semibold text-slate-800 border-b border-slate-500 focus:border-brand-500 bg-transparent outline-none pb-1" placeholder="輸入項目名稱..." />
                          {(item.original || item.ja) && <div className="mt-1 text-xs font-normal text-slate-500 italic truncate" title={item.original || item.ja}>原文：{item.original || item.ja}</div>}
                        </div>
                        <div className="flex gap-4">
                          <div className="flex-1">
                            <label className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5 block">單價</label>
                            <div className="flex items-center border-b border-slate-500 focus-within:border-brand-500 transition-colors">
                              <span className="text-slate-600 font-bold mr-1.5">{getCurrencySymbol(currency)}</span>
                              <input type="number" ref={el => fieldRefs.current[`item-price-${idx}`] = el} value={item.price} onChange={(e) => updateItem(idx, 'price', e.target.value)} onKeyDown={(e) => handleItemKeyDown(e, 'price', idx)} className="w-full text-base font-semibold text-slate-800 bg-transparent outline-none pb-1 border-none shadow-none focus:ring-0" placeholder="0" />
                            </div>
                          </div>
                          <div className="w-24">
                            <label className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5 block">單據總量</label>
                            <input type="number" ref={el => fieldRefs.current[`item-qty-${idx}`] = el} value={item.totalQty ?? ''} onChange={(e) => updateItem(idx, 'totalQty', e.target.value === '' ? null : e.target.value)} onKeyDown={(e) => handleItemKeyDown(e, 'qty', idx)} className="w-full text-base font-semibold text-slate-800 border-b border-slate-500 focus:border-brand-500 bg-transparent outline-none pb-1 text-center" placeholder="未知可留空" />
                          </div>
                        </div>
                        <div>
                          <label className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5 block">單位（留空＝按份數比例）</label>
                          <input type="text" value={item.unit || ''} onChange={(e) => updateItem(idx, 'unit', e.target.value)} className="w-full text-base font-semibold text-slate-800 border-b border-slate-500 focus:border-brand-500 bg-transparent outline-none pb-1" placeholder="例如：件、杯、碟、罐（可留空）" />
                        </div>
                      </div>
                    </Card>
                  ))}
                  <Button variant="outline" onClick={addItem} className="w-full border-dashed border-brand-500 bg-white/50 hover:bg-brand-50 text-brand-700"><Icon path={icons.plus} size={18}/> 新增一筆項目</Button>
                </div>

                <Card className="bg-slate-50">
                  <div className="flex justify-between items-center gap-4">
                    <div className="flex-1">
                      <Label className="!mb-0.5">附加稅金／服務費</Label>
                      <p className="text-xs text-slate-500 font-medium">如有額外費用請在此填寫</p>
                    </div>
                    <div className="flex items-center w-32 shrink-0 bg-white border border-slate-500 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-brand-500 focus-within:border-brand-500 transition-all shadow-sm">
                      <span className="pl-3 pr-1 text-slate-600 font-bold bg-slate-50 border-r border-slate-500 py-2">{getCurrencySymbol(currency)}</span>
                      <input type="number" placeholder="0" value={taxAmount} onChange={(e) => setTaxAmount(e.target.value)} className="w-full text-base font-bold text-slate-800 p-2 text-right outline-none border-none shadow-none" />
                    </div>
                  </div>
                </Card>

                <div className="border-t border-slate-400 my-6 pt-6 space-y-6">
                  <div>
                    <Label className="flex items-center justify-between mb-3"><span>1. 產生認領表發送給朋友</span></Label>
                    <Button variant="secondary" onClick={() => copyToClipboard(generateFriendTemplate(), '認領模板')} className="w-full text-sm bg-white hover:bg-slate-50 border-slate-500">
                      <Icon path={icons.copy} size={18} className="text-slate-600"/> 一鍵複製認領表單模板
                    </Button>
                  </div>
                  
                  <div>
                    <Label required={friendsReplies.length === 0} className="flex items-center justify-between mb-3">
                      <span>2. 貼上朋友們的回覆</span>
                    </Label>
                    <textarea 
                      ref={el => fieldRefs.current.replies = el} value={friendsReplies} onChange={(e) => {setFriendsReplies(e.target.value); setReconciliation(null); setStepError('');}} onPaste={handlePasteReplies} onFocus={onFocusReplies} onBlur={onBlurReplies}
                      placeholder="在此處貼上朋友們填妥的認領表... (支援連續貼上多份回覆)" 
                      className="w-full h-48 bg-white border border-slate-500 rounded-xl p-4 text-sm font-mono text-slate-700 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none resize-y shadow-inner leading-relaxed">
                    </textarea>
                  </div>
                </div>
                
                <div className="flex gap-3 pt-2">
                  <Button variant="secondary" className="w-1/3 !px-2 border-slate-500" onClick={handleGoToStep1}>上一步</Button>
                  <Button variant="primary" className="w-2/3" onClick={handleGoToStep3}>進行分帳運算 <Icon path={icons.arrowRight} size={18}/></Button>
                </div>
              </div>
            )}

            {/* Step 3: Calculation Settings */}
            {step === 3 && (
              <div className="space-y-6 animate-in fade-in duration-500">
                <div className="flex items-center gap-2 mb-2">
                  <span className="w-8 h-8 rounded-full bg-brand-100 border border-brand-500 text-brand-700 flex items-center justify-center font-bold">3</span>
                  <h2 className="text-2xl font-bold text-slate-800 tracking-tight">結算細節設定</h2>
                </div>

                {reconciliation?.issues?.length > 0 && (
                  <Card className="border-amber-500 bg-amber-50 space-y-4">
                    <div>
                      <h3 className="font-bold text-amber-900 text-lg">⚠️ 實際數量未完全核對</h3>
                      <p className="text-sm text-amber-800 mt-1">只填單位嘅項目必須同單據總量對得上；未認領數量唔會無故消失。</p>
                    </div>
                    <div className="space-y-2">
                      {reconciliation.issues.map(issue => (
                        <div key={issue.itemId} className="bg-white border border-amber-300 rounded-lg p-3 text-sm text-slate-700">
                          <strong>{issue.itemId} {issue.name}</strong>：單據 {issue.totalQty} {issue.unit}，已認領 {issue.claimedQty} {issue.unit}{' '}
                          {issue.difference > 0 ? <span className="font-bold text-amber-700">（尚欠 {issue.difference} {issue.unit}，約 {formatMoney(issue.amount, currency)}）</span> : <span className="font-bold text-red-700">（超出 {-issue.difference} {issue.unit}）</span>}
                        </div>
                      ))}
                    </div>
                    {reconciliation.issues.some(issue => issue.difference < 0) ? (
                      <Button variant="secondary" className="w-full border-red-500 text-red-700" onClick={() => { setReconciliation(null); setStep(2); }}>返回修改認領數量</Button>
                    ) : (
                      <div>
                        <Label required={!reconciliation.policy} className="text-base">剩餘數量由誰承擔？</Label>
                        <div className="grid gap-2 mt-2">

                          } catch(e) {
                            setRememberKey(false);
                            toast('⚠️ 無法儲存到此瀏覽器，請關閉私密瀏覽或允許網站儲存資料', 'error');
                          }
                        }} className="w-5 h-5 mt-0.5 text-brand-600 focus:ring-brand-500 rounded" />
                        <div>
                          <div className="font-bold text-slate-800 text-sm">將金鑰永久儲存於此瀏覽器（建議保持勾選）</div>
                          <div className="text-xs text-slate-600 mt-1 font-medium">按「儲存並驗證」會永久保存在本機端，唔會上傳至任何伺服器。取消勾選只適合公用電腦。</div>
                        </div>
                      </label>
                    </div>
                  </Card>
                  <Button variant="secondary" className="w-full border-slate-500" onClick={() => setShowSettings(false)}>返回系統</Button>
               </div>
            )}

            {cameraOpen && (
              <div className="fixed inset-0 z-[10000] bg-black/95 flex flex-col items-center justify-center p-4" role="dialog" aria-label="相機拍攝">
                <div className="w-full max-w-lg flex items-center justify-between text-white mb-3">
                  <h2 className="text-lg font-bold">影相上載單據</h2>
                  <button type="button" onClick={closeCamera} className="rounded-lg bg-white/15 px-4 py-2 font-semibold">取消</button>
                </div>
                <video ref={cameraVideoRef} playsInline muted autoPlay className="w-full max-w-lg max-h-[68vh] rounded-2xl bg-black object-contain" />
                <p className="text-white/80 text-sm mt-3">將單據放入畫面，按下面按鈕拍攝</p>
                <button type="button" onClick={captureCameraPhoto} className="mt-4 w-20 h-20 rounded-full border-4 border-white bg-brand-500 shadow-lg active:scale-95" aria-label="拍攝相片">
                  <span className="block w-12 h-12 mx-auto rounded-full border-2 border-white/80" />
                </button>
              </div>
            )}
          </main>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
