                  <p className="font-bold text-slate-800 pt-1 mb-2">{tr("例子一：按份數比例分一項 $120 食物")}</p>
                  <div className="bg-slate-50 border border-slate-400 rounded-xl p-4 text-sm space-y-3">
                    <p className="text-slate-800">{tr("阿明填 ")}<strong className="text-brand-700 bg-brand-100 border border-brand-500 px-1.5 py-0.5 rounded">2</strong>{tr("，Cathy 填 ")}<strong className="text-brand-700 bg-brand-100 border border-brand-500 px-1.5 py-0.5 rounded">1</strong>{tr("，即合共 3 份。")}</p>
                    <div className="bg-white border border-slate-400 rounded-lg p-3 text-xs text-slate-600 font-mono shadow-sm">{tr("系統自動計：每份 $40。")}<br/>{tr("阿明 $80，Cathy $40。")}</div>
                    <p className="text-brand-700 font-bold flex items-center gap-1.5 mt-2"><Icon path={icons.check} size={16}/>{tr(" 唔需要知道實際有幾件，填幾多份就按比例分。")}</p>
                  </div>
                  <p className="font-bold text-slate-800 pt-1 mb-2">{tr("例子二：按實際單位分一項 $120 食物")}</p>
                  <div className="bg-slate-50 border border-slate-400 rounded-xl p-4 text-sm space-y-3">
                    <p className="text-slate-800">{tr("單據寫明共 8 件。阿明填 ")}<strong className="text-brand-700 bg-brand-100 border border-brand-500 px-1.5 py-0.5 rounded">{tr("3 件")}</strong>{tr("，即係食咗 3 件。")}</p>
                    <div className="bg-white border border-slate-400 rounded-lg p-3 text-xs text-slate-600 font-mono shadow-sm">{tr("每件 $120 ÷ 8 = $15")}<br/>{tr("阿明應付 3 × $15 = $45。")}</div>
                    <p className="text-slate-600 text-xs font-medium">{tr("如果同一項目有人填「1」而冇寫單位，嗰個人會以剩餘金額按份數比例分攤。")}</p>
                  </div>
                </Accordion>

                <Accordion title={tr("🔑 6. AI 設定與鎖匙")} tone="slate" icon={icons.key}>
                  <p className="text-sm text-slate-800 leading-relaxed mb-3">{bi('讀外語單據要用你自己的免費 OpenRouter 鎖匙。預設免費。鎖匙只留在這部機，請勿發俾朋友。', 'Foreign receipts need your own free OpenRouter key. The default is free. The key stays on this device. Do not send it to friends.')}</p>
                  <div className="bg-slate-50 border border-slate-400 rounded-xl p-3 text-sm space-y-1.5">
                    <p className="font-bold text-slate-800">{tr("記住我的鎖匙（免每次重輸）")}</p>
                    <p className="text-slate-600 text-xs">{tr("在設定勾選「記住鎖匙」，只存本機，唔會上傳。共用電腦請勿勾選。")}</p>
                  </div>
                </Accordion>

                <Button className="w-full mt-2" onClick={() => setShowTutorial(false)}>
                  <Icon path={icons.check} size={18}/>{bi(' 我明白了，去影單據', ' Got it — scan a receipt')}</Button>
              </div>
            )}

            {showHistory && (
              <div className="space-y-6 animate-in fade-in duration-300">
                <div className="flex justify-between items-center mb-2">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-slate-200 text-slate-700 border border-slate-400 rounded-xl flex items-center justify-center shadow-sm shrink-0">
                      <Icon path={icons.history} size={22}/>
                    </div>
                    <h2 className="text-2xl font-bold text-slate-800 tracking-tight">{tr("歷史紀錄")}</h2>
                  </div>
                  {savedHistory.length > 0 && (
                    <button onClick={exportCSV} className="flex items-center gap-1.5 px-3 py-2 bg-white text-slate-800 hover:bg-slate-50 border border-slate-500 rounded-lg text-sm font-bold shadow-sm transition-all active:scale-[0.98]">
                      <Icon path={icons.download} size={16}/>{tr(" 匯出 CSV")}</button>
                  )}
                </div>

                {savedHistory.length === 0 ? (
                  <Card className="flex flex-col items-center justify-center py-16 text-slate-500">
                    <div className="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4 border border-slate-400"><Icon path={icons.receipt} size={40} className="opacity-60"/></div>
                    <p className="font-bold text-slate-600">{tr("暫無儲存的紀錄")}</p>
                  </Card>
                ) : (
                  <div className="space-y-4">
                    {savedHistory.map(record => (
                      <Card key={record.id} className="!p-0 overflow-hidden group hover:border-brand-500 transition-colors">
                        <div className="bg-slate-50 p-4 flex justify-between items-start border-b border-slate-400">
                          <div>
                            <h3 className="font-bold text-slate-800 text-lg">{record.date}</h3>
                            <p className="text-sm text-slate-600 mt-0.5 font-medium">{tr("墊支人: ")}<span className="font-bold text-slate-800">{record.payer}</span></p>
                          </div>
                          <div className="text-right">
                            <div className="font-bold text-brand-700 text-xl tracking-tight">{formatMoney(record.totalAmount, record.currency)}</div>
                            <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mt-0.5">{record.currency}</div>
                          </div>
                        </div>
                        {!record.reportData && uiLang === 'en' && <p className="px-4 pt-3 text-xs text-amber-800">{bi('已儲存報告：原文語言（舊紀錄不會翻譯）。', 'Saved report: original language (legacy records are not translated).')}</p>}
                        <p className="px-4 pt-3 text-xs text-slate-600">{bi('複製追數版或詳細版，擇一即可。', 'Copy either the summary or the detailed version; one is enough.')}</p>
                        <div className="p-4 bg-white flex flex-wrap gap-2.5">
                          <Button variant="outline" className="flex-1 !py-2 !text-sm !px-2 bg-white hover:bg-brand-50 border-slate-400 text-slate-700 hover:text-brand-700 hover:border-brand-500" onClick={() => copyToClipboard(getSavedReportText(record, 'simplified'), bi('追數版', 'Summary'))}><Icon path={icons.copy} size={16}/> {bi('追數版', 'Summary')}</Button>
                          <Button variant="secondary" className="flex-1 !py-2 !text-sm !px-2 bg-white border-slate-500" onClick={() => copyToClipboard(getSavedReportText(record, 'detailed'), bi('詳細版', 'Detailed'))}><Icon path={icons.copy} size={16}/> {bi('詳細版', 'Detailed')}</Button>
                          <button onClick={() => deleteRecord(record.id)} className="px-3 py-2 bg-white border border-slate-500 text-slate-500 rounded-xl hover:bg-red-50 hover:text-red-700 hover:border-red-500 shrink-0 transition-colors"><Icon path={icons.trash} size={18}/></button>
                        </div>
                        {Number(record.receiptImageCount) > 0 && (
                          <div className="px-4 pb-4">
                            <p className="text-xs text-slate-600 mb-2">{tr("📎 本機收據副本：")}{record.receiptImageCount}{tr(" 張")}</p>
                            <p className="text-xs text-slate-600 mb-2">{tr("先分享一款純文字報告，再另分享圖片；每次自行在 WhatsApp 選同一收件人並確認。")}</p>
                            <p className="text-xs text-slate-600 mb-2">{bi('文字報告可選追數版或詳細版，毋須兩款都發。', 'Choose the summary or detailed text report; you do not need to send both.')}</p>
                            <div className="grid grid-cols-2 gap-2">
                              <Button variant="outline" className="!w-auto !py-2 !px-2 !text-xs bg-white" onClick={() => shareSavedRecord(record, 'simplified')}>{tr("分享追數版（純文字）")}</Button>
                              <Button variant="secondary" className="!w-auto !py-2 !px-2 !text-xs bg-white" onClick={() => shareSavedRecord(record, 'detailed')}>{tr("分享詳細版（純文字）")}</Button>
                              <Button variant="outline" className="col-span-2 !w-auto !py-2 !px-2 !text-xs bg-white" disabled={!Array.isArray(savedReceiptFiles[record.id]) || !savedReceiptFiles[record.id].length} onClick={() => shareSavedRecord(record, 'receipts')}>{receiptHistoryLoading[record.id] ? tr("正在讀取…") : tr("另分享歷史單據圖片")}</Button>
                            </div>
                            {savedReceiptFiles[record.id] === null && <p className="text-xs text-red-600 mt-2">{tr("此裝置找不到收據圖片；可能已清除網站資料。")}</p>}
                            {Array.isArray(savedReceiptFiles[record.id]) && savedReceiptFiles[record.id].length === 0 && <p className="text-xs text-red-600 mt-2">{tr("本機歷史中沒有收據圖片副本。")}</p>}
                          </div>
                        )}
                      </Card>
                    ))}
                  </div>
                )}
              </div>
            )}

            {showSettings && (
               <div className="space-y-6 animate-in fade-in duration-300">
                  <h2 className="text-2xl font-bold flex items-center gap-2 text-slate-800"><Icon path={icons.settings} className="text-slate-600"/>{tr(" 系統設定")}</h2>
                  <Card><LanguageSwitch value={uiLang} onChange={changeUiLanguage} /></Card>
                  <Card>
                    <Label className="text-base mb-3">{tr("API 服務供應商")}</Label>
                    <div className="mb-6 rounded-xl border border-brand-500 bg-brand-50 p-4">
                      <div className="font-bold text-base text-brand-900">OpenRouter</div>
                      <p className="text-base text-slate-700 font-medium mt-1 leading-relaxed">{bi('用來讀外語單據。預設免費。鎖匙只留在這部機。', 'Used to read foreign receipts. Free by default. The key stays on this device.')}</p>
                    </div>

                    <div className="border-t border-slate-400 pt-6 space-y-5">
                      <div>
                        <Label className="text-base">{bi('識別模型（預設免費）', 'Recognition model (free by default)')}</Label>
                        <select
                          data-testid="model-select"
                          value={resolveBillModel(apiModel, allowPaidModels)}
                          onChange={(event) => {
                            const next = resolveBillModel(event.target.value, allowPaidModels);
                            setApiModel(next);
                          }}
                          className="w-full rounded-xl p-3.5 text-base font-semibold text-slate-800 bg-white"
                        >
                          <optgroup label={bi('免費模型', 'Free models')}>
                            {FREE_MODELS.map(([id, zh, en]) => <option key={id} value={id}>{bi(zh, en)}</option>)}
                          </optgroup>
                          {allowPaidModels && (
                            <optgroup label={bi('進階／可能產生費用', 'Advanced / may cost money')}>
                              {PAID_MODELS.map(([id, zh, en]) => <option key={id} value={id}>{bi(zh, en)}</option>)}
                            </optgroup>
                          )}
                        </select>
                        <p className="text-base text-slate-700 mt-2 leading-relaxed">{!modelUsesFreeTier(apiModel, allowPaidModels)
                          ? bi('你已揀進階模型，可能產生費用。改回免費模型就唔使充值。', 'You selected an advanced model, which may cost money. Switch back to a free model and you do not need to top up.')
                          : resolveBillModel(apiModel, allowPaidModels) === BACKUP_FREE_MODEL
                            ? bi('而家用免費 Nemotron。讀唔到會再試同一模型。', 'Free Nemotron is selected. A failed read retries the same model.')
                            : bi('預設免費 Gemma。讀唔到會再試同一模型，仍然失敗先改試一次免費 Nemotron。', 'Free Gemma is the default. A failed read retries the same model, then tries free Nemotron once.')}</p>
                      </div>

                      <label className="flex items-start gap-3 p-4 bg-amber-50 rounded-xl border border-amber-400 cursor-pointer">
                        <input
                          data-testid="paid-models-opt-in"
                          type="checkbox"
                          checked={allowPaidModels}
                          onChange={(event) => {
                            const enabled = event.target.checked;
                            const nextModel = resolveBillModel(apiModel, enabled);
                            setAllowPaidModels(enabled);
                            setApiModel(nextModel);
                          }}
                          className="w-5 h-5 mt-0.5 text-brand-600 focus:ring-brand-500 rounded"
                        />
                        <div>
                          <div className="font-bold text-slate-800 text-base">{bi('進階／可能產生費用', 'Advanced / may cost money')}</div>
                          <p className="text-base text-slate-700 mt-1 leading-relaxed">{bi('預設關閉。開啟後先可以揀較快的付費模型，可能會用到你 OpenRouter 帳戶的付費額度。保持關閉就只會用免費模型，唔使充值。', 'Off by default. Turn this on before you can choose a faster paid model. That may use paid credit on your OpenRouter account. Leave it off and only free models are used, with no top-up.')}</p>
                        </div>
                      </label>

                      <div>
                        <Label className="text-base flex justify-between items-center">{bi('免費 API 金鑰', 'Free API key')}<a href="https://openrouter.ai/settings/keys" target="_blank" rel="noreferrer" className="text-sm text-brand-700 hover:text-brand-800 underline font-semibold">{bi('取得免費金鑰 ↗', 'Get a free key ↗')}</a>
                        </Label>
                        {!isEditingKey && apiKey ? (
                          <div className="bg-slate-50 border border-slate-400 rounded-xl p-4 mt-2">
                            <div className="font-mono text-sm text-slate-700 bg-white p-2.5 rounded-lg border border-slate-500 mb-3 break-all font-semibold">{maskKey(apiKey)}</div>
                            <div className="grid grid-cols-2 gap-2">
                              <Button variant="secondary" className="min-w-0 !px-2 !py-2 border-slate-500" onClick={() => { editKeyRef.current = apiKey; setApiKey(''); setIsEditingKey(true); }}><Icon path={icons.edit} size={16}/>{tr(" 更換")}</Button>
                              <Button variant="secondary" className="min-w-0 !px-2 !py-2 text-blue-700 border-slate-500" onClick={testKey}>{tr("🧪 測試連線")}</Button>
                              <Button variant="secondary" className="col-span-2 !py-2 !px-3 text-red-700 border-red-500 hover:bg-red-50" onClick={forgetApiKey}><Icon path={icons.trash} size={16}/>{bi('移除金鑰', 'Remove key')}</Button>
                            </div>
                            {keyTestResult && <div className={`text-sm font-bold mt-3 px-3 py-2 rounded-lg border ${keyTestResult.ok ? 'bg-brand-50 text-brand-800 border-brand-500' : 'bg-red-50 text-red-800 border-red-500'}`}>{tr(keyTestResult.msg)}</div>}
                          </div>
                        ) : (
                          <div className="mt-2 space-y-3">
                            <div className="relative">
                              <input
                                type={showKey ? 'text' : 'password'} value={apiKey} onChange={(e) => setApiKey(e.target.value)}
                                placeholder={tr("在此貼上您的 API 金鑰")}
                                className="w-full rounded-xl p-3.5 pr-12 font-mono text-base focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 outline-none transition-all"
                              />
                              <button onMouseDown={() => setShowKey(true)} onMouseUp={() => setShowKey(false)} onTouchStart={() => setShowKey(true)} onTouchEnd={() => setShowKey(false)} className="absolute right-3 top-3.5 text-slate-500 hover:text-slate-800"><Icon path={icons.eye} size={20}/></button>
                            </div>
                            <div className="flex gap-2">
                              {editKeyRef.current && <Button variant="secondary" className="flex-1 !py-2.5 text-sm border-slate-500" onClick={() => { setApiKey(editKeyRef.current); setIsEditingKey(false); editKeyRef.current=''; }}>{tr("取消修改")}</Button>}
                              <Button variant="primary" className="flex-1 !py-2.5 text-sm" disabled={!apiKey.trim()} onClick={saveApiConfig}>{tr("💾 儲存並驗證")}</Button>
                            </div>
                          </div>
                        )}
                      </div>

                      <label className="flex items-start gap-3 p-4 bg-slate-50 rounded-xl border border-slate-400 cursor-pointer hover:bg-slate-100 transition-colors">
                        <input type="checkbox" checked={rememberKey} onChange={(e) => {
                          const shouldRemember = e.target.checked;
                          setRememberKey(shouldRemember);
                          try {
                            if (shouldRemember && apiKey.trim()) {
                              const payload = JSON.stringify({ engine: 'openrouter', keys: { openrouter: apiKey.trim() }, model: resolveBillModel(apiModel, allowPaidModels), allowPaidModels: allowPaidModels === true });
                              localStorage.setItem('billSplitterApiConfig', payload);
                              sessionStorage.setItem('billSplitterApiConfig', payload);
                            } else if (!shouldRemember) {
                              localStorage.removeItem('billSplitterApiConfig');
                            }
                          } catch(e) {
                            setRememberKey(false);
                            toast(tr("⚠️ 無法儲存到此瀏覽器，請關閉私密瀏覽或允許網站儲存資料"), 'error');
                          }
                        }} className="w-5 h-5 mt-0.5 text-brand-600 focus:ring-brand-500 rounded" />
                        <div>
                          <div className="font-bold text-slate-800 text-base">{tr("將金鑰永久儲存於此瀏覽器（建議保持勾選）")}</div>
                          <div className="text-base text-slate-700 mt-1 font-medium leading-relaxed">{tr("按「儲存並驗證」會永久保存在本機端，唔會上傳至任何伺服器。取消勾選只適合公用電腦。")}</div>
                        </div>
                      </label>
                    </div>
                  </Card>
                  <Button variant="secondary" className="w-full border-slate-500" onClick={() => setShowSettings(false)}>{tr("返回系統")}</Button>
               </div>
            )}

            {cameraOpen && (
              <div className="fixed inset-0 z-[10000] bg-black/95 flex flex-col items-center justify-center p-4" role="dialog" aria-label={tr("相機拍攝")}>
                <div className="w-full max-w-lg flex items-center justify-between text-white mb-3">
                  <h2 className="text-lg font-bold">{tr("影相上載單據")}</h2>
                  <button type="button" onClick={closeCamera} className="rounded-lg bg-white/15 px-4 py-2 font-semibold">{tr("取消")}</button>
                </div>
                <video ref={cameraVideoRef} playsInline muted autoPlay className="w-full max-w-lg max-h-[68vh] rounded-2xl bg-black object-contain" />
                <p className="text-white/80 text-sm mt-3">{tr("將單據放入畫面，按下面按鈕拍攝")}</p>
                <button type="button" onClick={captureCameraPhoto} className="mt-4 w-20 h-20 rounded-full border-4 border-white bg-brand-500 shadow-lg active:scale-95" aria-label={tr("拍攝相片")}>
                  <span className="block w-12 h-12 mx-auto rounded-full border-2 border-white/80" />
                </button>
              </div>
            )}
          </main>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
