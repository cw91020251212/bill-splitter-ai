      alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
      history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
      key: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',

      book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',

      chevronDown: '<path d="m6 9 6 6 6-6"/>',
      chevronUp: '<path d="m18 15-6-6-6 6"/>',
      arrowLeft: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
      send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
      eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
    };

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button', ...rest }) => {
      const baseStyle = "flex items-center justify-center gap-2 px-5 py-3.5 rounded-xl font-semibold text-base transition-all duration-200 active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed w-full md:w-auto outline-none focus:ring-2 focus:ring-offset-2";
      const variants = {
        primary: "bg-brand-600 text-white hover:bg-brand-700 shadow-md focus:ring-brand-500 border border-brand-700",
        secondary: "bg-white text-slate-800 border border-slate-400 hover:bg-slate-100 shadow-sm focus:ring-slate-400",
        outline: "border border-brand-600 text-brand-700 bg-transparent hover:bg-brand-50 focus:ring-brand-500",
        danger: "bg-red-600 text-white hover:bg-red-700 shadow-md focus:ring-red-500 border border-red-700",
      };
      const hasNonGreenBackground = className.split(/\s+/).some(token => /^!?bg-/.test(token) && !/^!?bg-(?:brand|emerald|green)-/.test(token));
      const greenActionClass = variant === 'primary' && !hasNonGreenBackground ? 'green-action' : '';
      return <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${greenActionClass} ${className}`} {...rest}>{children}</button>;
    };

    const Card = ({ children, className = '', ...rest }) => (
      <div className={`app-card bg-white rounded-2xl shadow-card border border-slate-400 p-5 md:p-6 ${className}`} {...rest}>{children}</div>
    );

    const Label = ({ children, required, className = '', htmlFor }) => (
      <label htmlFor={htmlFor} className={`font-bold text-slate-800 block mb-1.5 ${className}`}>
        {children}
        {required && <span className="ml-2 inline-block px-2 py-0.5 rounded bg-red-50 text-red-700 text-xs tracking-wide border border-red-500">{tr("必填")}</span>}
      </label>
    );

    const Accordion = ({ title, icon, children, defaultOpen = false, tone = 'slate', testId, onToggle }) => {
      const [open, setOpen] = useState(defaultOpen);
      const tones = {
        slate: 'bg-white border border-slate-500',
        amber: 'bg-amber-50 border border-amber-500',
        emerald: 'bg-emerald-50 border border-brand-500',
        blue: 'bg-blue-50 border border-blue-500',
      };
      return (
        <div className={`rounded-xl border overflow-hidden ${tones[tone]} shadow-sm`}>
          <button data-testid={testId} aria-expanded={open} onClick={() => { const nextOpen = !open; setOpen(nextOpen); onToggle?.(nextOpen); }} className="w-full flex items-center justify-between gap-3 p-4 text-left outline-none hover:bg-slate-50 transition-colors">
            <span className="flex items-center gap-2.5 font-bold text-slate-800 text-base">
              {icon && <Icon path={icon} size={20} className="text-slate-600 shrink-0"/>}
              {title}
            </span>
            <Icon path={open ? icons.chevronUp : icons.chevronDown} size={20} className="text-slate-500 shrink-0"/>
          </button>
          {open && <div className="px-4 pb-4 pt-1 text-sm text-slate-700 leading-relaxed space-y-3">{children}</div>}
        </div>
      );
    };

    // Free vision cascade lives in ocr-cascade.js. This app only offers free models.
    const Ocr = window.OcrCascade;
    const DEFAULT_FREE_MODEL = Ocr.DEFAULT_FREE_MODEL;
    const FREE_MODELS = Ocr.FREE_MODELS;
    const resolveBillModel = Ocr.resolveBillModel;
    const modelUsesFreeTier = Ocr.modelUsesFreeTier;
    const describeOpenRouterFailure = Ocr.describeOpenRouterFailure;
    const isTransientOcrFailure = Ocr.isTransientOcrFailure;
    const OCR_ATTEMPT_MS = Ocr.OCR_ATTEMPT_MS;
    const FREE_OCR_MAX_ATTEMPTS = Ocr.TRANSIENT_ATTEMPTS;
    const OCR_RETRY_BACKOFF_MS = Ocr.OCR_RETRY_BACKOFF_MS;
    const FREE_AI_MAX_EDGE = 1280;
    const FREE_AI_JPEG_QUALITY = 0.6;
    const PAID_AI_MAX_EDGE = 1600;
    const PAID_AI_JPEG_QUALITY = 0.72;

    const LOCAL_PADDLE_MODEL_ID = 'local/paddleocr-js';
    const RECEIPT_JSON_IMPORT_PROMPT_ZH = `請讀取我附上的收據相片（如有多張，合併成同一張收據），辨認商品、金額並翻譯成香港繁體中文，再整理成一個有效 JSON 物件。優先把結果附成一個可下載的 UTF-8 JSON 檔，檔名 bill.json，檔案只包含該 JSON 物件；支援附件時不要只在聊天中顯示文字或改成 .txt，也不要拆成多個檔案。若此介面不能建立可下載附件，請在同一則回覆一次輸出完整 JSON，方便整段複製，不要分段、省略欄位或加其他文字。商品 name 用香港繁體中文，original 保留收據原文。只把實際商品放在 items；稅、服務費、折扣放在 adjustments；小計、合計、應付及找零不可放入 items。看不清或沒有印出的欄位用 null 或空字串，勿估算、勿捏造。
格式：{"items":[{"name":"拉麵","nameEn":"","original":"ラーメン","ja":"","price":100,"qty":1,"totalQty":null,"unit":"碗","total":100}],"adjustments":[{"label":"消費税","kind":"tax","ratePercent":8,"amount":null,"baseAmount":null,"application":"separate","scope":"receipt","itemIndex":null,"order":0}],"taxTotal":null,"taxNote":"","currency":"JPY","date":"2026-03-14","receiptTotal":108}
沒有稅費時 adjustments 必須為 []。currency 用 ISO 三位碼；不確定的 date 或 receiptTotal 用 null。`;
    const RECEIPT_JSON_IMPORT_PROMPT_EN = `Read the receipt photo(s) I attach (combine multiple photos if they belong to the same receipt), identify the items and amounts, translate item names into Hong Kong Traditional Chinese, and return one valid JSON object. Prefer to attach the result as one downloadable UTF-8 JSON file named bill.json, containing only that object. When attachments are supported, do not just display chat text, substitute a .txt file, or split the result across files. If this interface cannot create downloadable attachments, output the complete JSON once in one contiguous, copyable reply, without splitting it, omitting fields, or adding other text. Preserve the printed text in original. Put actual purchased goods in items only; put tax, service fees, and discounts in adjustments. Never list subtotal, total due, payment, or change as an item. Use null or an empty string for fields that are unclear or not printed; do not estimate or invent anything.
Format: {"items":[{"name":"拉麵","nameEn":"ramen","original":"ラーメン","ja":"","price":100,"qty":1,"totalQty":null,"unit":"bowl","total":100}],"adjustments":[{"label":"消費税","kind":"tax","ratePercent":8,"amount":null,"baseAmount":null,"application":"separate","scope":"receipt","itemIndex":null,"order":0}],"taxTotal":null,"taxNote":"","currency":"JPY","date":"2026-03-14","receiptTotal":108}
Use an empty adjustments array if there are no fees or discounts. Use a three-letter ISO currency code; use null for an unknown date or receiptTotal.`;
    const recognitionModelLabel = modelId => {
      const value = String(modelId || '');
      if (value === 'local-json-import') return bi('上次：JSON 檔（本機匯入）', 'Previous input: text JSON (local import)');
      const isTextInput = value.startsWith('text-input|');
      const modelValue = isTextInput ? value.slice('text-input|'.length) : value;
      const parts = modelValue.split('|');
      const isLocal = parts[0] === LOCAL_PADDLE_MODEL_ID;
      const cloudModelId = isLocal ? parts.slice(1).join('|') : modelValue;
      const row = FREE_MODELS.find(model => model[0] === cloudModelId);
      const zh = row?.[1] || Ocr.shortLabel(cloudModelId);
      const en = row?.[2] || zh;
      if (isTextInput) return bi(`上次：文字整理＋${zh}`, `Previous: text input + ${en}`);
      return isLocal ? bi(`上次：本機 PaddleOCR.js＋${zh}`, `Previous: local PaddleOCR.js + ${en}`) : bi(`上次：${zh}`, `Previous model: ${en}`);
    };

    const waitForOcrBackoff = (ms, signal) => new Promise((resolve, reject) => {
      if (signal?.aborted) {
        const aborted = new Error('Aborted');
        aborted.name = 'AbortError';
        reject(aborted);
        return;
      }
      const timer = setTimeout(() => {
        signal?.removeEventListener('abort', onAbort);
        resolve();
      }, ms);
      const onAbort = () => {
        clearTimeout(timer);
        const aborted = new Error('Aborted');
        aborted.name = 'AbortError';
        reject(aborted);
      };
      signal?.addEventListener('abort', onAbort, { once: true });
    });

    const toNum = (v) => {
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      if (v === null || v === undefined) return 0;
      const m = String(v).replace(/[^\d.\-]/g, '');
      const n = parseFloat(m);
      return isNaN(n) ? 0 : n;
    };

    const extractPayload = rawText => ReceiptMath.extractPayload(rawText);

    // Free vision models often copy the receipt into name. Keep name in Hong Kong
    // Traditional Chinese and leave kana/hangul in original (and ja only when different).
    const RECEIPT_NAME_PENDING = '（未譯，見原文）';
    const RECEIPT_NAME_PENDING_EN = 'See original';

            const qty = parsedValue.qty;

            if (!isNaN(qty)) {
                if (qty > 0) {
                    claims[currentPerson][lastSeenId] = qty;
                    claimUnits[currentPerson][lastSeenId] = parsedValue.unit;
                    totalClaimLines++;
                } else if (qty < 0) {
                    issues.push({ type: 'qty_negative', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
                } else {
                    issues.push({ type: 'qty_zero', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
                }
                lastSeenId = null;
            } else {
                issues.push({ type: 'qty_not_number', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });

           issues.push({ type: 'no_person', line: lineNo, text: cleanLine.substring(0, 40) });
        }
      });

      const peopleWithNoClaims = people.filter(p => !claims[p] || Object.keys(claims[p]).length === 0);

      let s = String(raw || '');
      const notes = [];
      s = s.replace(/[\uff01-\uff5e]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0));
      const before = s;
      s = s.replace(/[\u200B-\u200D\uFEFF\u00A0\s]/g, '');
      if (s !== before) notes.push('removed_invisible');
      s = s.replace(/^["'「『]+|["'」』]+$/g, '');
      s = s.replace(/^Bearer/i, '');
      for (const prefix of ['sk-or-v1-', 'sk-or-']) {
        const idx = s.lastIndexOf(prefix);
        if (idx > 0) {
          s = s.slice(idx);
          notes.push('deduped');
          break;
        }
      }
      return { key: s, notes };

        prefixOk:   k.startsWith(r.prefix),
        lengthOk:   k.length === r.expectLen,
        charsOk:    /^[\x21-\x7E]+$/.test(k),
        patternOk:  r.pattern.test(k)
      };
      const tooLong  = k.length > r.expectLen * 1.5;
      const severity = !checks.notEmpty ? 'empty' : tooLong ? 'likely_duplicate' : !checks.prefixOk ? 'bad_prefix' : !checks.lengthOk ? 'bad_length' : !checks.patternOk? 'bad_chars' : 'ok';
      return { checks, severity, expectLen: r.expectLen, actualLen: k.length, label: r.label };

      let settled = false;

      const fail = (error) => { if (!settled) { settled = true; clearTimeout(timer); reject(error); } };
      if (timeoutMs) timer = setTimeout(() => fail(new Error('開啟本機儲存逾時')), timeoutMs);
      request.onupgradeneeded = () => {
        if (settled) { request.transaction.abort(); return; }
        if (!request.result.objectStoreNames.contains(RECEIPT_STORE_NAME)) {
          request.result.createObjectStore(RECEIPT_STORE_NAME, { keyPath: 'recordId' });
        }
      };
      request.onsuccess = () => {
        if (settled) { request.result.close(); return; }
        settled = true; clearTimeout(timer); resolve(request.result);
      };
      request.onerror = () => fail(request.error || new Error('無法開啟本機單據儲存'));

      return new Blob([bytes], { type: image.mimeType || 'image/jpeg' });

    const createRedactedReceiptFile = (imageData, masks, index, quality = 0.92) => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => {
        try {
          const maxDimension = 4096;
          const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('無法處理圖片');
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          context.fillStyle = '#000000';
          (masks || []).forEach(mask => {
            const x = Math.max(0, Math.min(1, mask.x));
            const y = Math.max(0, Math.min(1, mask.y));
            const right = Math.max(x, Math.min(1, mask.x + mask.width));
            const bottom = Math.max(y, Math.min(1, mask.y + mask.height));
            context.fillRect(Math.floor(x * canvas.width), Math.floor(y * canvas.height), Math.ceil((right - x) * canvas.width), Math.ceil((bottom - y) * canvas.height));
          });
          canvas.toBlob(blob => {
            if (!blob) { reject(new Error('無法輸出遮蓋後的圖片')); return; }
            resolve(new File([blob], `redacted-receipt-${String(index + 1).padStart(2, '0')}.jpg`, { type: 'image/jpeg' }));
          }, 'image/jpeg', quality);
        } catch (error) { reject(error); }
      };
      image.onerror = () => reject(new Error('無法載入單據圖片'));
      image.src = `data:${imageData.mimeType};base64,${imageData.data}`;
    });

          const scale = Math.min(1, maxEdge / longest);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('無法處理圖片');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const data = dataUrl.split(',')[1];
          if (!data) throw new Error('無法處理圖片');
          resolve({ mimeType: 'image/jpeg', data });

        setTimeout(() => focusField(`item-name-${index}`), 180);
      };

      const openAiScan = () => {
        setStepError('');
        setShowSettings(false);
        setShowHistory(false);
        setShowTutorial(false);
        setStep(1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const jumpToStep = (target) => {
        if (target === step) return;
        setStepError('');
        if (target < step) { setStep(target); return; }
        if (target >= 3 && items.length === 0) { setStepError('⚠️ 請先新增至少一個項目。'); return; }
        if (target >= 3) {
          for (let i = 0; i < items.length; i++) {
              if (!String(items[i].name || '').trim()) { setStepError(`⚠️ 項目 ${items[i].id} 未填寫名稱！`); focusField(`item-name-${i}`); return; }
          }
        }
        if (target === 4 && !results) { setStepError('⚠️ 請先完成運算。'); return; }
        setStep(target);
      };

      const handlePasteReplies = (e) => {
        e.preventDefault();
        const incoming = (e.clipboardData || window.clipboardData).getData('text/plain');
        const el = e.target;
        const { text, added, blockStart } = appendReply(friendsReplies, incoming);
        if (!added) return;
        setFriendsReplies(text);
        setStepError('');
        requestAnimationFrame(() => {
          el.focus();
          el.setSelectionRange(text.length, text.length);
          const lines = text.slice(0, blockStart).split('\n').length;
          const lineH = parseFloat(getComputedStyle(el).lineHeight) || 20;
          el.scrollTop = Math.max(0, (lines - 1) * lineH - 8);
        });
      };

      const onFocusReplies = (e) => {
        const el = e.target;
        const atEnd = el.selectionStart >= el.value.replace(/\s+$/, '').length;
        const fixed = ensureTail(el.value);
        if (fixed !== el.value) setFriendsReplies(fixed);
        if (atEnd) parkCaret(el);
      };

      const onBlurReplies = (e) => {
        const fixed = ensureTail(normalizeReplies(e.target.value));
        if (fixed !== friendsReplies) setFriendsReplies(fixed);
      };

      // Image-only HTML inputs open Android Chrome's media picker. Prefer the
      // Files API at Downloads; retain a broad file-input fallback and validate
      // the actual MIME type in the existing upload handlers.
      const openReceiptImagePicker = async inputRef => {
        const input = inputRef?.current;
        if (!input) return;
        if (typeof window.showOpenFilePicker !== 'function') {
          input.click();
          return;
        }
        let files = [];
        try {
          const handles = await window.showOpenFilePicker({
            startIn: 'downloads',
            multiple: true,
            types: [{
              description: uiLang === 'en' ? 'Receipt images' : '收據圖片',
              accept: {
                'image/jpeg': ['.jpg', '.jpeg'],
                'image/png': ['.png'],
                'image/webp': ['.webp']
              }
            }]
          });
          files = await Promise.all((handles || []).map(handle => handle.getFile()));
        } catch (error) {
          if (error?.name === 'AbortError') return;
          if (!input.disabled) input.click();
          return;
        }
        if (!files.length) return;
        const event = { target: { files, value: '' } };
        if (input === receiptAttachmentInputRef.current) await handleReceiptImageAttachmentUpload(event);
        else await handleFileUpload(event);
      };

      const triggerUpload = () => {
        if (tutorialDemo) { onTutorialAction?.('receipt'); return; }
        if (!apiKey.trim()) { toast('讀單據先要你自己的免費 OpenRouter 鎖匙。', 'error'); setShowSettings(true); return; }
        openReceiptImagePicker(fileInputRef);
      };

      const triggerCamera = () => {
        if (tutorialDemo) { onTutorialAction?.('receipt'); return; }
        if (!apiKey.trim()) { toast('讀單據先要你自己的免費 OpenRouter 鎖匙。', 'error'); setShowSettings(true); return; }
        if (!navigator.mediaDevices?.getUserMedia) {
          toast('⚠️ 此瀏覽器不支援網頁相機，請改用「選擇圖片」', 'error');
          if (cameraInputRef.current) cameraInputRef.current.click();
          return;
        }
        const generation = billGenerationRef.current;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
          .then(stream => {
            if (generation !== billGenerationRef.current) { stream.getTracks().forEach(track => track.stop()); return; }
            cameraStreamRef.current = stream;
            setCameraOpen(true);
            requestAnimationFrame(() => {
              if (cameraVideoRef.current) {
                cameraVideoRef.current.srcObject = stream;
                cameraVideoRef.current.play().catch(() => {});
              }
            });
          })
          .catch(() => { if (generation === billGenerationRef.current) toast('⚠️ 未能開啟相機，請允許此網站使用相機，或改用「選擇圖片」', 'error'); });
      };

      const closeCamera = () => {
        if (cameraStreamRef.current) {
          cameraStreamRef.current.getTracks().forEach(track => track.stop());
          cameraStreamRef.current = null;
        }
        setCameraOpen(false);
      };

      const captureCameraPhoto = () => {
        if (tutorialDemo) return;
        const video = cameraVideoRef.current;
        if (!video || !video.videoWidth || !video.videoHeight) {
          toast('⚠️ 相機仍在啟動，請稍候再按一次', 'error');
          return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const generation = billGenerationRef.current;
        canvas.toBlob(blob => {
          if (generation !== billGenerationRef.current) return;
          if (!blob) { toast('⚠️ 未能擷取相片，請再試一次', 'error'); return; }
          closeCamera();
          handleFileUpload({ target: { files: [new File([blob], `receipt-camera-${Date.now()}.jpg`, { type: 'image/jpeg' })], value: '' } });
        }, 'image/jpeg', 0.92);
      };

      const cancelRedactionStroke = () => {
        const drag = redactionDragRef.current;
        redactionDragRef.current = null;
        setRedactionDrag(null);
        const canvas = redactionCanvasRef.current;
        if (drag && canvas) {
          try { if (canvas.hasPointerCapture(drag.pointerId)) canvas.releasePointerCapture(drag.pointerId); } catch (error) {}
        }
      };

      const setRedactionDrawingMode = (enabled) => {
        redactionDrawEnabledRef.current = Boolean(enabled);
        setRedactionDrawEnabled(Boolean(enabled));
        cancelRedactionStroke();
      };

      const getRedactionPoint = (event) => {
        const canvas = redactionCanvasRef.current;
        if (!canvas) return null;
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        return {
          x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
          y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
        };
      };

      const handleRedactionPointerDown = (event) => {
        if (!redactionDrawEnabledRef.current || isPreparingRedacted || redactionDragRef.current || event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
        const point = getRedactionPoint(event);
        if (!point) return;
        event.preventDefault();
        try { event.currentTarget.setPointerCapture(event.pointerId); } catch (error) {}
        const drag = { pointerId: event.pointerId, imageIndex: redactionIndex, startX: point.x, startY: point.y, currentX: point.x, currentY: point.y };
        redactionDragRef.current = drag;
        setRedactionDrag(drag);
      };

      const handleRedactionPointerMove = (event) => {
        if (!redactionDrawEnabledRef.current || isPreparingRedacted) return;
        const drag = redactionDragRef.current;
        if (drag && (drag.pointerId !== event.pointerId || drag.imageIndex !== redactionIndex)) return;
        const point = drag && getRedactionPoint(event);
        if (!drag || !point) return;
        const next = { ...drag, currentX: point.x, currentY: point.y };
        redactionDragRef.current = next;
        setRedactionDrag(next);
      };

      const handleRedactionPointerUp = (event) => {
        if (!redactionDrawEnabledRef.current || isPreparingRedacted) { cancelRedactionStroke(); return; }
        const drag = redactionDragRef.current;
        if (drag && (drag.pointerId !== event.pointerId || drag.imageIndex !== redactionIndex)) return;
        const point = drag && getRedactionPoint(event);
        if (!drag || !point) return;
        cancelRedactionStroke();
        const x = Math.min(drag.startX, point.x);
        const y = Math.min(drag.startY, point.y);
        const width = Math.abs(point.x - drag.startX);
        const height = Math.abs(point.y - drag.startY);
        if (width < 0.005 || height < 0.005) return;
        setRedactionMasks(current => {
          const next = current.slice();
          next[redactionIndex] = [...(next[redactionIndex] || []), { x, y, width, height }];
          return next;
        });
      };

      const cancelReceiptRedaction = () => {
        if (isPreparingRedacted) return;
        setRedactionDrawingMode(false);
        setShowRedaction(false);
        setPendingRedactionImages([]);
        setRedactionMasks([]);
        setRedactionIndex(0);
        setRedactionDrag(null);
        redactionDragRef.current = null;
        if (!receiptAttachmentOnly) setLastImageData([]);
        setReceiptAttachmentOnly(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
        if (receiptAttachmentInputRef.current) receiptAttachmentInputRef.current.value = '';
      };

      const startOcrWithRedactedImages = async () => {
        if (tutorialDemo) return;
        if (!pendingRedactionImages.length || isPreparingRedacted) return;
        setRedactionDrawingMode(false);
        setIsPreparingRedacted(true);
        const generation = billGenerationRef.current;
        try {
          const makeBatch = async quality => {
            const output = [];
            for (let index = 0; index < pendingRedactionImages.length; index++) {
              output.push(await createRedactedReceiptFile(pendingRedactionImages[index], redactionMasks[index] || [], index, quality));
            }
            return output;
          };
          let redactedFiles = await makeBatch(0.92);
          const existingBytes = receiptAttachmentOnly
            ? lastImageData.reduce((sum, image) => sum + Math.ceil(String(image?.data || '').length * 3 / 4), 0)
            : 0;
          const batchBytes = files => files.reduce((sum, file) => sum + file.size, 0);
          if (existingBytes + batchBytes(redactedFiles) > 12 * 1024 * 1024) redactedFiles = await makeBatch(0.82);
          if (existingBytes + batchBytes(redactedFiles) > 12 * 1024 * 1024) throw new Error('遮蓋後圖片總容量仍超過 12 MB，請減少圖片數量或分批處理。');
          if (receiptAttachmentOnly && lastImageData.length + redactedFiles.length > 5) throw new Error('收據圖片最多 5 張，請先移除部分圖片再試。');
          if (generation !== billGenerationRef.current) return;
          if (receiptAttachmentOnly) {
            const appendedImages = await Promise.all(redactedFiles.map(file => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve({ mimeType: 'image/jpeg', data: String(reader.result || '').split(',')[1] || '' });
              reader.onerror = () => reject(new Error(`未能讀取遮蓋後圖片：${file.name}`));
              reader.readAsDataURL(file);
            })));
            if (generation !== billGenerationRef.current) return;
            setLastImageData(current => [...current, ...appendedImages]);
            if (results && claimSessionRef.current?.link) setReceiptImageSharePending(true);
            setIsSaved(false);
            setUploadError('');
            setReceiptAttachmentOnly(false);
            setPendingRedactionImages([]);
            setRedactionMasks([]);
            setRedactionIndex(0);
            setShowRedaction(false);
            setRedactionDrag(null);
            redactionDragRef.current = null;
            toast(bi('✅ 相片已加入；分享後會顯示在同一條結果連結（不做 OCR／AI）。', '✅ Photo added; it appears on the same result link when shared (no OCR/AI).'));
            return;
          }
          setPendingRedactionImages([]);
          setRedactionMasks([]);
          setRedactionIndex(0);
          setShowRedaction(false);
          setRedactionDrag(null);
          redactionDragRef.current = null;
          handleFileUpload({ target: { files: redactedFiles, value: '' } }, true);
        } catch (error) {
          if (generation === billGenerationRef.current) toast(`⚠️ ${error?.message || '無法製作遮蓋版，請再試一次。'}`, 'error');
        } finally {
          if (generation === billGenerationRef.current) setIsPreparingRedacted(false);
        }
      };

      const handleReceiptImageAttachmentUpload = async event => {
        if (tutorialDemo) return;
        const input = event?.target;
        const files = Array.from(input?.files || []);
        if (!files.length) return;
        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        if (files.length + lastImageData.length > 5) {
          toast(bi('收據圖片最多 5 張，請減少選取張數。', 'Attach up to 5 receipt photos; select fewer images.'), 'error');
          if (input) input.value = '';
          return;
        }
        if (files.some(file => !allowedTypes.includes(file.type))) {
          toast(bi('只支援 JPG、PNG 或 WebP 圖片格式。', 'Only JPG, PNG, or WebP images are supported.'), 'error');
          if (input) input.value = '';
          return;
        }
        const existingBytes = lastImageData.reduce((sum, image) => sum + Math.ceil(String(image?.data || '').length * 3 / 4), 0);
        const selectedBytes = files.reduce((sum, file) => sum + file.size, 0);
        if (existingBytes + selectedBytes > 12 * 1024 * 1024) {
          toast(bi('收據圖片總容量不可超過 12 MB，請減少圖片或先壓縮。', 'Receipt photos must total 12 MB or less; select fewer or compress them first.'), 'error');
          if (input) input.value = '';
          return;
        }
        const generation = billGenerationRef.current;
        try {
          const originals = await Promise.all(files.map(file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve({ mimeType: file.type, data: String(reader.result || '').split(',')[1] || '' });
            reader.onerror = () => reject(new Error(`未能讀取圖片：${file.name}`));
            reader.readAsDataURL(file);
          })));
          if (generation !== billGenerationRef.current) return;
          setUploadError('');
          setReceiptAttachmentOnly(true);
          setRedactionDrawingMode(false);
          setPendingRedactionImages(originals);
          setRedactionMasks(originals.map(() => []));
          setRedactionIndex(0);
          setRedactionDrag(null);
          redactionDragRef.current = null;
          setShowRedaction(true);
        } catch (error) {
          if (generation === billGenerationRef.current) toast(`⚠️ ${error?.message || bi('圖片讀取失敗。', 'Could not read the image.')}`, 'error');
        } finally {
          if (input) input.value = '';
        }
      };

      const handleFileUpload = async (event, alreadyRedacted = false, keepPreviousResultsOnFailure = false, receiptText = '') => {
        if (tutorialDemo) return;
        const generation = billGenerationRef.current;
        const inputTarget = event?.target;
        const files = Array.from(inputTarget?.files || []);
        const textContent = String(receiptText || '').trim();
        const isTextInput = Boolean(textContent);
        const clearFileSelection = () => {
          if (fileInputRef.current) fileInputRef.current.value = '';
          if (receiptTextFileInputRef.current) receiptTextFileInputRef.current.value = '';
          if (receiptAttachmentInputRef.current) receiptAttachmentInputRef.current.value = '';
          if (inputTarget) inputTarget.value = '';
        };
        if (files.length === 0 && !isTextInput) return;
        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        const totalSize = files.reduce((sum, file) => sum + file.size, 0);

        if (!isTextInput && files.length > 5) { setUploadError({ main: '一次最多可上載 5 張圖片', sub: '', action: null }); clearFileSelection(); return; }
        if (!isTextInput && files.some(file => !allowedTypes.includes(file.type))) { setUploadError({ main: '只支援 JPG、PNG 或 WebP 圖片格式', sub: '', action: null }); clearFileSelection(); return; }
        if (!isTextInput && totalSize > 12 * 1024 * 1024) { setUploadError({ main: '圖片總容量不可超過 12 MB', sub: '請壓縮後再試', action: null }); clearFileSelection(); return; }
        if (isTextInput && textContent.length > 200000) { setUploadError({ main: bi('文字太長；請分開處理，或上載不超過 1 MB 的文字檔。', 'Text is too long; split it or upload a text file no larger than 1 MB.'), sub: '', action: null }); clearFileSelection(); return; }

        if (!isTextInput && !alreadyRedacted) {
          setUploadError('');
          setReceiptAttachmentOnly(false);
          setLastImageData([]);
          setIsSaved(false);
          try {
            const originals = await Promise.all(files.map(file => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve({ mimeType: file.type, data: reader.result.split(',')[1] });
              reader.onerror = () => reject(new Error('未能讀取所選圖片'));
              reader.readAsDataURL(file);
            })));
            if (generation !== billGenerationRef.current) return;
            setRedactionDrawingMode(false);
            setPendingRedactionImages(originals);
            setRedactionMasks(originals.map(() => []));
            setRedactionIndex(0);
            setRedactionDrag(null);
            redactionDragRef.current = null;
            setShowRedaction(true);
          } catch (error) {
            if (generation !== billGenerationRef.current) return;
            setUploadError({ main: '圖片讀取失敗', sub: error?.message || '請再選一次圖片。', action: null });
          } finally {
            if (generation === billGenerationRef.current) clearFileSelection();
          }
          return;
        }

        setIsAnalyzing(true);
        setUploadError('');
        setProgress(0);
        setProgressText(isTextInput ? bi('正在整理文字…', 'Structuring receipt text…') : '正在讀取圖片...');

        const controller = new AbortController();
        ocrAbortRef.current?.abort(); ocrAbortRef.current = controller;
        clearInterval(ocrProgressRef.current);
        ocrProgressRef.current = null;

        try {
          let imageDataArray = [];
          let directJsonPayload = null;
          let directJsonImport = false;
          if (isTextInput) {
            setLastImageData([]);
            setIsSaved(false);
            try {
              const candidate = extractPayload(textContent);
              const validItems = Array.isArray(candidate?.items)
                && candidate.items.length > 0
                && candidate.items.length <= 100
                && candidate.items.every(item => item && typeof item === 'object' && !Array.isArray(item)
                  && String(item.name || item.nameEn || item.original || item.item || '').trim()
                  && (item.price !== undefined || item.total !== undefined || item.amount !== undefined));
              if (validItems) { directJsonPayload = candidate; directJsonImport = true; }
            } catch (parseError) {}
            if (!directJsonImport && !apiKey.trim()) {
              throw new Error(bi('未設定免費 OpenRouter 鎖匙。一般文字需要免費模型整理；想免鎖匙匯入，請複製下方讀圖提示詞，讓另一個 AI 輸出 JSON，再貼上或上載。', 'No free OpenRouter key is set. Free-form text needs a model; for no-key import, copy the image-reading prompt below and paste or upload the JSON it returns.'));
            }
          } else {
            if (!apiKey.trim()) throw new Error('讀單據先要你自己的免費 OpenRouter 鎖匙。');
            const base64Promises = files.map(file => {
              return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve({ mimeType: file.type, data: reader.result.split(',')[1] });
                reader.onerror = () => reject(new Error(`未能讀取圖片：${file.name}`));
                reader.readAsDataURL(file);
              });
            });
            imageDataArray = await Promise.all(base64Promises);
            if (generation !== billGenerationRef.current) return;
            // Keep the last successfully read batch so a transient AI/OCR
            // failure can be retried without selecting the files again.
            setLastImageData(imageDataArray);
          }

          const useFreeTier = modelUsesFreeTier(apiModel, allowPaidModels);
          const modelForRequest = resolveBillModel(apiModel, allowPaidModels);
          const usePaddleLocal = !isTextInput && ocrEngine === 'paddlejs';
          if (directJsonImport) setProgressText(bi('已識別 JSON 格式，正在本機匯入…', 'JSON detected; importing locally…'));
          else if (!isTextInput) setProgressText(usePaddleLocal
            ? bi('準備本機 OCR…', 'Preparing local OCR…')
            : (useFreeTier ? '正在壓縮圖片，方便免費模型處理...' : '正在壓縮圖片...'));
          const aiImages = [];
          let localOcrText = '';
          if (usePaddleLocal) {
            if (!window.PaddleReceiptOcr?.recognizeImages) throw new Error('本機 OCR 模組未能載入，請重新整理後再試，或改選 Dots3-Note。');
            localOcrText = await window.PaddleReceiptOcr.recognizeImages(imageDataArray, phase => {
              if (phase === 'loading-sdk') setProgressText(bi('首次載入本機 OCR 模組…', 'Loading the local OCR module…'));
              else if (phase === 'loading-model') setProgressText(bi('正在載入本機 OCR 模型（首次可能需約一分鐘）…', 'Loading the local OCR model (about a minute the first time)…'));
              else if (phase === 'recognizing') setProgressText(bi('正在本機辨識收據…', 'Recognizing the receipt locally…'));
            });
            if (!String(localOcrText || '').trim()) throw new Error('PaddleOCR.js 沒有讀到文字；可改選 Dots3-Note 重試。');
            setProgressText(bi('本機辨識完成，正在交由 Dots3-Note 翻譯及整理…', 'Local OCR complete; sending recognized text to Dots3-Note for translation and structuring…'));
          } else {
            for (const image of imageDataArray) {
              try {
                aiImages.push(await compressImageDataForAi(
                  image,
                  useFreeTier ? FREE_AI_MAX_EDGE : PAID_AI_MAX_EDGE,
                  useFreeTier ? FREE_AI_JPEG_QUALITY : PAID_AI_JPEG_QUALITY
                ));
              } catch (compressionError) {
                aiImages.push(image);
              }
            }
          }
          if (generation !== billGenerationRef.current) return;
          if (!usePaddleLocal && !directJsonImport) setProgressText(Ocr.waitingText(modelForRequest));

          const promptText = `你幫香港人整理旅行單據；輸入可能是單據圖片，或另一個 AI 已翻譯的單據文字。合併所有輸入成一份清單。只輸出一個 JSON，無 Markdown、無解釋。

name 必須係香港繁體中文，俾唔識日文／韓文嘅人直接睇。這是硬性規則，唔可以違反：
- 日文、韓文或其他非中文單據：name 一定要譯成繁體中文。name 禁止含平假名、片假名、韓文，亦禁止同 original 相同。
- 就算冇標準譯名，都要寫香港人會用嘅繁體叫法。唔好留空，唔好把原文抄入 name。例如 ラーメン 必須寫成拉麵，비빔밥 必須寫成拌飯。
- original：逐字保留單據原文，日文就全日文，韓文就全韓文。
- nameEn：只有你肯定嘅英文先填，否則 ""。唔好把中文、日文或韓文放喺 nameEn。
- ja：只有另一個日文寫法，而且同 original 唔同時先填，否則 ""。

正確：{"name":"拉麵","nameEn":"","original":"ラーメン","ja":""}
錯誤：{"name":"ラーメン","original":"ラーメン"}（name 仍然係日文，唔算翻譯）

每項欄位：name, nameEn, original, ja, price, qty, totalQty（無則 null）, unit（無則 ""，用繁體，如件／杯／碗）, total（照單據列出的該項行金額）。稅、服務費、折扣獨立行不可當成品項，亦不可把獨立調整重複加進 total。
跨國收據請辨識不同語言／位置的稅費與優惠行，包括 VAT、GST、消費税、各種稅率、服務費、折扣、優惠券、割引等；百分比可寫成 10%、10％、10 percent 或本地格式。只抄單據明確印出的百分比，絕不可由固定金額猜百分比。
每個稅／服務費／折扣行各輸出一次到 adjustments；kind 只用 tax 或 discount；ratePercent 用數字百分比（10 代表 10%），amount 只填單據印出的金額（正數），未印金額就 null；baseAmount 只填單據明確印出的計算基數，否則 null。若同時印百分比和金額，兩者都填，程式會以印出的金額為準。
label 只寫收據上與該項稅／服務費／折扣直接相關的那一行，保持簡短；不要寫商場或店名、付款方式、交通卡餘額、地址、找續或其他無關 OCR 內容，也不要把整段收據塞進 label。taxNote 是舊格式欄位，留空即可，絕不可放整段收據文字。
application 必須是 separate（確認在品項金額之外另加／另減）、included（已反映於品項行金額或應付總額，例如含稅價／折後價）或 unknown（無法判斷；不可猜）。scope 用 receipt 表示整張單，item 表示指定品項；itemIndex 是 items 陣列的 0 起算位置；order 按收據行出現次序。折扣要用正數，由程式扣減；稅費用正數，由程式加上。項目金額若已是折後／含稅最終價，相關 adjustment 要標 included。
頂層：adjustments（即使沒有調整也輸出 []）, taxTotal（只供舊格式兼容，正常請用 adjustments；已內含則 0 或 null）, taxNote, currency（ISO 三位，不明用 HKD）, date（YYYY-MM-DD 或 null，唔好用今天）, receiptTotal（收據最終應付總額或 null）。不要把已反映在項目金額／總額的調整再次輸出為 separate。

額外核對規則（仍只輸出指定 JSON）：
- items 只可有實際商品。商品名換行或單價／數量排在下一行時，合併成同一 item；但每個新的商品名稱若有自己的右欄金額，就是另一項，必須分開，不能與上一項合併。
- 單價×數量括號行併回該商品：price 填單價、qty 填數量、total 填行總額；括號／續行不可另開 item。
- 若收據印有「小計 22點」等件數，最後核對商品 qty 合計等於該件數；不要把 22 點當成 22 個不同商品，也不要為湊件數捏造、刪除或合併有獨立價格的商品。
- 小計、合計、內稅對象額、內稅額、收款額及找零均不是商品，絕不可放入 items；小計／合計／收款／找零也不可放入 adjustments。標明「內稅」的稅額已包含，application 必須是 included。
- 常見日文商品詞：巾着＝束口袋／小袋，ペンケース＝筆袋，コインケース＝零錢包，ポーチ＝收納袋，シール＝貼紙。name 不可把袋翻成毛巾、鞋套或印章；保留角色／圖案名，不清楚的專名按原文音譯或保留，不要猜。
格式：{"items":[{"name":"拉麵","nameEn":"","original":"ラーメン","ja":"","price":100,"qty":1,"totalQty":null,"unit":"碗","total":100}],"adjustments":[{"label":"消費税","kind":"tax","ratePercent":8,"amount":null,"baseAmount":null,"application":"separate","scope":"receipt","itemIndex":null,"order":0}],"taxTotal":null,"taxNote":"","currency":"JPY","date":"2026-03-14","receiptTotal":108}
${isTextInput ? '以下是一份已翻譯的收據文字（沒有圖片附件）。' : `這裡有 ${files.length} 張單據。`}`;

          let parsedItems = [];
          let parsedTax = null;
          let parsedDiscount = 0;
          let parsedCurrency = 'HKD';

          const textForRequest = isTextInput
            ? `${promptText}\n\n以下是用戶提供的收據文字。請只根據文字內容整理，不要假設另有圖片：\n\n${textContent}`
            : usePaddleLocal
              ? `${promptText}\n\n以下是本機 PaddleOCR.js 按單據閱讀順序辨識的文字。請只根據這些文字整理；不確定的欄位不要猜，保留原文及 null／空值規則：\n\n${localOcrText}`
              : promptText;
          const contentArray = [{ type: "text", text: textForRequest }];
          if (!usePaddleLocal && !isTextInput) aiImages.forEach(img => { contentArray.push({ type: "image_url", image_url: { url: `data:${img.mimeType};base64,${img.data}` } }); });
          const markTransient = (error, message) => {
            const transient = new Error(message || error?.message || '網絡中斷，請再試。');
            transient.transient = true;
            if (error?.detail) transient.detail = error.detail;
            return transient;
          };
          const readReceiptModel = async (modelId) => {
            const attempt = new AbortController();
            const timer = setTimeout(() => attempt.abort(), OCR_ATTEMPT_MS);
            const abortAttempt = () => attempt.abort();
            controller.signal.addEventListener('abort', abortAttempt);
            try {
              const requestBody = Ocr.buildRequestBody(modelId, [{ role: "user", content: contentArray }]);
              const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                signal: attempt.signal,
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey.trim()}` },
                body: JSON.stringify(requestBody)
              });
              if (!response.ok) {
                let detail = '';
                try {
                  const errBody = await response.json();
                  detail = errBody?.error?.message || errBody?.message || '';
                } catch (parseError) {}
                const failure = new Error(describeOpenRouterFailure(response.status, detail));
                failure.status = response.status;
                failure.detail = String(detail || '').replace(/\s+/g, ' ').trim().slice(0, 180);
                throw failure;
              }
              const data = await response.json();
              const jsonText = Ocr.messageText(data.choices?.[0]?.message || {});
              if (!jsonText) throw markTransient(null, 'OpenRouter 伺服器未回傳內容。');
              let shaped;
              try {
                shaped = extractPayload(jsonText);
              } catch (parseError) {
                const message = String(parseError?.message || '').includes('不是有效 JSON')
                  ? parseError.message
                  : 'AI 回傳的內容不是有效 JSON，請重試或改用其他模型。';
                throw markTransient(parseError, message);
              }
              if (!Array.isArray(shaped.items) || shaped.items.length === 0) throw markTransient(null, 'AI 回傳格式不符。');
              return shaped;
            } catch (error) {
              if (controller.signal.aborted) {
                const aborted = new Error('Aborted');
                aborted.name = 'AbortError';
                throw aborted;
              }
              if (error?.name === 'AbortError') {
                const timeout = markTransient(null, '免費模型等候逾時。可以再試，或改用手動輸入。');
                timeout.timedOut = true;
                timeout.transient = false;
                throw timeout;
              }
              const status = Number(error?.status) || 0;
              if (status || error?.transient === true) throw error;
              throw markTransient(error, error?.message);
            } finally {
              clearTimeout(timer);
              controller.signal.removeEventListener('abort', abortAttempt);
            }
          };

          const readModelAttempts = async (modelId, { maxAttempts, firstStatus }) => {
            let lastError;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              if (generation !== billGenerationRef.current) return null;
              if (attempt === 1) {
                setProgressText(firstStatus);
              } else {
                setProgressText(`讀單失敗，再試一次…（${attempt}/${maxAttempts}）`);
                const backoff = OCR_RETRY_BACKOFF_MS[Math.min(attempt - 2, OCR_RETRY_BACKOFF_MS.length - 1)];
                await waitForOcrBackoff(backoff, controller.signal);
                if (generation !== billGenerationRef.current) return null;
              }
              try {
                return await readReceiptModel(modelId);
              } catch (error) {
                lastError = error;
                if (attempt >= maxAttempts || !isTransientOcrFailure(error)) throw error;
              }
            }
            throw lastError;
          };

          let shaped = directJsonPayload;
          let recognizedModelId = directJsonImport ? 'local-json-import' : modelForRequest;
          if (!shaped && Ocr.isFreeModel(modelForRequest)) {
            const order = Ocr.cascadeOrder(modelForRequest);
            const failures = [];
            for (let index = 0; index < order.length; index += 1) {
              const modelId = order[index];
              if (generation !== billGenerationRef.current) return;
              try {
                shaped = await readModelAttempts(modelId, {
                  maxAttempts: FREE_OCR_MAX_ATTEMPTS,
                  firstStatus: index === 0 ? Ocr.waitingText(modelId) : Ocr.switchText(modelId)
                });
                if (generation !== billGenerationRef.current) return;
                if (shaped) { recognizedModelId = modelId; break; }
              } catch (error) {
                if (error?.name === 'AbortError' || Number(error?.status) === 401) throw error;
                failures.push({ modelId, error });
                if (!Ocr.shouldCascade(error) || index === order.length - 1) {
                  const combined = new Error(Ocr.exhaustedMessage(failures));
                  combined.detail = Ocr.exhaustedDetail(failures);
                  throw combined;
                }
              }
            }
            if (!shaped) {
              const combined = new Error(Ocr.exhaustedMessage(failures));
              combined.detail = Ocr.exhaustedDetail(failures);
              throw combined;
            }
          } else if (!shaped) {
            setProgressText(Ocr.waitingText(modelForRequest));
            shaped = await readReceiptModel(modelForRequest);
          }
          if (generation !== billGenerationRef.current || !shaped) return;
          setProgressText(directJsonImport ? bi('正在整理匯入資料…', 'Structuring imported data…') : '正在整理識別結果...');
          parsedItems = shaped.items; parsedTax = shaped.taxTotal; parsedCurrency = shaped.currency?.toUpperCase() || 'HKD';
          const formattedItems = parsedItems.map((item, idx) => {
            const names = normalizeReceiptItemNames(item);
            const parsedPrice = ReceiptMath.parseMoney(item.price, parsedCurrency) ?? 0;
            const parsedTotal = ReceiptMath.parseMoney(item.total, parsedCurrency);
            const parsedQty = toNum(item.qty) || 1;
            return {
              id: String(idx + 1).padStart(2, '0'), name: names.name || '項目', nameEn: names.nameEn, original: names.original, ja: names.ja,
              price: parsedPrice, qty: parsedQty, totalQty: item.totalQty === null ? null : (toNum(item.totalQty) || toNum(item.qty) || null), unit: String(item.unit || '').trim(), total: parsedTotal === null ? parsedPrice * parsedQty : parsedTotal
            };
          });
          const resolvedAdjustments = ReceiptMath.resolveReceiptAdjustments({
            items: formattedItems, adjustments: shaped.adjustments, taxTotal: shaped.taxTotal,
            discountTotal: shaped.discountTotal, receiptTotal: shaped.receiptTotal, currency: parsedCurrency
          });
          parsedTax = resolvedAdjustments.taxAmount;
          parsedDiscount = resolvedAdjustments.billDiscountAmount;
          const finalizedItems = formattedItems.map((item, idx) => {
            const itemDiscount = resolvedAdjustments.itemDiscounts[idx] || 0;
            if (!itemDiscount) return item;
            const netTotal = Math.max(0, item.total - itemDiscount);
            const itemQty = toNum(item.qty) || 1;
            return { ...item, price: netTotal / itemQty, total: netTotal, receiptDiscountAmount: itemDiscount };
          });
          const parsedAdjustmentDetails = {
            rows: ReceiptMath.summarizeAppliedReceiptRows(resolvedAdjustments, formattedItems),
            currency: parsedCurrency,
            doubleApplicationPrevented: resolvedAdjustments.doubleApplicationPrevented,
            receiptTotalMatches: resolvedAdjustments.receiptTotalMatches
          };

          setProgress(0);
          setProgressText('處理完成！');

          ocrCompleteRef.current = setTimeout(() => {
            if (generation !== billGenerationRef.current) return;
            setItems(finalizedItems);
            setReadReceipt(true);
            setLastRecognitionModel(isTextInput
              ? (directJsonImport ? 'local-json-import' : `text-input|${recognizedModelId}`)
              : (usePaddleLocal ? `${LOCAL_PADDLE_MODEL_ID}|${recognizedModelId}` : recognizedModelId));
            if (isTextInput) { setReceiptTextDraft(''); setShowReceiptTextImport(false); }
            openItemEditsRef.current = {};
            setOpenItemEdits({});
            setCurrency(parsedCurrency);
            setDetectedCurrency(parsedCurrency);

            setTaxAmount(parsedTax > 0 ? String(ReceiptMath.roundMoney(parsedTax, parsedCurrency)) : '');
            setDiscountAmount(parsedDiscount > 0 ? String(ReceiptMath.roundMoney(parsedDiscount, parsedCurrency)) : '');
            setTaxNote('');
            setReceiptAdjustmentDetails(parsedAdjustmentDetails);
            const appliedToastParts = [];
            if (parsedTax > 0) appliedToastParts.push(`${bi('稅／服務費', 'tax / fees')} ${formatMoney(parsedTax, parsedCurrency)}`);
            if (resolvedAdjustments.discountAmount > 0) appliedToastParts.push(`${bi('折扣', 'discount')} −${formatMoney(resolvedAdjustments.discountAmount, parsedCurrency)}`);
            if (appliedToastParts.length) toast(`✅ ${bi('已自動換算：', 'Calculated automatically: ')}${appliedToastParts.join(' · ')}`);
            else if (resolvedAdjustments.doubleApplicationPrevented) toast(bi('✅ 已核對收據總額，沒有重複套用稅費／折扣。', '✅ Checked the receipt total; no tax/discount was applied twice.'));

            pendingStep2EntryRef.current = true;
            setStep(2);
            setIsAnalyzing(false);
            claimLinkSharedRef.current = false;
            setClaimLinkShared(false);
          }, 600);

        } catch (error) {
          if (generation !== billGenerationRef.current || error?.name === 'AbortError') return;
          setIsAnalyzing(false);
          setProgressText('');
          setUploadError({ main: '讀取失敗', sub: error?.message || '未知錯誤', detail: error?.detail || '', action: null });
          if (keepPreviousResultsOnFailure && receiptWasRead && items.length) {
            pendingStep2EntryRef.current = true;
            setStep(2);
            toast(bi('重讀失敗，已保留舊結果。', 'Re-recognition failed; the previous successful results are kept.'), 'error');
          }
        } finally {
          if (generation === billGenerationRef.current) clearFileSelection();
        }
      };

      const submitReceiptTextImport = () => {
        const text = String(receiptTextDraft || '').trim();
        if (!text) {
          setUploadError({ main: bi('請先貼上收據文字，或上載文字檔。', 'Paste receipt text or upload a text file first.'), sub: '', action: null });
          return;
        }
        setUploadError('');
        handleFileUpload({ target: { files: [], value: '' } }, true, false, text);
      };

      const handleReceiptTextFileUpload = async event => {
        if (tutorialDemo) return;
        const file = event?.target?.files?.[0];
        if (!file) return;
        const clearTextFileSelection = () => {
          if (receiptTextFileInputRef.current) receiptTextFileInputRef.current.value = '';
          if (event?.target) event.target.value = '';
        };
        if (!/\.(txt|md|csv|json)$/i.test(String(file.name || ''))) {
          setUploadError({ main: bi('只接受 .txt、.md、.csv 或 .json 文字檔。', 'Use a .txt, .md, .csv or .json text file.'), sub: '', action: null });
          clearTextFileSelection();
          return;
        }
        if (file.size > 1024 * 1024) {
          setUploadError({ main: bi('文字檔不可超過 1 MB。', 'Text files must be 1 MB or smaller.'), sub: '', action: null });
          clearTextFileSelection();
          return;
        }
        try {
          const text = await file.text();
          if (!String(text || '').trim()) throw new Error(bi('文字檔沒有內容。', 'The text file is empty.'));
          setReceiptTextDraft(text);
          setUploadError('');
          await handleFileUpload({ target: { files: [], value: '' } }, true, false, text);
        } catch (error) {
          setUploadError({ main: bi('文字檔讀取失敗。', 'Could not read the text file.'), sub: error?.message || '', action: null });
        } finally {
          clearTextFileSelection();
        }
      };

      const retryLastUpload = () => {
        if (!lastImageData.length || isAnalyzing) return;
        const files = lastImageData.map((img, index) => {
          const binary = atob(img.data);
          const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
          const ext = img.mimeType === 'image/png' ? 'png' : img.mimeType === 'image/webp' ? 'webp' : 'jpg';
          return new File([bytes], `receipt-retry-${index + 1}.${ext}`, { type: img.mimeType });
        });
        handleFileUpload({ target: { files, value: '' } }, true, receiptWasRead && items.length > 0);
      };

      const addItem = () => {
        setReceiptAdjustmentDetails(null);
        setItems([...items, { id: String(items.length + 1).padStart(2, '0'), name: '', original: '', ja: '', price: '', qty: 1, totalQty: null, unit: '', total: 0 }]);
      };
      const addItemAndFocus = () => {
        const index = items.length;
        addItem();
        setTimeout(() => focusField(`item-name-${index}`), 80);
      };
      const updateItem = (index, field, value) => {
        setReceiptAdjustmentDetails(null);
        const newItems = [...items]; newItems[index] = { ...newItems[index], [field]: value };
        if (field === 'nameEn') newItems[index].nameEnEdited = true;
        if (field === 'price' || field === 'qty') {
          const price = parseFloat(newItems[index].price) || 0; const qty = parseFloat(newItems[index].qty) || 0;
          if (field === 'qty') newItems[index].totalQty = qty || 1;
          newItems[index].total = price * qty;
          newItems[index].receiptDiscountAmount = 0;
        }
        setItems(newItems);
      };
      const removeItem = (index) => {
        setReceiptAdjustmentDetails(null);
        const newItems = items.filter((_, i) => i !== index);
        setItems(newItems.map((item, i) => ({ ...item, id: String(i + 1).padStart(2, '0') })));
        const next = {};
        Object.keys(openItemEditsRef.current).forEach(key => {
          const current = Number(key);
          if (current < index) next[current] = true;
          else if (current > index) next[current - 1] = true;
        });
        openItemEditsRef.current = next;
        setOpenItemEdits(next);
      };
      const requestRemoveItem = (index) => {
        const item = items[index];
        if (!item) return;
        setPendingItemRemoval({ index, name: displayItemName(item).trim() || bi('此項目', 'this item') });
      };
      const confirmRemoveItem = () => {
        if (!pendingItemRemoval) return;
        removeItem(pendingItemRemoval.index);
        setPendingItemRemoval(null);
      };
      const openItemEdit = (index) => {
        const next = { ...openItemEditsRef.current, [index]: true };
        openItemEditsRef.current = next;
        setOpenItemEdits(next);
        if (tutorialDemo) { onTutorialAction?.('edit'); return; }
        setTimeout(() => focusField(`item-name-${index}`), 180);
      };

      // 智慧自動導向邏輯
      const handleItemKeyDown = (e, currentType, idx) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (currentType === 'name') {
            focusField(`item-price-${idx}`);
          } else if (currentType === 'price') {
            focusField(`item-qty-${idx}`);
          } else if (currentType === 'qty') {
            if (idx < items.length - 1) {
              focusField(`item-name-${idx + 1}`);
            } else {
              addItem();
              setTimeout(() => focusField(`item-name-${idx + 1}`), 100);
            }
          }
        }
      };

      const encodeClaimLinkPayload = (payload) => {
        const bytes = new TextEncoder().encode(JSON.stringify(payload));
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      };

      const rememberClaimRoom = (room) => {
        claimRoomRef.current = room;
        setClaimRoom(room);
        if (draftSnapshotRef.current?.data) {
          draftSnapshotRef.current.data = { ...draftSnapshotRef.current.data, claimRoom: room };
        }
        persistActiveDraft();
      };

      const ensureClaimRoom = () => {
        if (tutorialDemo) return;
        if (window.ClaimRelay?.isRoom(claimRoomRef.current)) return claimRoomRef.current;
        const existingLink = claimSessionRef.current?.link;
        if (existingLink && window.ClaimRelay?.readRoomFromHash) {
          try {
            const roomFromLink = window.ClaimRelay.readRoomFromHash(new URL(existingLink, window.location.href).hash);
            if (window.ClaimRelay.isRoom(roomFromLink)) {
              rememberClaimRoom(roomFromLink);
              return roomFromLink;
            }
          } catch (_) {}
        }
        if (!window.ClaimRelay?.createRoom) return null;
        const room = window.ClaimRelay.createRoom();
        rememberClaimRoom(room);
        return room;
      };

      const makeDefaultActivityName = (timestamp) => {
        const date = new Date(timestamp);
        const formatted = new Intl.DateTimeFormat(uiLang === 'en' ? 'en-HK' : 'zh-HK', {
          year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        }).format(date);
        return uiLang === 'en' ? `${formatted} bill` : `${formatted} 分帳`;
      };

      const getClaimLinkMetadata = () => {
        const customName = String(claimActivityName || '').replace(/[\r\n=＝]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
        const expiryDays = ['1', '3', '7', '14'].includes(String(claimExpiryDays)) ? String(claimExpiryDays) : '14';
        const previous = claimLinkMetaRef.current;
        if (previous && previous.customName === customName && previous.expiryDays === expiryDays
          && window.ClaimRelay?.sanitizeLinkMetadata(previous)) return previous;
        const createdAt = Date.now();
        const metadata = {
          title: customName || makeDefaultActivityName(createdAt),
          createdAt,
          expiresAt: createdAt + Number(expiryDays) * 24 * 60 * 60 * 1000,
          customName,
          expiryDays
        };
        claimLinkMetaRef.current = metadata;
        setClaimLinkMeta(metadata);
        if (draftSnapshotRef.current?.data) {
          draftSnapshotRef.current.data = { ...draftSnapshotRef.current.data, claimActivityName, claimExpiryDays: expiryDays, claimLinkMeta: metadata };
        }
        persistActiveDraft();
        return metadata;
      };

      const ensureClaimSession = async (metadata) => {
        if (claimSessionRequestRef.current) return claimSessionRequestRef.current;
        const previous = claimSessionRef.current;
        if (previous && previous.expiresAt > Date.now() && String(previous.ttlDays) === String(metadata.expiryDays)) return previous;
        if (!window.BillShareApi?.createSession) throw new Error('共用認帳服務尚未載入；請重新整理頁面後再試。');
        const billGeneration = billGenerationRef.current;
        const requestGeneration = inboxGenerationRef.current;
        claimSessionRequestRef.current = (async () => {
          try {
            const created = await window.BillShareApi.createSession(metadata.expiryDays);
            if (billGeneration !== billGenerationRef.current || requestGeneration !== inboxGenerationRef.current) throw Object.assign(new Error('Aborted'), { name: 'AbortError' });

      const calculateSplit = () => {
        setStepError('');
        if (!payer.trim()) { setStepError("⚠️ 請填寫墊支人姓名！"); focusField('payer'); return; }
        const rawTaxAmount = String(taxAmount ?? '').trim();
        const parsedTaxAmount = rawTaxAmount === '' ? 0 : Number(rawTaxAmount);
        if (!Number.isFinite(parsedTaxAmount) || parsedTaxAmount < 0) {
          setTaxInputError(true);
          focusField('tax-amount');
          return false;
        }
        const taxNum = ReceiptMath.roundMoney(parsedTaxAmount, detectedCurrency);

        const parsed = parseClaims(friendsReplies, items);
        const personClaims = parsed.claims;
        const claimUnits = parsed.claimUnits || {};

        if (parsed.people.length === 0) { setStepError("⚠️ 未能解析！請確保已正確貼上朋友回覆並填寫數量。"); focusField('replies'); return; }

        let conversionRate;
        try { conversionRate = ExchangeRates.requireRate(exchangeRate, detectedCurrency, currency); }
        catch (error) {
          setStepError(exchangeRate.status === 'loading'
            ? '⚠️ 正在取得最新匯率，請稍候再按「產生分帳報告」。'
            : '⚠️ 未能取得這組貨幣的匯率，請重試或選擇其他結算貨幣；未換算前不會產生報告。');
          return false;
        }

        const sourceTotal = ReceiptMath.roundMoney(
          items.reduce((sum, item) => sum + itemAmount(item), 0)
            + taxNum
            - ReceiptMath.roundMoney(toNum(discountAmount), detectedCurrency),
          detectedCurrency
        );
        const calculationItems = items.map(item => ({ ...item, total: itemAmount(item) }));

        const itemClaimTotals = {};
        calculationItems.forEach(item => { itemClaimTotals[item.id] = 0; Object.keys(personClaims).forEach(person => { itemClaimTotals[item.id] += (personClaims[person][item.id] || 0); }); });

        const reconciliationIssues = calculationItems.map(item => {
          const totalQty = toNum(item.totalQty);
          if (totalQty <= 0) return null;
          const actualPeople = Object.keys(personClaims).filter(person => claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          const sharePeople = Object.keys(personClaims).filter(person => !claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          if (!actualPeople.length || sharePeople.length) return null;
          const claimedQty = actualPeople.reduce((sum, person) => sum + personClaims[person][item.id], 0);
          const difference = totalQty - claimedQty;
          if (Math.abs(difference) < 0.0001) return null;
          return { itemId: item.id, name: item.name, unit: item.unit || '單位', totalQty, claimedQty, difference, amount: Math.abs(difference) * (toNum(item.total) / totalQty) };
        }).filter(Boolean);
        const hasOverClaim = reconciliationIssues.some(issue => issue.difference < 0);
        if (hasOverClaim) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError('⚠️ 有項目認帳數量超過單據總量，請返回修改後再計算。');
          return;
        }
        if (reconciliationIssues.length && !reconciliation?.policy) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError('⚠️ 有實際單位尚未完成數量核對，請選擇剩餘數量由誰承擔。');
          return;
        }

        const personTotals = {}; let totalItemsCost = 0;
        Object.keys(personClaims).forEach(person => { personTotals[person] = { items: [], adjustments: [], subtotal: 0, discount: 0, tax: 0, sourceTotal: 0, total: 0 }; });

        calculationItems.forEach(item => {
          const totalClaimed = itemClaimTotals[item.id];
          if (totalClaimed <= 0) return;
          const people = Object.keys(personClaims);
          const totalQty = toNum(item.totalQty);
          const canUseActualUnits = totalQty > 0;
          const actualTotal = people.reduce((sum, person) => sum + (canUseActualUnits && claimUnits[person]?.[item.id] ? (personClaims[person][item.id] || 0) : 0), 0);
          const shareTotal = people.reduce((sum, person) => sum + (!(canUseActualUnits && claimUnits[person]?.[item.id]) ? (personClaims[person][item.id] || 0) : 0), 0);
          const unitValue = toNum(item.total) / totalQty;
          const actualCostTotal = actualTotal > 0 ? actualTotal * unitValue : 0;
          const remainingCost = Math.max(0, toNum(item.total) - actualCostTotal);
          people.forEach(person => {
            const claimedQty = personClaims[person][item.id] || 0;
            if (claimedQty <= 0) return;
            const enteredUnit = claimUnits[person]?.[item.id] || '';
            const isActualUnit = canUseActualUnits && Boolean(enteredUnit);
            const allocationTotal = isActualUnit ? totalQty : (actualTotal > 0 ? shareTotal : totalClaimed);
            const cost = isActualUnit
              ? claimedQty * unitValue
              : (actualTotal > 0 ? (shareTotal > 0 ? claimedQty / shareTotal * remainingCost : 0) : claimedQty / totalClaimed * toNum(item.total));
            personTotals[person].items.push({ name: item.name, nameEn: item.nameEn || '', original: item.original || '', ja: item.ja || '', id: item.id, amount: cost, qty: claimedQty, totalClaimed, unit: enteredUnit, unitName: item.unit || '', allocationTotal, isActualUnit });
            personTotals[person].subtotal += cost; totalItemsCost += cost;
          });
        });

        reconciliationIssues.forEach(issue => {
          const policy = reconciliation?.policy;
          const item = calculationItems.find(candidate => candidate.id === issue.itemId);
          const amount = issue.amount;
          if (policy === 'payer') {
            if (!personTotals[payer]) personTotals[payer] = { items: [], adjustments: [], subtotal: 0, discount: 0, tax: 0, sourceTotal: 0, total: 0 };
            personTotals[payer].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference, unit: issue.unit, amount, reason: '墊支人承擔未認帳數量' });
            personTotals[payer].subtotal += amount; totalItemsCost += amount;
          } else if (policy === 'equal') {
            const claimants = Object.keys(personClaims).filter(person => personClaims[person][item.id] > 0);
            claimants.forEach(person => {
              const share = amount / claimants.length;
              personTotals[person].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference / claimants.length, unit: issue.unit, amount: share, reason: '已認帳人士平均承擔未認帳數量' });
              personTotals[person].subtotal += share; totalItemsCost += share;
            });
          } else if (policy && policy.startsWith('person:')) {
            const person = policy.slice(7);
            if (!personTotals[person]) personTotals[person] = { items: [], adjustments: [], subtotal: 0, discount: 0, tax: 0, sourceTotal: 0, total: 0 };
            personTotals[person].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference, unit: issue.unit, amount, reason: '指定承擔未認帳數量' });
            personTotals[person].subtotal += amount; totalItemsCost += amount;
          }
        });
        const reconciliationAllocations = reconciliationIssues.map(issue => ({ ...issue, policy: reconciliation?.policy }));

        const discountNum = ReceiptMath.roundMoney(toNum(discountAmount), detectedCurrency);
        if (discountNum < 0 || !ReceiptMath.isDiscountWithinSubtotal(discountNum, totalItemsCost, detectedCurrency)) {
          setStepError('⚠️ 整張單折扣不可多於已分攤項目小計，請核對折扣金額。'); focusField('discount-amount'); return;
        }
        const preDiscountItemsCost = totalItemsCost;
        Object.keys(personTotals).forEach(person => {
          const share = preDiscountItemsCost > 0 ? discountNum * (personTotals[person].subtotal / preDiscountItemsCost) : 0;
          personTotals[person].discount = share;
          personTotals[person].subtotal = Math.max(0, personTotals[person].subtotal - share);
        });
        totalItemsCost = Math.max(0, preDiscountItemsCost - discountNum);
        const numPeople = Object.keys(personTotals).length;
        Object.keys(personTotals).forEach(person => {
          let taxShare = 0;
          if (taxSplitMethod === 'equal') taxShare = taxNum / numPeople;
          else if (taxSplitMethod === 'proportional' && totalItemsCost > 0) taxShare = taxNum * (personTotals[person].subtotal / totalItemsCost);
          personTotals[person].tax = taxShare;
          personTotals[person].sourceTotal = personTotals[person].subtotal + taxShare;
        });

        const sourceBillTotal = ReceiptMath.roundMoney(totalItemsCost + taxNum, detectedCurrency);
        const sourceAmounts = Object.fromEntries(Object.entries(personTotals).map(([person, summary]) => [person, summary.sourceTotal]));
        let convertedTotals;
        try {
          convertedTotals = ExchangeRates.convertAggregatedAmounts({ amounts: sourceAmounts, totalAmount: sourceBillTotal, rate: conversionRate, targetCurrency: currency, moneyMath: ReceiptMath });
        } catch (error) {
          setStepError('⚠️ 原幣分帳小計未能與全單總額核對，請檢查認帳數量及折扣／稅費。');
          return false;
        }
        Object.entries(convertedTotals.amounts).forEach(([person, amount]) => { personTotals[person].total = amount; });
        const billTotal = convertedTotals.total;
        const calculatedResults = { calculationVersion: 2, personTotals, totalItemsCost, itemsSubtotal: preDiscountItemsCost, discountAmount: discountNum, taxAmount: taxNum, sourceBillTotal, settlementRoundingAdjustmentUnits: convertedTotals.roundingAdjustmentUnits, billTotal, sourceCurrency: detectedCurrency, sourceTotal, exchangeRate: conversionRate, exchangeRateDate: exchangeRate.date || null, exchangeProvider: exchangeRate.provider || 'Frankfurter', reconciliationAllocations, date: new Date().toISOString().split('T')[0], currency };
        autoPublishResultRef.current = !tutorialDemo && claimSessionRef.current?.link ? calculatedResults : null;
        setResults(calculatedResults);
        setIsSaved(false); setIsSavingRecord(false); setStep(4);
        return true;
      };

      const paymentDisplay = (value, language = uiLang) => {

      const unitDisplay = (value, language = uiLang, quantity = null) => {
        if (language !== 'en') return value || '單位';
        const map = { '件': 'piece(s)', '杯': 'cup(s)', '碟': 'plate(s)', '罐': 'can(s)', '份': 'serving(s)', '個': 'piece(s)', '支': 'piece(s)', '串': 'skewer(s)', '碗': 'bowl(s)', '瓶': 'bottle(s)', '包': 'pack(s)', '條': 'piece(s)', '隻': 'piece(s)', '單位': 'unit(s)' };
        return map[value] || value || 'unit(s)';
      };
      const reportCurrencyName = (currency, language) => {
        if (language !== 'en') { const names = { HKD: '港幣 (HKD)', JPY: '日元 (JPY)', KRW: '韓圜 (KRW)', TWD: '台幣 (TWD)', THB: '泰銖 (THB)', USD: '美金 (USD)', EUR: '歐元 (EUR)', GBP: '英鎊 (GBP)', MOP: '澳門幣 (MOP)', CNY: '人民幣 (CNY)', AUD: '澳元 (AUD)', CAD: '加拿大元 (CAD)', SGD: '新加坡元 (SGD)' }; return names[String(currency || '').toUpperCase()] || currency; }
        const code = String(currency || '').toUpperCase();
        const names = { HKD: 'Hong Kong dollars (HKD)', JPY: 'Japanese yen (JPY)', KRW: 'South Korean won (KRW)', TWD: 'New Taiwan dollars (TWD)', THB: 'Thai baht (THB)', USD: 'US dollars (USD)', EUR: 'euros (EUR)', GBP: 'British pounds (GBP)', MOP: 'Macanese patacas (MOP)', CNY: 'Chinese yuan (CNY)', MOP: 'Macanese patacas (MOP)', AUD: 'Australian dollars (AUD)', CAD: 'Canadian dollars (CAD)', SGD: 'Singapore dollars (SGD)' };

      const getSavedReportText = (record, reportType) => {

                    </div>

                  ) : (
                    <h2 className="text-2xl font-bold text-slate-800 tracking-tight">{tr("核對項目")}</h2>

                </div>
                {uploadError && lastRecognitionModel && receiptWasRead && (

                </div>
                <video ref={cameraVideoRef} playsInline muted autoPlay className="w-full max-w-lg max-h-[68vh] rounded-2xl bg-black object-contain" />
                <p className="text-white/80 text-sm mt-3">{tr("將單據放入畫面，按下面按鈕拍攝")}</p>
                <button type="button" onClick={captureCameraPhoto} className="green-action mt-4 w-20 h-20 rounded-full border-4 border-white bg-brand-500 shadow-lg active:scale-95" aria-label={tr("拍攝相片")}>
                  <span className="block w-12 h-12 mx-auto rounded-full border-2 border-black/80" />
                </button>
              </div>
            )}
          </main>
        </React.Fragment>
      );
    }

    function Application() {
      const [tourOpen, setTourOpen] = useState(false);
      const savedUi = useRef(null);
      const openHelp = useRef(null);
      const restoreFrame = useRef(0);
      const startTour = (showHelp, returnPosition) => {
        cancelAnimationFrame(restoreFrame.current);
        savedUi.current = { x: returnPosition?.x ?? window.scrollX, y: returnPosition?.y ?? window.scrollY, focus: document.activeElement };
        openHelp.current = showHelp;
        setTourOpen(true);
      };
      const closeTour = (showHelp = false) => {
        setTourOpen(false);
        if (showHelp) openHelp.current?.();
        const saved = savedUi.current;
        restoreFrame.current = requestAnimationFrame(() => {
          if (showHelp) window.scrollTo({ left: 0, top: 0, behavior: 'instant' });
          else if (saved) {
            const savedFocus = saved.focus?.isConnected && saved.focus.getClientRects().length ? saved.focus : null;
            const fallbackFocus = document.querySelector('[data-testid="header-action-menu-toggle"]')
              || document.querySelector('[data-testid="start-interactive-tutorial"]')
              || document.querySelector('[data-testid="start-tutorial"]');
            (savedFocus || fallbackFocus)?.focus({ preventScroll: true });
            window.scrollTo({ left: saved.x, top: saved.y, behavior: 'instant' });
          }
        });
      };
      useEffect(() => () => cancelAnimationFrame(restoreFrame.current), []);
      return <React.Fragment>
        <div data-live-app hidden={tourOpen} {...(tourOpen ? { inert: '' } : {})}>
          <App tutorialSuspended={tourOpen} onStartTutorial={startTour} />
        </div>
        {tourOpen && <window.BillTutorial language={window.BillI18n.language}
          onClose={() => closeTour(false)} onOpenHelp={() => closeTour(true)}
          renderDemo={(stage, onAction) => <App tutorialDemo tutorialStage={stage} onTutorialAction={onAction} />} />}
      </React.Fragment>;
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Application />);
  </script>
</body>
</html>
