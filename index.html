      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
    };

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button', ...rest }) => {
      const baseStyle = "flex items-center justify-center gap-2 px-5 py-3.5 rounded-xl font-bold text-base transition-all duration-200 active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed w-full md:w-auto outline-none focus:ring-2 focus:ring-offset-2";
      const variants = {
        primary: "bg-brand-600 text-white hover:bg-brand-700 shadow-md focus:ring-brand-500 border border-brand-700",
        secondary: "bg-white text-slate-800 border border-slate-400 hover:bg-slate-100 shadow-sm focus:ring-slate-400",
        outline: "border border-brand-600 text-brand-700 bg-transparent hover:bg-brand-50 focus:ring-brand-500",
        danger: "bg-red-600 text-white hover:bg-red-700 shadow-md focus:ring-red-500 border border-red-700",
      };
      const hasNonGreenBackground = className.split(/\s+/).some(token => /^!?bg-/.test(token) && !/^!?bg-(?:brand|emerald|green)-/.test(token));
      const greenActionClass = variant === 'primary' && !hasNonGreenBackground ? 'green-action' : '';
      return <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${greenActionClass} ${className}`} {...rest}>{children}</button>;
    };

    const Card = ({ children, className = '', ...rest }) => (
      <div className={`app-card bg-white rounded-2xl shadow-card border border-slate-400 p-5 md:p-6 ${className}`} {...rest}>{children}</div>
    );

    const Label = ({ children, required, className = '', htmlFor }) => (
      <label htmlFor={htmlFor} className={`font-bold text-slate-800 block mb-1.5 ${className}`}>
        {children}
        {required && <span className="ml-2 inline-block px-2 py-0.5 rounded bg-red-50 text-red-700 text-xs tracking-wide border border-red-500">{tr("必填")}</span>}
      </label>
    );

    const UI_DISCLOSURE_STORAGE_PREFIX = 'billSplitterUiDisclosureV1.';
    const readUiDisclosure = (key, fallback = false) => {
      try {
        const stored = localStorage.getItem(`${UI_DISCLOSURE_STORAGE_PREFIX}${key}`);
        if (stored === 'open') return true;
        if (stored === 'closed') return false;
      } catch (error) {}
      return fallback;
    };
    const writeUiDisclosure = (key, isOpen) => {
      try { localStorage.setItem(`${UI_DISCLOSURE_STORAGE_PREFIX}${key}`, isOpen ? 'open' : 'closed'); }
      catch (error) {}
    };
    const hasSavedOpenRouterKey = () => {
      for (const storage of [localStorage, sessionStorage]) {
        try {
          const config = JSON.parse(storage.getItem('billSplitterApiConfig') || '{}');
          if (String(config.keys?.openrouter || config.key || '').trim()) return true;
        } catch (error) {}
      }
      return false;
    };
    const Accordion = ({ title, icon, children, defaultOpen = false, tone = 'slate', testId, onToggle, preferenceKey, persistPreference = true }) => {
      const [open, setOpen] = useState(() => preferenceKey ? readUiDisclosure(preferenceKey, defaultOpen) : defaultOpen);
      const tones = {
        slate: 'bg-white border border-slate-500',
        amber: 'bg-amber-50 border border-amber-500',
        emerald: 'bg-emerald-50 border border-brand-500',
        blue: 'bg-blue-50 border border-blue-500',
      };
      return (
        <div className={`rounded-xl border overflow-hidden ${tones[tone]} shadow-sm`}>
          <button data-testid={testId} aria-expanded={open} onClick={() => { const nextOpen = !open; setOpen(nextOpen); if (preferenceKey && persistPreference) writeUiDisclosure(preferenceKey, nextOpen); onToggle?.(nextOpen); }} style={{ minHeight: '44px' }} className="w-full min-h-[44px] flex items-center justify-between gap-3 p-4 text-left outline-none hover:bg-slate-50 transition-colors">
            <span className="flex items-center gap-2.5 font-bold text-slate-800 text-base">
              {icon && <Icon path={icon} size={20} className="text-slate-600 shrink-0"/>}
              {title}
            </span>
            <Icon path={open ? icons.chevronUp : icons.chevronDown} size={20} className="text-slate-500 shrink-0"/>
          </button>
          {open && <div className="px-4 pb-4 pt-1 text-sm text-slate-700 leading-relaxed space-y-3">{children}</div>}
        </div>
      );
    };
    const RememberedDetails = ({ preferenceKey, defaultOpen = false, persistPreference = true, children, onToggle, ...props }) => {
      const [open, setOpen] = useState(() => readUiDisclosure(preferenceKey, defaultOpen));
      const handleToggle = event => {
        const nextOpen = event.currentTarget.open;
        if (nextOpen === open) return;
        setOpen(nextOpen);
        if (persistPreference) writeUiDisclosure(preferenceKey, nextOpen);
        onToggle?.(nextOpen);
      };
      return <details {...props} open={open} onToggle={handleToggle}>{children}</details>;
    };

    // Free vision cascade lives in ocr-cascade.js. This app only offers free models.
    const Ocr = window.OcrCascade;
    const DEFAULT_FREE_MODEL = Ocr.DEFAULT_FREE_MODEL;
    const FREE_MODELS = Ocr.FREE_MODELS;
    const resolveBillModel = Ocr.resolveBillModel;
    const modelUsesFreeTier = Ocr.modelUsesFreeTier;
    const describeOpenRouterFailure = Ocr.describeOpenRouterFailure;
    const isTransientOcrFailure = Ocr.isTransientOcrFailure;
    const OCR_ATTEMPT_MS = Ocr.OCR_ATTEMPT_MS;
    const FREE_OCR_MAX_ATTEMPTS = Ocr.TRANSIENT_ATTEMPTS;
    const OCR_RETRY_BACKOFF_MS = Ocr.OCR_RETRY_BACKOFF_MS;
    const FREE_AI_MAX_EDGE = 1280;
    const FREE_AI_JPEG_QUALITY = 0.6;
    const PAID_AI_MAX_EDGE = 1600;
    const PAID_AI_JPEG_QUALITY = 0.72;
    const LOCAL_PADDLE_MODEL_ID = 'local/paddleocr-js';
    const RECEIPT_JSON_IMPORT_PROMPT_ZH = `請辨認我附上的收據圖片，將商品名稱翻譯成香港繁體中文，並依照下方固定格式輸出一個有效 JSON 物件。多張圖片只有在屬於同一張收據（例如不同角度或續頁）時才合併；若明顯是不同收據，不要混在一起。

輸出方式：只回覆一個 Markdown JSON 程式碼區塊（以 \`\`\`json 開始、以 \`\`\` 結束），讓聊天介面顯示「複製」按鈕，方便一鍵複製整份內容。程式碼區塊內只放完整 JSON 物件；不要建立或要求下載附件，不要在區塊外加標題、說明或其他文字，不要分段或拆成多個區塊。

辨認規則：
- 只把實際購買的商品放在 items；稅、服務費及折扣各自放在 adjustments。小計、合計、應付金額、付款額及找零不可放入 items 或 adjustments。
- name 必須是香港繁體中文商品名稱；original 逐字保留收據上的商品原文。nameEn 只填清楚可確認的英文名稱，否則填空字串；ja 只填收據上清楚可確認的日文名稱，否則填空字串。
- price、qty、total 只在收據清楚印出且意思明確時填數字；total 只填清楚印出的商品行總額，不要用單價乘數量推算。未印出或看不清的數值填 null；totalQty 未明確印出時填 null；unit 未印出時填空字串。
- amountText 逐字保留該商品行印出的金額原文，包括貨幣符號、字母及標點；看不清時填空字串並設 amountUncertain 為 true。若原文可能把 $ 誤讀成 S（例如 S12.50），保留所見原文並設 amountUncertain 為 true；不可靜默改符號，也不可把正規化後的數字當成已核實。
- 若同一行的數字可能有多種意思（例如數量、單價或商品名稱／規格的一部分），不要猜；相關數值填 null，amountUncertain 設為 true。只有金額清楚可確認時 amountUncertain 才填 false。
- adjustments.kind 只用 tax 或 discount；服務費歸類為 tax，並在 label 保留收據上的服務費字樣。只抄收據明確印出的稅率、金額及計算基數；金額填正數，未印出或不確定時填 null。application 用 separate、included 或 unknown；scope 用 receipt 或 item；itemIndex 使用 items 中從 0 開始的索引，否則填 null；order 按收據上的調整項次序從 0 開始。
- 沒有調整項時 adjustments 必須是空陣列 []。currency 使用 ISO 4217 三位碼；無法確認時填 null。date 使用 YYYY-MM-DD；無法確認時填 null。receiptTotal 只填清楚印出的最終應付總額，否則填 null。其他未印出或看不清的文字欄位填空字串，不要估算或捏造。

格式（每個欄位都必須保留；items 可有多項，adjustments 沒有時用 []）：
{"items":[{"name":"拉麵","nameEn":"","original":"ラーメン","ja":"","price":100,"qty":1,"totalQty":null,"unit":"碗","total":100,"amountText":"100","amountUncertain":false}],"adjustments":[{"label":"消費税","kind":"tax","ratePercent":8,"amount":null,"baseAmount":null,"application":"separate","scope":"receipt","itemIndex":null,"order":0}],"taxTotal":null,"taxNote":"","currency":"JPY","date":"2026-03-14","receiptTotal":108}`;
    const RECEIPT_JSON_IMPORT_PROMPT_EN = `Read the receipt image(s) I attach, translate item names into Hong Kong Traditional Chinese, and return one valid JSON object using the exact structure below. Combine multiple images only when they show the same receipt (for example, different angles or continuation pages); do not mix clearly separate receipts.

Output format: Reply with exactly one Markdown JSON code block (starting with \`\`\`json and ending with \`\`\`) so the chat interface can show its one-click Copy button for the complete content. Put only the complete JSON object inside the code block. Do not create or request a downloadable attachment, and do not add a title, explanation, or any other text outside the block. Do not split the response or use multiple blocks.

Recognition rules:
- Put actual purchased goods in items only. Put tax, service fees, and discounts in adjustments. Never put subtotal, total, amount due, payment, or change in items or adjustments.
- name must be the item name in Hong Kong Traditional Chinese; original must preserve the printed item text exactly. Set nameEn only to a clearly identifiable English name, otherwise use an empty string. Set ja only to a clearly identifiable Japanese name printed on the receipt, otherwise use an empty string.
- Set price, qty, and total to numbers only when clearly printed and unambiguous. total must be the clearly printed line total; do not calculate it from unit price × quantity. Use null for unprinted or unclear numeric values; use null for totalQty unless the total quantity is explicitly printed; use an empty string for an unprinted unit.
- amountText must preserve the exact printed amount text for that item line, including currency symbols, letters, and punctuation. If unreadable, use an empty string and set amountUncertain to true. If $ may have been misread as S (for example S12.50), preserve what is visible and set amountUncertain to true; never silently change the glyph or treat a normalized number as verified.
- If a number on one row could mean more than one thing (for example quantity, unit price, or part of an item name/specification), do not guess; set related numeric fields to null and amountUncertain to true. Set amountUncertain to false only when the amount is clearly confirmed.
- Use only tax or discount for adjustments.kind; classify service fees as tax and preserve the service-fee wording in label. Copy only tax rates, amounts, and bases that are explicitly printed; amounts must be positive, and use null when unprinted or uncertain. Use separate, included, or unknown for application; use receipt or item for scope; itemIndex is the zero-based index in items or null; order follows the adjustment lines on the receipt, starting at 0.
- If there are no adjustments, adjustments must be []. Use a three-letter ISO 4217 currency code, or null if unknown. Use YYYY-MM-DD for date, or null if unknown. Set receiptTotal only to the clearly printed final amount due; otherwise use null. For all other unprinted or unclear fields, use an empty string; never estimate or invent values.

Format (keep every field; items may contain multiple entries, and adjustments must be [] when absent):
{"items":[{"name":"拉麵","nameEn":"ramen","original":"ラーメン","ja":"","price":100,"qty":1,"totalQty":null,"unit":"bowl","total":100,"amountText":"100","amountUncertain":false}],"adjustments":[{"label":"消費税","kind":"tax","ratePercent":8,"amount":null,"baseAmount":null,"application":"separate","scope":"receipt","itemIndex":null,"order":0}],"taxTotal":null,"taxNote":"","currency":"JPY","date":"2026-03-14","receiptTotal":108}`;
    const recognitionModelLabel = modelId => {

      const isTextInput = value.startsWith('text-input|');
      const modelValue = isTextInput ? value.slice('text-input|'.length) : value;
      const parts = modelValue.split('|');
      const isLocal = parts[0] === LOCAL_PADDLE_MODEL_ID;

    const waitForOcrBackoff = (ms, signal) => new Promise((resolve, reject) => {
      if (signal?.aborted) {
        const aborted = new Error('Aborted');
        aborted.name = 'AbortError';
        reject(aborted);
        return;
      }
      const timer = setTimeout(() => {
        signal?.removeEventListener('abort', onAbort);
        resolve();
      }, ms);
      const onAbort = () => {
        clearTimeout(timer);
        const aborted = new Error('Aborted');
        aborted.name = 'AbortError';
        reject(aborted);
      };
      signal?.addEventListener('abort', onAbort, { once: true });
    });

    const toNum = (v) => {
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      if (v === null || v === undefined) return 0;
      const m = String(v).replace(/[^\d.\-]/g, '');
      const n = parseFloat(m);
      return isNaN(n) ? 0 : n;
    };

    const extractPayload = rawText => ReceiptMath.extractPayload(rawText);

    // Free vision models often copy the receipt into name. Keep name in Hong Kong

    const RECEIPT_NAME_PENDING = '（未譯，見原文）';

    const RECEIPT_EXTRA_CHINESE_KEYS = ['nameZh', 'name_zh', 'zh', 'zhHK', 'chinese', 'nameTc', 'nameTC', 'translation', 'translated', 'translatedName'];
    const RECEIPT_GENERIC_NAMES = new Set(['項目', '商品', '品項', '品目', '食物', '食品', '菜式', '菜品', 'item', 'items', 'unknown', 'n/a', 'na']);

      '生ビール': '生啤', 'ビール': '啤酒', '日本酒': '清酒', '焼酎': '燒酎', 'ハイボール': '高球',
      '赤ワイン': '紅酒', '白ワイン': '白酒', 'ワイン': '葡萄酒', 'お茶漬け': '茶泡飯', 'お茶': '茶',
      '緑茶': '綠茶', 'ご飯': '白飯', 'ごはん': '白飯', 'ライス': '白飯', '味噌汁': '味噌湯', 'みそしる': '味噌湯',
      '焼き肉': '燒肉', '焼肉': '燒肉', 'やきにく': '燒肉', '焼き鳥': '燒雞串', 'やきとり': '燒雞串',

      '豚カツ': '炸豬排', 'カツ丼': '炸豬排飯', '牛丼': '牛肉飯', 'ぎゅうどん': '牛肉飯', 'お好み焼き': '大阪燒',

      'ほたて': '扇貝', 'ホタテ': '扇貝', 'お弁当': '便當', '弁当': '便當', 'セット': '套餐', '大盛': '大碗',
      '朝食': '早餐', '昼食': '午餐', '夕食': '晚餐', '비빔밥': '拌飯', '김치찌개': '泡菜鍋', '김치볶음밥': '泡菜炒飯',
      '김치': '泡菜', '된장찌개': '大醬湯', '순두부찌개': '嫩豆腐鍋', '순두부': '嫩豆腐', '불고기': '韓式燒肉',
      '삼겹살': '五花肉', '갈비': '排骨', '냉면': '冷麵', '라면': '拉麵', '김밥': '紫菜包飯', '떡볶이': '炒年糕',
      '소주': '燒酒', '맥주': '啤酒', '잡채': '雜菜', '삼계탕': '參雞湯', '해물파전': '海鮮蔥餅', '파전': '蔥餅',
      '만두': '餃子', '치킨': '炸雞', '커피': '咖啡', '아이스크림': '雪糕', '칼국수': '刀切麵'
    };
    const DISH_GLOSSARY_KEYS = Object.keys(DISH_GLOSSARY).sort((a, b) => b.length - a.length || (a < b ? -1 : a > b ? 1 : 0));

    const receiptText = (value) => String(value ?? '').replace(/\s+/g, ' ').trim();
    const receiptCompact = (value) => receiptText(value).normalize('NFKC').replace(/\s+/g, '').toLowerCase();
    const sameReceiptText = (a, b) => {
      const left = receiptCompact(a);
      const right = receiptCompact(b);
      return !!left && left === right;
    };
    const countScript = (value, pattern) => (receiptCompact(value).match(pattern) || []).length;
    const kanaCount = (value) => countScript(value, /[\u3040-\u30ff]/g);
    const hangulCount = (value) => countScript(value, /[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/g);
    const hanCount = (value) => countScript(value, /[\u4e00-\u9fff]/g);
    const latinCount = (value) => countScript(value, /[a-z]/g);
    const hasKana = (value) => kanaCount(value) > 0;
    const hasHangul = (value) => hangulCount(value) > 0;
    const hasHan = (value) => hanCount(value) > 0;
    const isForeignScriptHeavy = (value) => {
      const foreign = kanaCount(value) + hangulCount(value);
      if (!foreign) return false;
      const han = hanCount(value);
      return han === 0 || han * 2 <= foreign;
    };
    const looksLikeChineseName = (value) => {
      const text = receiptText(value);
      if (!text || hasKana(text) || hasHangul(text) || !hasHan(text)) return false;
      return hanCount(text) >= latinCount(text);
    };
    const looksLikeEnglishName = (value) => {
      const text = receiptText(value);
      if (!text || hasHan(text) || hasKana(text) || hasHangul(text)) return false;
      return latinCount(text) > 0;
    };
    const isGenericDishName = (value) => RECEIPT_GENERIC_NAMES.has(receiptCompact(value));
    const toHongKongTraditional = (value) => {
      const source = receiptText(value);
      let out = '';
      for (const ch of source) out += RECEIPT_TRAD_MAP[ch] || ch;
      return out.replace(/\s+/g, ' ').trim();
    };
    const splitReceiptNameChunks = (value) => {
      const parenBits = [];
      const outside = receiptText(value).replace(/[（(]([^（）()]*)[）)]/g, (_, inner) => {
        parenBits.push(inner);
        return ' ';
      });
      return [outside, ...parenBits].flatMap(part => String(part).split(/[\/／|｜]/)).map(receiptText).filter(Boolean);
    };
    const applyDishGlossary = (value) => {
      const source = receiptCompact(value);
      if (!source) return '';
      if (DISH_GLOSSARY[source]) return DISH_GLOSSARY[source];
      let index = 0;
      let out = '';
      let replaced = false;
      while (index < source.length) {
        let hit = '';
        for (const key of DISH_GLOSSARY_KEYS) {
          if (key.length >= 2 && source.startsWith(key, index)) { hit = key; break; }
        }
        if (hit) {
          out += DISH_GLOSSARY[hit];
          index += hit.length;
          replaced = true;
        } else {
          out += source[index];
          index += 1;
        }
      }
      return replaced ? out : '';
    };
    const extractBilingualChinese = (value) => {
      const chunks = splitReceiptNameChunks(value);
      const chinese = chunks.filter(looksLikeChineseName);
      const foreign = chunks.filter(part => hasKana(part) || hasHangul(part));
      if (!chinese.length || !foreign.length) return '';
      return chinese.join('');
    };
    const foreignReceiptText = (value) => {
      const chunks = splitReceiptNameChunks(value);
      const chinese = chunks.filter(looksLikeChineseName);
      const foreign = chunks.filter(part => hasKana(part) || hasHangul(part));
      if (!chinese.length || !foreign.length) return '';
      return foreign.join('');
    };
    const japaneseReading = (value) => {
      const text = receiptText(value);
      if (!hasKana(text) || hasHangul(text)) return '';
      if (!hasHan(text)) return text;
      return (receiptCompact(text).match(/[\u3040-\u30ff]+/g) || []).join('');
    };
    const translateMixedScriptDish = (value) => {
      const source = receiptCompact(value);
      if (!source) return '';
      const runs = [];
      let buf = '';
      let kind = '';
      const kindOf = (ch) => {
        if (/[\u3040-\u30ff]/.test(ch)) return 'kana';
        if (/[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(ch)) return 'hangul';
        if (/[\u4e00-\u9fff]/.test(ch)) return 'han';
        return 'other';
      };
      for (const ch of source) {
        const nextKind = kindOf(ch);
        const stick = buf && (nextKind === kind || nextKind === 'other' || kind === 'other');
        if (stick) buf += ch;
        else {
          if (buf) runs.push({ kind, text: buf });
          buf = ch;
          kind = nextKind;
        }
      }
      if (buf) runs.push({ kind, text: buf });
      const foreignRuns = runs.filter(run => run.kind === 'kana' || run.kind === 'hangul');
      const hanRuns = runs.filter(run => run.kind === 'han');
      if (!foreignRuns.length || !hanRuns.length) return '';
      const foreignText = foreignRuns.map(run => applyDishGlossary(run.text));
      if (foreignText.some(part => !part)) return '';
      const hanText = toHongKongTraditional(hanRuns.map(run => run.text).join(''));
      const translatedForeign = toHongKongTraditional(foreignText.join(''));
      if (receiptCompact(hanText) === receiptCompact(translatedForeign)) return hanText;
      const rebuilt = runs.map(run => (run.kind === 'kana' || run.kind === 'hangul') ? applyDishGlossary(run.text) : run.text).join('');
      const traditional = toHongKongTraditional(rebuilt);
      return (hasKana(traditional) || hasHangul(traditional)) ? '' : traditional;
    };
    const translateForeignDishName = (value) => {
      const raw = receiptText(value);
      if (!raw || isGenericDishName(raw)) return '';
      const bilingual = extractBilingualChinese(raw);
      if (bilingual) return toHongKongTraditional(bilingual);
      if (hasKana(raw) || hasHangul(raw)) {
        const mixed = translateMixedScriptDish(raw);
        if (mixed) return mixed;
        const traditional = toHongKongTraditional(applyDishGlossary(raw) || raw);
        if (hasKana(traditional) || hasHangul(traditional) || !hasHan(traditional)) return '';
        return traditional;
      }
      if (!hasHan(raw)) return '';
      const traditional = toHongKongTraditional(applyDishGlossary(raw) || raw);
      if (hasKana(traditional) || hasHangul(traditional) || !hasHan(traditional)) return '';
      return traditional;
    };
    const nameNeedsChinese = (name, original) => {
      if (isForeignScriptHeavy(name) || hasKana(name) || hasHangul(name)) return true;
      if (sameReceiptText(name, original) && (hasKana(original) || hasHangul(original))) return true;
      if (!receiptText(name) && (hasKana(original) || hasHangul(original))) return true;
      if (isGenericDishName(name) && (hasKana(original) || hasHangul(original))) return true;
      if (looksLikeEnglishName(name) && (hasKana(original) || hasHangul(original))) return true;
      return false;
    };
    const jaRepeatsOriginal = (reading, original) => {
      const left = receiptCompact(reading);
      const right = receiptCompact(original);
      if (!left || !right) return false;
      return left === right || right.includes(left);
    };
    const keepDistinctJapanese = (current, candidate, original) => {
      const have = japaneseReading(current);
      if (have && !jaRepeatsOriginal(have, original)) return have;
      const next = japaneseReading(candidate);
      if (!next || jaRepeatsOriginal(next, original)) return '';
      return next;
    };
    const parkedChineseName = (source, nameEn, ja) => {
      const values = [nameEn, ja, ...RECEIPT_EXTRA_CHINESE_KEYS.map(key => source[key])];
      for (const value of values) {
        const text = receiptText(value);
        if (looksLikeChineseName(text) && !isGenericDishName(text)) return text;
      }
      return '';
    };
    const firstForeignTranslation = (...values) => {
      for (const value of values) {
        const text = receiptText(value);
        if (!hasKana(text) && !hasHangul(text)) continue;
        const translated = translateForeignDishName(text);
        if (translated && looksLikeChineseName(translated) && !isGenericDishName(translated)) return translated;
      }
      return '';
    };
    const normalizeReceiptItemNames = (item) => {
      const source = item && typeof item === 'object' ? item : {};
      let name = receiptText(source.name);
      let nameEn = receiptText(source.nameEn);
      let original = receiptText(source.original);
      let ja = receiptText(source.ja);

      if ((hasKana(name) || hasHangul(name)) && looksLikeChineseName(original)) {
        const foreign = foreignReceiptText(name) || name;
        if (!looksLikeChineseName(foreign)) {
          name = original;
          original = foreign;
        }
      }

          if (prev && !isSepLine(prev)) {

    const parseClaimValue = (raw) => {
      const text = String(raw || '').replace(/＝/g, '=').trim();
      const match = text.match(/([+-]?(?:\d+\s*\/\s*\d+|\d+(?:\.\d*)?|\.\d+))\s*([^\d\s=，,。！？]*)/);
      if (!match) return { qty: NaN, unit: '' };
      const token = match[1].replace(/\s+/g, '');
      let qty;
      if (token.includes('/')) {
        const [numerator, denominator] = token.split('/').map(Number);
        qty = Number.isFinite(denominator) && denominator > 0 ? numerator / denominator : NaN;
      } else qty = Number(token);
      return { qty, unit: String(match[2] || '').trim() };

      const scale = 10 ** Math.max(6, ReceiptMath.currencyDecimals(currency));
      const epsilon = Number.EPSILON * Math.max(1, Math.abs(value));

    const allocateCurrencyAmount = (amount, weights, currency = 'HKD', precision = 0) => {
      const value = Number(amount);
      const decimals = Math.max(2, ReceiptMath.currencyDecimals(currency), Number(precision) || 0);
      const scale = 10 ** decimals;
      const epsilon = Number.EPSILON * Math.max(1, Math.abs(value));
      const units = Number.isFinite(value) ? Math.round((value + (value < 0 ? -epsilon : epsilon)) * scale) : NaN;
      if (!Number.isSafeInteger(units) || units < 0) throw new Error('Invalid amount for currency allocation.');
      const entries = Object.entries(weights || {}).map(([name, rawWeight], index) => ({ name, weight: Number(rawWeight), index, units: 0, fraction: 0 }))
        .filter(entry => Number.isFinite(entry.weight) && entry.weight > 0);
      const weightTotal = entries.reduce((sum, entry) => sum + entry.weight, 0);
      if (!entries.length || weightTotal <= 0) return {};
      let allocatedUnits = 0;
      entries.forEach(entry => {
        const exact = units * entry.weight / weightTotal;
        entry.units = Math.floor(exact);
        entry.fraction = exact - entry.units;
        allocatedUnits += entry.units;

      const byRemainder = [...entries].sort((a, b) => b.fraction - a.fraction || a.index - b.index);
      for (let index = 0; index < remainder; index++) byRemainder[index % byRemainder.length].units += 1;

    const RECEIPT_DB_NAME = 'billSplitterLocalData';

      request.onupgradeneeded = () => {

      request.onsuccess = () => {
        if (settled) { request.result.close(); return; }
        settled = true; clearTimeout(timer); resolve(request.result);
      };
      request.onerror = () => fail(request.error || new Error('無法開啟本機單據儲存'));

      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: image.mimeType || 'image/jpeg' });

      const mimeType = entry.mimeType || entry.blob?.type || 'image/jpeg';

    const saveReceiptImagesLocally = async (recordId, images) => {

        await new Promise((resolve, reject) => {

          transaction.onerror = () => reject(transaction.error || new Error('無法儲存收據圖片'));

          let result = null;
          if (operation === 'read') {

              attachments: snapshot.attachments.map(file => ({ name: file.name, type: file.type, lastModified: file.lastModified, blob: file }))

          transaction.oncomplete = () => resolve(result);

    const createRedactedReceiptFile = (imageData, masks, index, quality = 0.92) => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => {
        try {
          const maxDimension = 4096;
          const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('無法處理圖片');
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          context.fillStyle = '#000000';
          (masks || []).forEach(mask => {
            const x = Math.max(0, Math.min(1, mask.x));
            const y = Math.max(0, Math.min(1, mask.y));
            const right = Math.max(x, Math.min(1, mask.x + mask.width));
            const bottom = Math.max(y, Math.min(1, mask.y + mask.height));
            context.fillRect(Math.floor(x * canvas.width), Math.floor(y * canvas.height), Math.ceil((right - x) * canvas.width), Math.ceil((bottom - y) * canvas.height));
          });
          canvas.toBlob(blob => {
            if (!blob) { reject(new Error('無法輸出遮蓋後的圖片')); return; }
            resolve(new File([blob], `redacted-receipt-${String(index + 1).padStart(2, '0')}.jpg`, { type: 'image/jpeg' }));
          }, 'image/jpeg', quality);
        } catch (error) { reject(error); }
      };
      image.onerror = () => reject(new Error('無法載入單據圖片'));
      image.src = `data:${imageData.mimeType};base64,${imageData.data}`;
    });

          const longest = Math.max(image.naturalWidth, image.naturalHeight) || 1;
          const scale = Math.min(1, maxEdge / longest);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('無法處理圖片');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const data = dataUrl.split(',')[1];
          if (!data) throw new Error('無法處理圖片');
          resolve({ mimeType: 'image/jpeg', data });
        } catch (error) { reject(error); }
      };
      image.onerror = () => reject(new Error('無法載入單據圖片'));
      image.src = `data:${imageData.mimeType};base64,${imageData.data}`;

        setFriendsReplies(text);
        setStepError('');
        requestAnimationFrame(() => {
          el.focus();
          el.setSelectionRange(text.length, text.length);
          const lines = text.slice(0, blockStart).split('\n').length;
          const lineH = parseFloat(getComputedStyle(el).lineHeight) || 20;
          el.scrollTop = Math.max(0, (lines - 1) * lineH - 8);
        });
      };

      const onFocusReplies = (e) => {
        const el = e.target;
        const atEnd = el.selectionStart >= el.value.replace(/\s+$/, '').length;
        const fixed = ensureTail(el.value);
        if (fixed !== el.value) setFriendsReplies(fixed);
        if (atEnd) parkCaret(el);
      };

      const onBlurReplies = (e) => {
        const fixed = ensureTail(normalizeReplies(e.target.value));
        if (fixed !== friendsReplies) setFriendsReplies(fixed);
      };

      // Image-only HTML inputs open Android Chrome's media picker. Prefer the
      // Files API at Downloads; retain a broad file-input fallback and validate
      // the actual MIME type in the existing upload handlers.
      const openReceiptImagePicker = async inputRef => {
        const input = inputRef?.current;
        if (!input) return;
        if (typeof window.showOpenFilePicker !== 'function') {
          input.click();
          return;
        }
        let files = [];
        try {
          const handles = await window.showOpenFilePicker({
            startIn: 'downloads',
            multiple: true,
            types: [{
              description: uiLang === 'en' ? 'Receipt images' : '收據圖片',
              accept: {
                'image/jpeg': ['.jpg', '.jpeg'],
                'image/png': ['.png'],
                'image/webp': ['.webp']
              }
            }]
          });
          files = await Promise.all((handles || []).map(handle => handle.getFile()));
        } catch (error) {
          if (error?.name === 'AbortError') return;
          if (!input.disabled) input.click();
          return;
        }
        if (!files.length) return;
        const event = { target: { files, value: '' } };
        if (input === receiptAttachmentInputRef.current) await handleReceiptImageAttachmentUpload(event);
        else await handleFileUpload(event);
      };

      const triggerUpload = () => {
        if (tutorialDemo) { onTutorialAction?.('receipt'); return; }
        if (!apiKey.trim()) { toast('讀單據先要你自己的免費 OpenRouter 鎖匙。', 'error'); setShowSettings(true); return; }
        openReceiptImagePicker(fileInputRef);
      };

      const triggerCamera = () => {
        if (tutorialDemo) { onTutorialAction?.('receipt'); return; }
        if (!apiKey.trim()) { toast('讀單據先要你自己的免費 OpenRouter 鎖匙。', 'error'); setShowSettings(true); return; }
        if (!navigator.mediaDevices?.getUserMedia) {
          toast('⚠️ 此瀏覽器不支援網頁相機，請改用「選擇圖片」', 'error');
          if (cameraInputRef.current) cameraInputRef.current.click();
          return;
        }
        const generation = billGenerationRef.current;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
          .then(stream => {
            if (generation !== billGenerationRef.current) { stream.getTracks().forEach(track => track.stop()); return; }
            cameraStreamRef.current = stream;
            setCameraOpen(true);
            requestAnimationFrame(() => {
              if (cameraVideoRef.current) {
                cameraVideoRef.current.srcObject = stream;
                cameraVideoRef.current.play().catch(() => {});
              }
            });
          })
          .catch(() => { if (generation === billGenerationRef.current) toast('⚠️ 未能開啟相機，請允許此網站使用相機，或改用「選擇圖片」', 'error'); });
      };

      const closeCamera = () => {
        if (cameraStreamRef.current) {
          cameraStreamRef.current.getTracks().forEach(track => track.stop());
          cameraStreamRef.current = null;
        }
        setCameraOpen(false);
      };

      const captureCameraPhoto = () => {
        if (tutorialDemo) return;
        const video = cameraVideoRef.current;
        if (!video || !video.videoWidth || !video.videoHeight) {
          toast('⚠️ 相機仍在啟動，請稍候再按一次', 'error');
          return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        const generation = billGenerationRef.current;
        canvas.toBlob(blob => {
          if (generation !== billGenerationRef.current) return;
          if (!blob) { toast('⚠️ 未能擷取相片，請再試一次', 'error'); return; }
          closeCamera();
          handleFileUpload({ target: { files: [new File([blob], `receipt-camera-${Date.now()}.jpg`, { type: 'image/jpeg' })], value: '' } });
        }, 'image/jpeg', 0.92);
      };

      const cancelRedactionStroke = () => {
        const drag = redactionDragRef.current;
        redactionDragRef.current = null;
        setRedactionDrag(null);
        const canvas = redactionCanvasRef.current;
        if (drag && canvas) {
          try { if (canvas.hasPointerCapture(drag.pointerId)) canvas.releasePointerCapture(drag.pointerId); } catch (error) {}
        }
      };

      const setRedactionDrawingMode = (enabled) => {
        redactionDrawEnabledRef.current = Boolean(enabled);
        setRedactionDrawEnabled(Boolean(enabled));
        cancelRedactionStroke();
      };

      const getRedactionPoint = (event) => {
        const canvas = redactionCanvasRef.current;
        if (!canvas) return null;
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        return {
          x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
          y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
        };
      };

      const handleRedactionPointerDown = (event) => {
        if (!redactionDrawEnabledRef.current || isPreparingRedacted || redactionDragRef.current || event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
        const point = getRedactionPoint(event);
        if (!point) return;
        event.preventDefault();
        try { event.currentTarget.setPointerCapture(event.pointerId); } catch (error) {}
        const drag = { pointerId: event.pointerId, imageIndex: redactionIndex, startX: point.x, startY: point.y, currentX: point.x, currentY: point.y };
        redactionDragRef.current = drag;
        setRedactionDrag(drag);
      };

      const handleRedactionPointerMove = (event) => {
        if (!redactionDrawEnabledRef.current || isPreparingRedacted) return;
        const drag = redactionDragRef.current;
        if (drag && (drag.pointerId !== event.pointerId || drag.imageIndex !== redactionIndex)) return;
        const point = drag && getRedactionPoint(event);
        if (!drag || !point) return;
        const next = { ...drag, currentX: point.x, currentY: point.y };
        redactionDragRef.current = next;
        setRedactionDrag(next);
      };

      const handleRedactionPointerUp = (event) => {
        if (!redactionDrawEnabledRef.current || isPreparingRedacted) { cancelRedactionStroke(); return; }
        const drag = redactionDragRef.current;
        if (drag && (drag.pointerId !== event.pointerId || drag.imageIndex !== redactionIndex)) return;
        const point = drag && getRedactionPoint(event);
        if (!drag || !point) return;
        cancelRedactionStroke();
        const x = Math.min(drag.startX, point.x);
        const y = Math.min(drag.startY, point.y);
        const width = Math.abs(point.x - drag.startX);
        const height = Math.abs(point.y - drag.startY);
        if (width < 0.005 || height < 0.005) return;
        setRedactionMasks(current => {
          const next = current.slice();
          next[redactionIndex] = [...(next[redactionIndex] || []), { x, y, width, height }];
          return next;
        });
      };

      const cancelReceiptRedaction = () => {
        if (isPreparingRedacted) return;
        setRedactionDrawingMode(false);
        setShowRedaction(false);
        setPendingRedactionImages([]);
        setRedactionMasks([]);
        setRedactionIndex(0);
        setRedactionDrag(null);
        redactionDragRef.current = null;
        if (!receiptAttachmentOnly) setLastImageData([]);
        setReceiptAttachmentOnly(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
        if (receiptAttachmentInputRef.current) receiptAttachmentInputRef.current.value = '';
      };

      const startOcrWithRedactedImages = async () => {
        if (tutorialDemo) return;
        if (!pendingRedactionImages.length || isPreparingRedacted) return;
        setRedactionDrawingMode(false);
        setIsPreparingRedacted(true);
        const generation = billGenerationRef.current;
        try {
          const makeBatch = async quality => {
            const output = [];
            for (let index = 0; index < pendingRedactionImages.length; index++) {
              output.push(await createRedactedReceiptFile(pendingRedactionImages[index], redactionMasks[index] || [], index, quality));
            }
            return output;
          };
          let redactedFiles = await makeBatch(0.92);
          const existingBytes = receiptAttachmentOnly
            ? lastImageData.reduce((sum, image) => sum + Math.ceil(String(image?.data || '').length * 3 / 4), 0)
            : 0;
          const batchBytes = files => files.reduce((sum, file) => sum + file.size, 0);
          if (existingBytes + batchBytes(redactedFiles) > 12 * 1024 * 1024) redactedFiles = await makeBatch(0.82);
          if (existingBytes + batchBytes(redactedFiles) > 12 * 1024 * 1024) throw new Error('遮蓋後圖片總容量仍超過 12 MB，請減少圖片數量或分批處理。');
          if (receiptAttachmentOnly && lastImageData.length + redactedFiles.length > 5) throw new Error('收據圖片最多 5 張，請先移除部分圖片再試。');
          if (generation !== billGenerationRef.current) return;
          if (receiptAttachmentOnly) {
            const appendedImages = await Promise.all(redactedFiles.map(file => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve({ mimeType: 'image/jpeg', data: String(reader.result || '').split(',')[1] || '' });
              reader.onerror = () => reject(new Error(`未能讀取遮蓋後圖片：${file.name}`));
              reader.readAsDataURL(file);
            })));
            if (generation !== billGenerationRef.current) return;
            setLastImageData(current => [...current, ...appendedImages]);
            if (results && claimSessionRef.current?.link) setReceiptImageSharePending(true);
            setIsSaved(false);
            setUploadError('');
            setReceiptAttachmentOnly(false);
            setPendingRedactionImages([]);
            setRedactionMasks([]);
            setRedactionIndex(0);
            setShowRedaction(false);
            setRedactionDrag(null);
            redactionDragRef.current = null;
            toast(bi('✅ 相片已加入；分享後會顯示在同一條結果連結（不做 OCR／AI）。', '✅ Photo added; it appears on the same result link when shared (no OCR/AI).'));
            return;
          }
          setPendingRedactionImages([]);
          setRedactionMasks([]);
          setRedactionIndex(0);
          setShowRedaction(false);
          setRedactionDrag(null);
          redactionDragRef.current = null;
          handleFileUpload({ target: { files: redactedFiles, value: '' } }, true);
        } catch (error) {
          if (generation === billGenerationRef.current) toast(`⚠️ ${error?.message || '無法製作遮蓋版，請再試一次。'}`, 'error');
        } finally {
          if (generation === billGenerationRef.current) setIsPreparingRedacted(false);
        }
      };

      const handleReceiptImageAttachmentUpload = async event => {
        if (tutorialDemo) return;
        const input = event?.target;
        const files = Array.from(input?.files || []);
        if (!files.length) return;
        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        if (files.length + lastImageData.length > 5) {
          toast(bi('收據圖片最多 5 張，請減少選取張數。', 'Attach up to 5 receipt photos; select fewer images.'), 'error');
          if (input) input.value = '';
          return;
        }
        if (files.some(file => !allowedTypes.includes(file.type))) {
          toast(bi('只支援 JPG、PNG 或 WebP 圖片格式。', 'Only JPG, PNG, or WebP images are supported.'), 'error');
          if (input) input.value = '';
          return;
        }
        const existingBytes = lastImageData.reduce((sum, image) => sum + Math.ceil(String(image?.data || '').length * 3 / 4), 0);
        const selectedBytes = files.reduce((sum, file) => sum + file.size, 0);
        if (existingBytes + selectedBytes > 12 * 1024 * 1024) {
          toast(bi('收據圖片總容量不可超過 12 MB，請減少圖片或先壓縮。', 'Receipt photos must total 12 MB or less; select fewer or compress them first.'), 'error');
          if (input) input.value = '';
          return;
        }
        const generation = billGenerationRef.current;
        try {
          const originals = await Promise.all(files.map(file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve({ mimeType: file.type, data: String(reader.result || '').split(',')[1] || '' });
            reader.onerror = () => reject(new Error(`未能讀取圖片：${file.name}`));
            reader.readAsDataURL(file);
          })));
          if (generation !== billGenerationRef.current) return;
          setUploadError('');
          setReceiptAttachmentOnly(true);
          setRedactionDrawingMode(false);
          setPendingRedactionImages(originals);
          setRedactionMasks(originals.map(() => []));
          setRedactionIndex(0);
          setRedactionDrag(null);
          redactionDragRef.current = null;
          setShowRedaction(true);
        } catch (error) {
          if (generation === billGenerationRef.current) toast(`⚠️ ${error?.message || bi('圖片讀取失敗。', 'Could not read the image.')}`, 'error');
        } finally {
          if (input) input.value = '';
        }
      };

      const handleFileUpload = async (event, alreadyRedacted = false, keepPreviousResultsOnFailure = false, receiptText = '') => {
        if (tutorialDemo) return;
        const generation = billGenerationRef.current;
        const inputTarget = event?.target;
        const files = Array.from(inputTarget?.files || []);
        const textContent = String(receiptText || '').trim();
        const isTextInput = Boolean(textContent);
        const clearFileSelection = () => {
          if (fileInputRef.current) fileInputRef.current.value = '';
          if (receiptTextFileInputRef.current) receiptTextFileInputRef.current.value = '';
          if (receiptAttachmentInputRef.current) receiptAttachmentInputRef.current.value = '';
          if (inputTarget) inputTarget.value = '';
        };
        if (files.length === 0 && !isTextInput) return;
        const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
        const totalSize = files.reduce((sum, file) => sum + file.size, 0);

        if (!isTextInput && files.length > 5) { setUploadError({ main: '一次最多可上載 5 張圖片', sub: '', action: null }); clearFileSelection(); return; }
        if (!isTextInput && files.some(file => !allowedTypes.includes(file.type))) { setUploadError({ main: '只支援 JPG、PNG 或 WebP 圖片格式', sub: '', action: null }); clearFileSelection(); return; }
        if (!isTextInput && totalSize > 12 * 1024 * 1024) { setUploadError({ main: '圖片總容量不可超過 12 MB', sub: '請壓縮後再試', action: null }); clearFileSelection(); return; }
        if (isTextInput && textContent.length > 200000) { setUploadError({ main: bi('文字太長；請分開處理，或上載不超過 1 MB 的文字檔。', 'Text is too long; split it or upload a text file no larger than 1 MB.'), sub: '', action: null }); clearFileSelection(); return; }

        if (!isTextInput && !alreadyRedacted) {
          setUploadError('');
          setReceiptAttachmentOnly(false);
          setLastImageData([]);
          setIsSaved(false);
          try {
            const originals = await Promise.all(files.map(file => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve({ mimeType: file.type, data: reader.result.split(',')[1] });
              reader.onerror = () => reject(new Error('未能讀取所選圖片'));
              reader.readAsDataURL(file);
            })));
            if (generation !== billGenerationRef.current) return;
            setRedactionDrawingMode(false);
            setPendingRedactionImages(originals);
            setRedactionMasks(originals.map(() => []));
            setRedactionIndex(0);
            setRedactionDrag(null);
            redactionDragRef.current = null;
            setShowRedaction(true);
          } catch (error) {
            if (generation !== billGenerationRef.current) return;
            setUploadError({ main: '圖片讀取失敗', sub: error?.message || '請再選一次圖片。', action: null });
          } finally {
            if (generation === billGenerationRef.current) clearFileSelection();
          }
          return;
        }

        setIsAnalyzing(true);
        setUploadError('');
        setProgress(0);
        setProgressText(isTextInput ? bi('正在整理文字…', 'Structuring receipt text…') : '正在讀取圖片...');

        const controller = new AbortController();
        ocrAbortRef.current?.abort(); ocrAbortRef.current = controller;
        clearInterval(ocrProgressRef.current);
        ocrProgressRef.current = null;

        try {
          let imageDataArray = [];
          let directJsonPayload = null;
          let directJsonImport = false;
          if (isTextInput) {
            setLastImageData([]);
            setIsSaved(false);
            const looksLikeJson = /^\s*(?:```(?:json)?\s*)?[\[{]/i.test(textContent);
            try {
              const candidate = extractPayload(textContent);
              const validItems = Array.isArray(candidate?.items)
                && candidate.items.length > 0
                && candidate.items.length <= 100
                && candidate.items.every(item => item && typeof item === 'object' && !Array.isArray(item)
                  && String(item.name || item.nameEn || item.original || item.item || '').trim()
                  && (item.price !== undefined || item.total !== undefined || item.amount !== undefined || item.amountUncertain === true));
              if (validItems) { directJsonPayload = candidate; directJsonImport = true; }
              else if (looksLikeJson) throw new Error(bi('JSON 格式或項目資料無效，請檢查 items、金額及數量。', 'The JSON structure or item data is invalid. Check items, amounts and quantities.'));
            } catch (parseError) {
              if (parseError?.code || looksLikeJson) throw parseError;
            }
            if (!directJsonImport && !apiKey.trim()) {
              throw new Error(bi('未設定免費 OpenRouter 鎖匙。一般文字需要免費模型整理；想免鎖匙匯入，請複製下方讀圖提示詞，讓另一個 AI 輸出 JSON，再貼上或上載。', 'No free OpenRouter key is set. Free-form text needs a model; for no-key import, copy the image-reading prompt below and paste or upload the JSON it returns.'));
            }
          } else {
            if (!apiKey.trim()) throw new Error('讀單據先要你自己的免費 OpenRouter 鎖匙。');
            const base64Promises = files.map(file => {
              return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve({ mimeType: file.type, data: reader.result.split(',')[1] });
                reader.onerror = () => reject(new Error(`未能讀取圖片：${file.name}`));
                reader.readAsDataURL(file);
              });
            });
            imageDataArray = await Promise.all(base64Promises);
            if (generation !== billGenerationRef.current) return;
            // Keep the last successfully read batch so a transient AI/OCR
            // failure can be retried without selecting the files again.
            setLastImageData(imageDataArray);
          }

          const useFreeTier = modelUsesFreeTier(apiModel, allowPaidModels);
          const modelForRequest = resolveBillModel(apiModel, allowPaidModels);
          const usePaddleLocal = !isTextInput && ocrEngine === 'paddlejs';
          if (directJsonImport) setProgressText(bi('已識別 JSON 格式，正在本機匯入…', 'JSON detected; importing locally…'));
          else if (!isTextInput) setProgressText(usePaddleLocal
            ? bi('準備本機 OCR…', 'Preparing local OCR…')
            : (useFreeTier ? '正在壓縮圖片，方便免費模型處理...' : '正在壓縮圖片...'));
          const aiImages = [];
          let localOcrText = '';
          if (usePaddleLocal) {
            if (!window.PaddleReceiptOcr?.recognizeImages) throw new Error('本機 OCR 模組未能載入，請重新整理後再試，或改選 Dots3-Note。');
            localOcrText = await window.PaddleReceiptOcr.recognizeImages(imageDataArray, phase => {
              if (phase === 'loading-sdk') setProgressText(bi('首次載入本機 OCR 模組…', 'Loading the local OCR module…'));
              else if (phase === 'loading-model') setProgressText(bi('正在載入本機 OCR 模型（首次可能需約一分鐘）…', 'Loading the local OCR model (about a minute the first time)…'));
              else if (phase === 'recognizing') setProgressText(bi('正在本機辨識收據…', 'Recognizing the receipt locally…'));
            });
            if (!String(localOcrText || '').trim()) throw new Error('PaddleOCR.js 沒有讀到文字；可改選 Dots3-Note 重試。');
            setProgressText(bi('本機辨識完成，正在交由 Dots3-Note 翻譯及整理…', 'Local OCR complete; sending recognized text to Dots3-Note for translation and structuring…'));
          } else {
            for (const image of imageDataArray) {
              try {
                aiImages.push(await compressImageDataForAi(
                  image,
                  useFreeTier ? FREE_AI_MAX_EDGE : PAID_AI_MAX_EDGE,
                  useFreeTier ? FREE_AI_JPEG_QUALITY : PAID_AI_JPEG_QUALITY
                ));
              } catch (compressionError) {
                aiImages.push(image);
              }
            }
          }
          if (generation !== billGenerationRef.current) return;
          if (!usePaddleLocal && !directJsonImport) setProgressText(Ocr.waitingText(modelForRequest));

          const promptText = `你幫香港人整理旅行單據；輸入可能是單據圖片，或另一個 AI 已翻譯的單據文字。合併所有輸入成一份清單。只輸出一個 JSON，無 Markdown、無解釋。

name 必須係香港繁體中文，俾唔識日文／韓文嘅人直接睇。這是硬性規則，唔可以違反：
- 日文、韓文或其他非中文單據：name 一定要譯成繁體中文。name 禁止含平假名、片假名、韓文，亦禁止同 original 相同。
- 就算冇標準譯名，都要寫香港人會用嘅繁體叫法。唔好留空，唔好把原文抄入 name。例如 ラーメン 必須寫成拉麵，비빔밥 必須寫成拌飯。
- original：逐字保留單據原文，日文就全日文，韓文就全韓文。
- nameEn：只有你肯定嘅英文先填，否則 ""。唔好把中文、日文或韓文放喺 nameEn。
- ja：只有另一個日文寫法，而且同 original 唔同時先填，否則 ""。

正確：{"name":"拉麵","nameEn":"","original":"ラーメン","ja":""}
錯誤：{"name":"ラーメン","original":"ラーメン"}（name 仍然係日文，唔算翻譯）

每項欄位：name, nameEn, original, ja, price, qty, totalQty（無則 null）, unit（無則 ""，用繁體，如件／杯／碗）, total（照單據列出的該項行金額）, amountText（必填，逐字保留該項印出的金額原文，包括貨幣符號、字母和標點；無法辨讀時填空字串並設 amountUncertain:true）。若原文可能把 $ 誤讀成字母 S（例如 S12.50），amountUncertain 必須設 true。稅、服務費、折扣獨立行不可當成品項，亦不可把獨立調整重複加進 total。
跨國收據請辨識不同語言／位置的稅費與優惠行，包括 VAT、GST、消費税、各種稅率、服務費、折扣、優惠券、割引等；百分比可寫成 10%、10％、10 percent 或本地格式。只抄單據明確印出的百分比，絕不可由固定金額猜百分比。
每個稅／服務費／折扣行各輸出一次到 adjustments；kind 只用 tax 或 discount；ratePercent 用數字百分比（10 代表 10%），amount 只填單據印出的金額（正數），未印金額就 null；baseAmount 只填單據明確印出的計算基數，否則 null。若同時印百分比和金額，兩者都填，程式會以印出的金額為準。
label 只寫收據上與該項稅／服務費／折扣直接相關的那一行，保持簡短；不要寫商場或店名、付款方式、交通卡餘額、地址、找續或其他無關 OCR 內容，也不要把整段收據塞進 label。taxNote 是舊格式欄位，留空即可，絕不可放整段收據文字。
application 必須是 separate（確認在品項金額之外另加／另減）、included（已反映於品項行金額或應付總額，例如含稅價／折後價）或 unknown（無法判斷；不可猜）。scope 用 receipt 表示整張單，item 表示指定品項；itemIndex 是 items 陣列的 0 起算位置；order 按收據行出現次序。折扣要用正數，由程式扣減；稅費用正數，由程式加上。項目金額若已是折後／含稅最終價，相關 adjustment 要標 included。
頂層：adjustments（即使沒有調整也輸出 []）, taxTotal（只供舊格式兼容，正常請用 adjustments；已內含則 0 或 null）, taxNote, currency（ISO 三位，不明用 HKD）, date（YYYY-MM-DD 或 null，唔好用今天）, receiptTotal（收據最終應付總額或 null）。不要把已反映在項目金額／總額的調整再次輸出為 separate。

額外核對規則（仍只輸出指定 JSON）：
- amountUncertain（選填）：若同一行數字可能代表不同意思（例如數量、單價或商品名稱／規格的一部分），無法確認 price、qty 或 total 時設 true；不要猜 qty，也不要用 price × qty 製造 total。英文同義規則：If the meaning of a number on the same row is ambiguous, set amountUncertain to true; do not guess qty or derive total from price × qty.
- amountText（必填）：逐字保留商品金額原文中的符號、字母和標點；若無法辨讀，填 "" 並設 amountUncertain:true。If the source amount might show a dollar sign misread as the letter S (for example S12.50), set amountUncertain:true and preserve the exact source text. Do not silently delete S, replace it with $, or treat the normalized number as verified.
- items 只可有實際商品。商品名換行或單價／數量排在下一行時，合併成同一 item；但每個新的商品名稱若有自己的右欄金額，就是另一項，必須分開，不能與上一項合併。
- 單價×數量括號行併回該商品：price 填單價、qty 填數量、total 填行總額；括號／續行不可另開 item。
- 若收據印有「小計 22點」等件數，最後核對商品 qty 合計等於該件數；不要把 22 點當成 22 個不同商品，也不要為湊件數捏造、刪除或合併有獨立價格的商品。
- 小計、合計、內稅對象額、內稅額、收款額及找零均不是商品，絕不可放入 items；小計／合計／收款／找零也不可放入 adjustments。標明「內稅」的稅額已包含，application 必須是 included。
- 常見日文商品詞：巾着＝束口袋／小袋，ペンケース＝筆袋，コインケース＝零錢包，ポーチ＝收納袋，シール＝貼紙。name 不可把袋翻成毛巾、鞋套或印章；保留角色／圖案名，不清楚的專名按原文音譯或保留，不要猜。
格式：{"items":[{"name":"拉麵","nameEn":"","original":"ラーメン","ja":"","price":100,"qty":1,"totalQty":null,"unit":"碗","total":100,"amountText":"100"}],"adjustments":[{"label":"消費税","kind":"tax","ratePercent":8,"amount":null,"baseAmount":null,"application":"separate","scope":"receipt","itemIndex":null,"order":0}],"taxTotal":null,"taxNote":"","currency":"JPY","date":"2026-03-14","receiptTotal":108}
${isTextInput ? '以下是一份已翻譯的收據文字（沒有圖片附件）。' : `這裡有 ${files.length} 張單據。`}`;

          let parsedItems = [];
          let parsedTax = null;
          let parsedDiscount = 0;
          let parsedCurrency = 'HKD';

          const textForRequest = isTextInput
            ? `${promptText}\n\n以下是用戶提供的收據文字。請只根據文字內容整理，不要假設另有圖片：\n\n${textContent}`
            : usePaddleLocal
              ? `${promptText}\n\n以下是本機 PaddleOCR.js 按單據閱讀順序辨識的文字。請只根據這些文字整理；不確定的欄位不要猜，保留原文及 null／空值規則：\n\n${localOcrText}`
              : promptText;
          const contentArray = [{ type: "text", text: textForRequest }];
          if (!usePaddleLocal && !isTextInput) aiImages.forEach(img => { contentArray.push({ type: "image_url", image_url: { url: `data:${img.mimeType};base64,${img.data}` } }); });
          const markTransient = (error, message) => {
            const transient = new Error(message || error?.message || '網絡中斷，請再試。');
            transient.transient = true;
            if (error?.detail) transient.detail = error.detail;
            return transient;
          };
          const readReceiptModel = async (modelId) => {
            const attempt = new AbortController();
            const timer = setTimeout(() => attempt.abort(), OCR_ATTEMPT_MS);
            const abortAttempt = () => attempt.abort();
            controller.signal.addEventListener('abort', abortAttempt);
            try {
              const requestBody = Ocr.buildRequestBody(modelId, [{ role: "user", content: contentArray }]);
              const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                signal: attempt.signal,
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey.trim()}` },
                body: JSON.stringify(requestBody)
              });
              if (!response.ok) {
                let detail = '';
                try {
                  const errBody = await response.json();
                  detail = errBody?.error?.message || errBody?.message || '';
                } catch (parseError) {}
                const failure = new Error(describeOpenRouterFailure(response.status, detail));
                failure.status = response.status;
                failure.detail = String(detail || '').replace(/\s+/g, ' ').trim().slice(0, 180);
                throw failure;
              }
              const data = await response.json();
              const jsonText = Ocr.messageText(data.choices?.[0]?.message || {});
              if (!jsonText) throw markTransient(null, 'OpenRouter 伺服器未回傳內容。');
              let shaped;
              try {
                shaped = extractPayload(jsonText);
              } catch (parseError) {
                const message = String(parseError?.message || '').includes('不是有效 JSON')
                  ? parseError.message
                  : 'AI 回傳的內容不是有效 JSON，請重試或改用其他模型。';
                throw markTransient(parseError, message);
              }
              if (!Array.isArray(shaped.items) || shaped.items.length === 0) throw markTransient(null, 'AI 回傳格式不符。');
              return shaped;
            } catch (error) {
              if (controller.signal.aborted) {
                const aborted = new Error('Aborted');
                aborted.name = 'AbortError';
                throw aborted;
              }
              if (error?.name === 'AbortError') {
                const timeout = markTransient(null, '免費模型等候逾時。可以再試，或改用手動輸入。');
                timeout.timedOut = true;
                timeout.transient = false;
                throw timeout;
              }
              const status = Number(error?.status) || 0;
              if (status || error?.transient === true) throw error;
              throw markTransient(error, error?.message);
            } finally {
              clearTimeout(timer);
              controller.signal.removeEventListener('abort', abortAttempt);
            }
          };

          const readModelAttempts = async (modelId, { maxAttempts, firstStatus }) => {
            let lastError;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              if (generation !== billGenerationRef.current) return null;
              if (attempt === 1) {
                setProgressText(firstStatus);
              } else {
                setProgressText(`讀單失敗，再試一次…（${attempt}/${maxAttempts}）`);
                const backoff = OCR_RETRY_BACKOFF_MS[Math.min(attempt - 2, OCR_RETRY_BACKOFF_MS.length - 1)];
                await waitForOcrBackoff(backoff, controller.signal);
                if (generation !== billGenerationRef.current) return null;
              }
              try {
                return await readReceiptModel(modelId);
              } catch (error) {
                lastError = error;
                if (attempt >= maxAttempts || !isTransientOcrFailure(error)) throw error;
              }
            }
            throw lastError;
          };

          let shaped = directJsonPayload;
          let recognizedModelId = directJsonImport ? 'local-json-import' : modelForRequest;
          if (!shaped && Ocr.isFreeModel(modelForRequest)) {
            const order = Ocr.cascadeOrder(modelForRequest);
            const failures = [];
            for (let index = 0; index < order.length; index += 1) {
              const modelId = order[index];
              if (generation !== billGenerationRef.current) return;
              try {
                shaped = await readModelAttempts(modelId, {
                  maxAttempts: FREE_OCR_MAX_ATTEMPTS,
                  firstStatus: index === 0 ? Ocr.waitingText(modelId) : Ocr.switchText(modelId)
                });
                if (generation !== billGenerationRef.current) return;
                if (shaped) { recognizedModelId = modelId; break; }
              } catch (error) {
                if (error?.name === 'AbortError' || Number(error?.status) === 401) throw error;
                failures.push({ modelId, error });
                if (!Ocr.shouldCascade(error) || index === order.length - 1) {
                  const combined = new Error(Ocr.exhaustedMessage(failures));
                  combined.detail = Ocr.exhaustedDetail(failures);
                  throw combined;
                }
              }
            }
            if (!shaped) {
              const combined = new Error(Ocr.exhaustedMessage(failures));
              combined.detail = Ocr.exhaustedDetail(failures);
              throw combined;
            }
          } else if (!shaped) {
            setProgressText(Ocr.waitingText(modelForRequest));
            shaped = await readReceiptModel(modelForRequest);
          }
          if (generation !== billGenerationRef.current || !shaped) return;
          setProgressText(directJsonImport ? bi('正在整理匯入資料…', 'Structuring imported data…') : '正在整理識別結果...');
          parsedItems = shaped.items; parsedTax = shaped.taxTotal; parsedCurrency = shaped.currency?.toUpperCase() || 'HKD';
          let candidateNextClaimId = nextClaimItemIdRef.current;
          const preserveIdsForRetry = keepPreviousResultsOnFailure && receiptWasRead && itemsRef.current.length > 0;
          const retryIdByParsedIndex = new Map();
          let ambiguousRetryNames = false;
          const claimItemNameKey = value => String(value || '').normalize('NFKC').trim().replace(/\s+/g, ' ').toLowerCase();
          if (preserveIdsForRetry) {
            const oldByName = new Map();
            const newByName = new Map();
            const addToGroup = (map, key, value) => {
              if (!key) return;
              if (!map.has(key)) map.set(key, []);
              map.get(key).push(value);
            };
            itemsRef.current.forEach(existing => addToGroup(oldByName, claimItemNameKey(normalizeReceiptItemNames(existing).name), existing));
            parsedItems.forEach((incoming, index) => addToGroup(newByName, claimItemNameKey(normalizeReceiptItemNames(incoming).name), { item: incoming, index }));
            const comparable = (value, currency) => value === null || value === undefined || value === ''
              ? null : ReceiptMath.parseMoney(value, currency);
            const signature = item => JSON.stringify([
              String(item?.unit || '').normalize('NFKC').trim().replace(/\s+/g, ' ').toLowerCase(),
              comparable(item?.qty, parsedCurrency), comparable(item?.totalQty, parsedCurrency),
              comparable(item?.price, parsedCurrency), comparable(item?.total ?? item?.amount, parsedCurrency)
            ]);
            for (const [key, oldItems] of oldByName) {
              const newItems = newByName.get(key) || [];
              if (!newItems.length) continue;
              if (oldItems.length === 1 && newItems.length === 1) {
                retryIdByParsedIndex.set(newItems[0].index, String(oldItems[0].id));
                continue;
              }
              const oldBySignature = new Map();
              const newBySignature = new Map();
              oldItems.forEach(item => {
                const sig = signature(item);
                if (!oldBySignature.has(sig)) oldBySignature.set(sig, []);
                oldBySignature.get(sig).push(item);
              });
              newItems.forEach(entry => {
                const sig = signature(entry.item);
                if (!newBySignature.has(sig)) newBySignature.set(sig, []);
                newBySignature.get(sig).push(entry);
              });
              const exactUniqueMatch = oldItems.length === newItems.length
                && [...newBySignature].every(([sig, entries]) => entries.length === 1 && oldBySignature.get(sig)?.length === 1);
              if (exactUniqueMatch) {
                for (const [sig, entries] of newBySignature) retryIdByParsedIndex.set(entries[0].index, String(oldBySignature.get(sig)[0].id));
              } else ambiguousRetryNames = true;
            }
          }
          const reservedClaimIds = new Set(itemsRef.current.map(item => String(item.id)));
          const allocateImportedClaimId = () => {
            while (candidateNextClaimId <= 99 && reservedClaimIds.has(formatClaimItemId(candidateNextClaimId))) candidateNextClaimId += 1;
            if (candidateNextClaimId > 99) {
              const error = new Error(bi('項目編號已用盡，請開新帳單。', 'All 99 item numbers have been used. Start a new bill.'));
              error.code = 'item_id_limit';
              throw error;
            }
            const id = formatClaimItemId(candidateNextClaimId++);
            reservedClaimIds.add(id);
            return id;
          };
          const formattedItems = parsedItems.map((item, itemIndex) => {
            const itemProblem = validateBillItem(item, parsedCurrency);
            if (itemProblem) {
              const error = new Error('Imported item data is invalid.');
              error.code = 'invalid_item_data';
              error.itemIndex = itemIndex;
              error.itemName = String(item?.name || item?.nameEn || '').trim();
              error.field = itemProblem.field;
              error.reason = itemProblem.reason;
              throw error;
            }
            const names = normalizeReceiptItemNames(item);
            const preservedId = retryIdByParsedIndex.get(itemIndex);
            const parsedPrice = item.price === null || item.price === undefined || item.price === '' ? 0 : ReceiptMath.parseMoney(item.price, parsedCurrency);
            const rawTotal = item.total ?? item.amount;
            const parsedTotal = rawTotal === null || rawTotal === undefined || rawTotal === '' ? null : ReceiptMath.parseMoney(rawTotal, parsedCurrency);
            const parsedQty = item.qty === null || item.qty === undefined || item.qty === '' ? 1 : ReceiptMath.parseMoney(item.qty, parsedCurrency);
            const ambiguousCurrencyGlyph = [item.amountText, item.rawAmountText, item.price, item.total, item.amount]
              .some(value => typeof value === 'string' && ReceiptMath.hasAmbiguousDollarSAmount(value));
            const amountReviewRequired = item.amountUncertain === true || ambiguousCurrencyGlyph || (parsedQty > 1 && parsedPrice > 0
              && (parsedTotal === null || !ReceiptMath.moneyEquals(parsedTotal, parsedPrice * parsedQty, parsedCurrency)));
            return {
              id: preservedId || allocateImportedClaimId(), name: names.name || '項目', nameEn: names.nameEn, original: names.original, ja: names.ja,
              price: parsedPrice, qty: parsedQty, totalQty: item.totalQty === null || item.totalQty === undefined || item.totalQty === '' ? null : ReceiptMath.parseMoney(item.totalQty, parsedCurrency), unit: String(item.unit || '').trim(), total: parsedTotal === null ? parsedPrice * parsedQty : parsedTotal,
              amountUncertain: item.amountUncertain === true || ambiguousCurrencyGlyph, amountCurrencyGlyphUncertain: ambiguousCurrencyGlyph, amountReviewRequired, needsAmountReview: amountReviewRequired,
              amountPreviewAvailable: parsedTotal !== null || parsedPrice > 0,
              amountReviewReason: amountReviewRequired ? (ambiguousCurrencyGlyph ? 'currency-symbol' : item.amountUncertain === true ? 'ai-uncertain' : parsedTotal === null ? 'missing-total' : 'mismatch') : ''
            };
          });
          const resolvedAdjustments = ReceiptMath.resolveReceiptAdjustments({
            items: formattedItems, adjustments: shaped.adjustments, taxTotal: shaped.taxTotal,
            discountTotal: shaped.discountTotal, receiptTotal: shaped.receiptTotal, currency: parsedCurrency
          });
          parsedTax = resolvedAdjustments.taxAmount;
          parsedDiscount = resolvedAdjustments.billDiscountAmount;
          const finalizedItems = formattedItems.map((item, idx) => {
            const itemDiscount = resolvedAdjustments.itemDiscounts[idx] || 0;
            if (!itemDiscount) return item;
            const netTotal = Math.max(0, item.total - itemDiscount);
            const itemQty = toNum(item.qty) || 1;
            return { ...item, price: netTotal / itemQty, total: netTotal, receiptDiscountAmount: itemDiscount };
          });
          const parsedAdjustmentDetails = {
            rows: ReceiptMath.summarizeAppliedReceiptRows(resolvedAdjustments, formattedItems),
            currency: parsedCurrency,
            doubleApplicationPrevented: resolvedAdjustments.doubleApplicationPrevented,
            receiptTotalMatches: resolvedAdjustments.receiptTotalMatches,
            receiptTotal: resolvedAdjustments.receiptTotal,
            expectedTotal: resolvedAdjustments.expectedTotal
          };

          setProgress(0);
          setProgressText('處理完成！');

          ocrCompleteRef.current = setTimeout(() => {
            if (generation !== billGenerationRef.current) return;
            setItems(finalizedItems);
            nextClaimItemIdRef.current = Math.min(100, Math.max(nextClaimItemIdRef.current, candidateNextClaimId));
            setNextClaimItemId(nextClaimItemIdRef.current);
            setReadReceipt(true);
            setLastRecognitionModel(isTextInput
              ? (directJsonImport ? 'local-json-import' : `text-input|${recognizedModelId}`)
              : (usePaddleLocal ? `${LOCAL_PADDLE_MODEL_ID}|${recognizedModelId}` : recognizedModelId));
            if (isTextInput) { setReceiptTextDraft(''); setShowReceiptTextImport(readUiDisclosure('receipt-ai-import-r133', false)); }
            openItemEditsRef.current = {};
            setOpenItemEdits({});
            setCurrency(parsedCurrency);
            setDetectedCurrency(parsedCurrency);

            setTaxAmount(parsedTax > 0 ? String(ReceiptMath.roundMoney(parsedTax, parsedCurrency)) : '');
            setDiscountAmount(parsedDiscount > 0 ? String(ReceiptMath.roundMoney(parsedDiscount, parsedCurrency)) : '');
            setTaxNote('');
            setReceiptAdjustmentDetails(parsedAdjustmentDetails);
            setReceiptTotalCheck(resolvedAdjustments.receiptTotal === null ? null : { amount: resolvedAdjustments.receiptTotal, currency: parsedCurrency, legacyMismatch: false });
            setReceiptTotalAcknowledgement(''); setReceiptTotalReview(null);
            const appliedToastParts = [];
            if (parsedTax > 0) appliedToastParts.push(`${bi('稅／服務費', 'tax / fees')} ${formatMoney(parsedTax, parsedCurrency)}`);
            if (resolvedAdjustments.discountAmount > 0) appliedToastParts.push(`${bi('折扣', 'discount')} −${formatMoney(resolvedAdjustments.discountAmount, parsedCurrency)}`);
            if (appliedToastParts.length) toast(`✅ ${bi('已自動換算：', 'Calculated automatically: ')}${appliedToastParts.join(' · ')}`);
            else if (resolvedAdjustments.doubleApplicationPrevented) toast(bi('✅ 已核對收據總額，沒有重複套用稅費／折扣。', '✅ Checked the receipt total; no tax/discount was applied twice.'));
            if (ambiguousRetryNames) toast(bi('有同名項目未能安全配對；舊認帳會標示為無效，請按新編號核對並更新。', 'Some duplicate-name items could not be matched safely. Old claims will be flagged; review the new IDs and update the replies.'), 'error');

            pendingStep2EntryRef.current = true;
            setStep(2);
            setIsAnalyzing(false);
            claimLinkSharedRef.current = false;
            setClaimLinkShared(false);
          }, 600);

        } catch (error) {
          if (generation !== billGenerationRef.current || error?.name === 'AbortError') return;
          setIsAnalyzing(false);
          setProgressText('');
          const importError = error?.code === 'negative_tax_amount'
            ? bi('匯入稅費不可為負數，請核對單據。', 'Imported tax/fee is negative. Check the receipt.')
            : error?.code === 'invalid_discount_amount'
              ? bi('匯入折扣金額無效，請核對單據。', 'Imported discount amount is invalid. Check the receipt.')
              : error?.code === 'invalid_item_data'
                ? bi(`項目「${error.itemName || `#${Number(error.itemIndex) + 1}`}」的${error.field === 'price' || error.field === 'total' ? '金額' : '數量'}無效或為負數；已停止匯入。`, `The ${error.field === 'price' || error.field === 'total' ? 'amount' : 'quantity'} for “${error.itemName || `#${Number(error.itemIndex) + 1}`}” is invalid or negative; import was stopped.`)
            : error?.code?.includes('tax')
              ? bi('匯入稅費格式無效，請核對數字。', 'Imported tax/fee is invalid. Check the amount.')
              : error?.code === 'item_id_limit'
                ? error.message
                : error?.message || '未知錯誤';
          setUploadError({ main: '讀取失敗', sub: importError, detail: error?.detail || '', action: null });
          if (keepPreviousResultsOnFailure && receiptWasRead && items.length) {
            pendingStep2EntryRef.current = true;
            setStep(2);
            toast(bi('重讀失敗，已保留舊結果。', 'Re-recognition failed; the previous successful results are kept.'), 'error');
          }
        } finally {
          if (generation === billGenerationRef.current) clearFileSelection();
        }
      };

      const submitReceiptTextImport = () => {
        const text = String(receiptTextDraft || '').trim();
        if (!text) {
          setUploadError({ main: bi('請先貼上收據文字，或上載文字檔。', 'Paste receipt text or upload a text file first.'), sub: '', action: null });
          return;
        }
        setUploadError('');
        handleFileUpload({ target: { files: [], value: '' } }, true, false, text);
      };

      const handleReceiptTextFileUpload = async event => {
        if (tutorialDemo) return;
        const file = event?.target?.files?.[0];
        if (!file) return;
        const clearTextFileSelection = () => {
          if (receiptTextFileInputRef.current) receiptTextFileInputRef.current.value = '';
          if (event?.target) event.target.value = '';
        };
        if (!/\.(txt|md|csv|json)$/i.test(String(file.name || ''))) {
          setUploadError({ main: bi('只接受 .txt、.md、.csv 或 .json 文字檔。', 'Use a .txt, .md, .csv or .json text file.'), sub: '', action: null });
          clearTextFileSelection();
          return;
        }
        if (file.size > 1024 * 1024) {
          setUploadError({ main: bi('文字檔不可超過 1 MB。', 'Text files must be 1 MB or smaller.'), sub: '', action: null });
          clearTextFileSelection();
          return;
        }
        try {
          const text = await file.text();
