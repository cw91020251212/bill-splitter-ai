  <style>
    html[lang="en"] .app-header-row h1 { font-size: 18px; line-height: 1.3; }
    html[lang="en"] button { overflow-wrap: break-word; }
    html[lang="en"] .step-nav button span:last-child { max-width: 100%; }
    @media (max-width: 379px) {
      html[lang="en"] .guide-label { display: none; }
      html[lang="en"] .guide-button { padding-left: 10px; padding-right: 10px; }
    }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* --- 增強視覺對比：全局輪廓線最幼 (1px) 且加深為深灰色 --- */
    input[type="text"], input[type="number"], input[type="password"], textarea {
      border-width: 1px !important;
      border-color: #64748b !important; /* 深灰色 slate-500 */
      background-color: #ffffff !important;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #67c99a !important; /* 聚焦時變為品牌深綠 */
    }

    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes ocrSlide {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(360%); }
    }
    .ocr-indeterminate { width: 36%; animation: ocrSlide 1.3s ease-in-out infinite; }
    input, textarea, select { font-size: 16px !important; }
    @media (max-width: 639px) {
      input, textarea, select { font-size: 18px !important; }
    }

    @keyframes flashTarget {
      0%, 100% { background-color: transparent; box-shadow: none; }
      25%, 75% { background-color: #fef08a; box-shadow: 0 0 0 2px rgba(253, 224, 71, 0.8); }

    .flash-target { animation: flashTarget 1.5s ease-in-out; border-radius: 8px; }

    /* 自訂卷軸 */

    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <script src="./i18n.js"></script>
  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo } = React;
    const tr = value => window.BillI18n.t(value);
    const tf = (key, values) => window.BillI18n.format(key, values);
    const bi = (zh, en) => window.BillI18n.language === 'en' ? en : zh;
    // Alternative actions, not sequential workflow steps.
    const ChoiceDivider = ({ inline = false }) => (
      <span data-testid="choice-divider" className={`choice-divider${inline ? ' choice-divider-inline' : ''}`}>{tr("或")}</span>
    );
    const LanguageSwitch = ({ value, onChange, compact = false }) => (
      <div className={`flex gap-3 ${compact ? 'w-full items-center justify-between' : 'flex-col items-start sm:flex-row sm:items-center sm:justify-between'}`}>

        <div role="group" aria-label={tr("Language / 語言")} className="language-switch-control inline-flex shrink-0 rounded-lg border border-slate-300 bg-slate-100 p-0.5">
          {[['zh-HK', tr("繁體中文")], ['en', 'English']].map(([code, label]) => (
            <button key={code} type="button" data-ui-language={code} aria-pressed={value === code} onClick={() => onChange(code)} className={`min-h-[40px] rounded-md px-3 py-1.5 text-base font-semibold transition-colors ${value === code ? 'bg-white text-brand-900 shadow-sm' : 'text-slate-700 hover:bg-white/60'}`}>{tr(label)}</button>

    const Icon = ({ path, size=24, className="" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: path}} />
    );
    const icons = {
      language: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-11-5 11"/><path d="M14 18h6"/>',
      upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
      receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17V7"/>',
      fileText: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/>',
      trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
      plus: '<line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/>',
      copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
      share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
      arrowRight: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1.51-1z"/>',
      calculator: '<rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>',
      loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
      check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
      msg: '<path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/>',
      alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
      history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
      key: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
      lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
      fileImage: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><circle cx="10" cy="13" r="2"/><path d="m20 17-1.09-1.09a2 2 0 0 0-2.82 0L10 22"/>',
      book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
      bookOpen: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
      help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/>',
      chevronDown: '<path d="m6 9 6 6 6-6"/>',
      chevronUp: '<path d="m18 15-6-6-6 6"/>',
      arrowLeft: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
      send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
      eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
      x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
    };

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, type = 'button', ...rest }) => {
      const baseStyle = "flex items-center justify-center gap-2 px-5 py-3.5 rounded-xl font-semibold text-base transition-all duration-200 active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed w-full md:w-auto outline-none focus:ring-2 focus:ring-offset-2";
      const variants = {
        primary: "bg-brand-600 text-white hover:bg-brand-700 shadow-md focus:ring-brand-500 border border-brand-700",
        secondary: "bg-white text-slate-800 border border-slate-400 hover:bg-slate-100 shadow-sm focus:ring-slate-400",
        outline: "border border-brand-600 text-brand-700 bg-transparent hover:bg-brand-50 focus:ring-brand-500",
        danger: "bg-red-600 text-white hover:bg-red-700 shadow-md focus:ring-red-500 border border-red-700",
      };
      return <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`} {...rest}>{children}</button>;
    };

    const Card = ({ children, className = '', ...rest }) => (
      <div className={`app-card bg-white rounded-2xl shadow-card border border-slate-400 p-5 md:p-6 ${className}`} {...rest}>{children}</div>
    );

    const Label = ({ children, required, className = '' }) => (
      <label className={`font-bold text-slate-800 block mb-1.5 ${className}`}>
        {children}
        {required && <span className="ml-2 inline-block px-2 py-0.5 rounded bg-red-50 text-red-700 text-xs tracking-wide border border-red-500">{tr("必填")}</span>}
      </label>
    );

    const Accordion = ({ title, icon, children, defaultOpen = false, tone = 'slate' }) => {
      const [open, setOpen] = useState(defaultOpen);
      const tones = {
        slate: 'bg-white border border-slate-500',
        amber: 'bg-amber-50 border border-amber-500',
        emerald: 'bg-emerald-50 border border-brand-500',
        blue: 'bg-blue-50 border border-blue-500',
      };
      return (
        <div className={`rounded-xl border overflow-hidden ${tones[tone]} shadow-sm`}>
          <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between gap-3 p-4 text-left outline-none hover:bg-slate-50 transition-colors">
            <span className="flex items-center gap-2.5 font-bold text-slate-800 text-base">
              {icon && <Icon path={icon} size={20} className="text-slate-600 shrink-0"/>}
              {title}
            </span>
            <Icon path={open ? icons.chevronUp : icons.chevronDown} size={20} className="text-slate-500 shrink-0"/>
          </button>
          {open && <div className="px-4 pb-4 pt-1 text-sm text-slate-700 leading-relaxed space-y-3">{children}</div>}
        </div>
      );
    };

    // Free models are the only ones selectable unless the user opts into paid models.
    // Locked free vision ids that currently have a provider. No free Qwen VL or Baidu OCR endpoint does.
    const DEFAULT_FREE_MODEL = 'google/gemma-4-31b-it:free';
    const BACKUP_FREE_MODEL = 'nvidia/nemotron-3.5-super-vl:free';
    const OCR_ATTEMPT_MS = 45000;
    // Same free model only: 1 try + 2 retries. Not a model cascade.
    const FREE_OCR_MAX_ATTEMPTS = 3;
    const OCR_RETRY_BACKOFF_MS = [1200, 2500];
    const FREE_MODELS = [
      [DEFAULT_FREE_MODEL, 'Gemma 4 31B（免費，預設）', 'Gemma 4 31B (free, default)'],
      [BACKUP_FREE_MODEL, 'Nemotron 3.5 VL（免費，後備）', 'Nemotron 3.5 VL (free, backup)']
    ];
    const PAID_MODELS = [
      ['google/gemini-3.8-flash', 'Gemini 3.8 Flash（較快，可能收費）', 'Gemini 3.8 Flash (faster, may cost money)']
    ];
    const FREE_MODEL_IDS = FREE_MODELS.map(model => model[0]);
    const PAID_MODEL_IDS = PAID_MODELS.map(model => model[0]);
    const resolveBillModel = (model, allowPaid) => {
      if (FREE_MODEL_IDS.includes(model)) return model;
      if (allowPaid === true && PAID_MODEL_IDS.includes(model)) return model;
      return DEFAULT_FREE_MODEL;
    };
    const modelUsesFreeTier = (model, allowPaid) => FREE_MODEL_IDS.includes(resolveBillModel(model, allowPaid));
    const FREE_AI_MAX_EDGE = 1280;
    const FREE_AI_JPEG_QUALITY = 0.6;
    const PAID_AI_MAX_EDGE = 1600;
    const PAID_AI_JPEG_QUALITY = 0.72;

    const providerMissingDetail = (detail) => /no endpoints found|no (?:available |allowed )?providers?|model not found|冇供應商/i.test(String(detail || ''));

    const describeOpenRouterFailure = (status, detail) => {
      const code = Number(status) || 0;
      if (code === 401) return '鎖匙被拒（401）。請檢查有冇漏字或黏埋舊鎖匙。手動分帳同朋友認領都唔使鎖匙。';
      if (code === 404 || providerMissingDetail(detail)) return 'OpenRouter 暫時冇供應商提供所選模型，所以睇唔到單據。請改用另一個免費模型，或稍後再試。唔使充值。';
      if (code === 402) return '此模型需要付費額度（402）。請改回免費模型；免費使用唔使充值。';
      if (code === 403) return 'OpenRouter 拒絕這次請求（403）。如果揀了進階模型，可能係未有付費額度；免費模型唔使充值。';
      if (code === 429) return '請求太密或免費額度暫時用盡（429）。請稍後再試，或改用手動輸入。免費模型唔使充值。';
      if (code === 400 || code === 413 || code === 415) return `圖片或請求未被接受（${code}）。可以再試，或改用手動輸入。`;
      if (code >= 500) return `OpenRouter 暫時未能處理（${code}）。請稍後再試，或改用手動輸入。`;
      return `識別未完成（HTTP ${code}）。可以再試，或改用手動輸入。`;
    };

    // Retry the same free model on blips. 401 and other client/billing errors fail fast.
    const isTransientOcrFailure = (error) => {
      if (!error || error.name === 'AbortError') return false;
      const status = Number(error.status) || 0;
      if (status === 401) return false;
      if (status === 408 || status === 429 || (status >= 500 && status <= 599)) return true;
      if (status) return false;
      return error.transient === true;
    };

    const waitForOcrBackoff = (ms, signal) => new Promise((resolve, reject) => {
      if (signal?.aborted) {
        const aborted = new Error('Aborted');
        aborted.name = 'AbortError';
        reject(aborted);
        return;
      }
      const timer = setTimeout(() => {
        signal?.removeEventListener('abort', onAbort);
        resolve();
      }, ms);
      const onAbort = () => {
        clearTimeout(timer);
        const aborted = new Error('Aborted');
        aborted.name = 'AbortError';
        reject(aborted);
      };
      signal?.addEventListener('abort', onAbort, { once: true });
    });

    const toNum = (v) => {
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      if (v === null || v === undefined) return 0;
      const m = String(v).replace(/[^\d.\-]/g, '');
      const n = parseFloat(m);
      return isNaN(n) ? 0 : n;
    };

    const extractPayload = (rawText) => {
      let txt = String(rawText).replace(/```json/gi, '').replace(/```/g, '').trim();
      let data = null;
      try { data = JSON.parse(txt); } catch (e) {
        const objMatch = txt.match(/\{[\s\S]*\}/);
        const arrMatch = txt.match(/\[[\s\S]*\]/);
        const candidate = (objMatch && arrMatch) ? (objMatch.index <= arrMatch.index ? objMatch[0] : arrMatch[0]) : (objMatch ? objMatch[0] : (arrMatch ? arrMatch[0] : null));
        if (!candidate) throw new Error('AI 回傳的內容不是有效 JSON，請重試或改用其他模型。');
        data = JSON.parse(candidate);
      }
      if (Array.isArray(data)) return { items: data, taxTotal: null, taxNote: '', currency: 'HKD', date: null, receiptTotal: null };
      const items = Array.isArray(data.items) ? data.items : (Array.isArray(data.data) ? data.data : []);
      let taxTotal = null;
      if (data.taxTotal !== undefined && data.taxTotal !== null && data.taxTotal !== '') taxTotal = toNum(data.taxTotal);
      else if (data.tax !== undefined && data.tax !== null && data.tax !== '') taxTotal = toNum(data.tax);
      const rawDate = data.date || data.receiptDate || data.Date || null;
      const date = (typeof rawDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(rawDate.trim())) ? rawDate.trim() : null;
      const rawTotal = (data.receiptTotal !== undefined && data.receiptTotal !== null && data.receiptTotal !== '') ? data.receiptTotal : null;
      const receiptTotal = rawTotal === null ? null : toNum(rawTotal);
      return { items, taxTotal, taxNote: data.taxNote || data.tax_note || '', currency: data.currency || data.Currency || 'HKD', date, receiptTotal };
    };

    // Free vision models often copy the receipt into name. Keep name in Hong Kong
    // Traditional Chinese and leave kana/hangul in original (and ja only when different).
    const RECEIPT_NAME_PENDING = '（未譯，見原文）';
    const RECEIPT_NAME_PENDING_EN = 'See original';
    const RECEIPT_EXTRA_CHINESE_KEYS = ['nameZh', 'name_zh', 'zh', 'zhHK', 'chinese', 'nameTc', 'nameTC', 'translation', 'translated', 'translatedName'];
    const RECEIPT_GENERIC_NAMES = new Set(['項目', '商品', '品項', '品目', '食物', '食品', '菜式', '菜品', 'item', 'items', 'unknown', 'n/a', 'na']);
    const RECEIPT_TRAD_MAP = {
      '寿': '壽', '焼': '燒', '烧': '燒', '麺': '麵', '面': '麵', '竜': '龍', '龙': '龍', '黒': '黑', '麦': '麥',
      '塩': '鹽', '盐': '鹽', '楽': '樂', '乐': '樂', '気': '氣', '气': '氣', '広': '廣', '广': '廣', '国': '國',

          } else if (/\d/.test(cleanLine) && !cleanLine.includes('➖➖')) {
             issues.push({ type: 'stray_number', line: lineNo, text: cleanLine.substring(0, 40), person: currentPerson });
          }
        } else if (cleanLine.includes('數量') || cleanLine.includes('=')) {
           issues.push({ type: 'no_person', line: lineNo, text: cleanLine.substring(0, 40) });
        }
      });

      const peopleWithNoClaims = people.filter(p => !claims[p] || Object.keys(claims[p]).length === 0);
      return { claims, claimUnits, people, totalClaimLines, issues, duplicatePeople, unknownIds: Array.from(unknownIds), peopleWithNoClaims };
    };

    const KEY_RULES = {
      openrouter: { prefix: 'sk-or-', expectLen: 73, pattern: /^sk-or-v1-[a-f0-9]{64}$/i, label: 'OpenRouter' }
    };

    const sanitizeKey = (raw) => {
      let s = String(raw || '');
      const notes = [];
      s = s.replace(/[\uff01-\uff5e]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0));
      const before = s;
      s = s.replace(/[\u200B-\u200D\uFEFF\u00A0\s]/g, '');
      if (s !== before) notes.push('removed_invisible');
      s = s.replace(/^["'「『]+|["'」』]+$/g, '');
      s = s.replace(/^Bearer/i, '');
      for (const prefix of ['sk-or-v1-', 'sk-or-']) {
        const idx = s.lastIndexOf(prefix);
        if (idx > 0) {
          s = s.slice(idx);
          notes.push('deduped');
          break;
        }
      }
      return { key: s, notes };
    };

    const validateKey = (key, engine) => {
      const r = KEY_RULES[engine];
      const k = String(key || '');
      const checks = {
        notEmpty:   k.length > 0,
        prefixOk:   k.startsWith(r.prefix),
        lengthOk:   k.length === r.expectLen,
        charsOk:    /^[\x21-\x7E]+$/.test(k),
        patternOk:  r.pattern.test(k)
      };
      const tooLong  = k.length > r.expectLen * 1.5;
      const severity = !checks.notEmpty ? 'empty' : tooLong ? 'likely_duplicate' : !checks.prefixOk ? 'bad_prefix' : !checks.lengthOk ? 'bad_length' : !checks.patternOk? 'bad_chars' : 'ok';
      return { checks, severity, expectLen: r.expectLen, actualLen: k.length, label: r.label };
    };

    const maskKey = (k) => {
      const s = String(k || '');
      if (s.length <= 12) return '•'.repeat(s.length);
      return s.slice(0, 13) + '•'.repeat(Math.min(18, s.length - 17)) + s.slice(-4);

    const RECEIPT_DB_NAME = 'billSplitterLocalData';

    const openReceiptDatabase = (timeoutMs = 0) => new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('此瀏覽器不支援本機單據儲存')); return; }
      const request = window.indexedDB.open(RECEIPT_DB_NAME, 1);
      let settled = false;
      let timer;
      const fail = (error) => { if (!settled) { settled = true; clearTimeout(timer); reject(error); } };
      if (timeoutMs) timer = setTimeout(() => fail(new Error('開啟本機儲存逾時')), timeoutMs);
      request.onupgradeneeded = () => {
        if (settled) { request.transaction.abort(); return; }
        if (!request.result.objectStoreNames.contains(RECEIPT_STORE_NAME)) {
          request.result.createObjectStore(RECEIPT_STORE_NAME, { keyPath: 'recordId' });
        }
      };
      request.onsuccess = () => {
        if (settled) { request.result.close(); return; }
        settled = true; clearTimeout(timer); resolve(request.result);
      };
      request.onerror = () => fail(request.error || new Error('無法開啟本機單據儲存'));
      request.onblocked = () => { if (timeoutMs) fail(new Error('本機儲存被其他分頁阻塞')); };
    });
    const receiptExtension = (mimeType) => mimeType === 'image/png' ? 'png' : mimeType === 'image/webp' ? 'webp' : 'jpg';
    const receiptBase64ToBlob = (image) => {
      const binary = atob(image.data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: image.mimeType || 'image/jpeg' });
    };
    const receiptEntriesToFiles = (entries) => entries.map((entry, index) => {
      const mimeType = entry.mimeType || entry.blob?.type || 'image/jpeg';
      const blob = entry.blob || receiptBase64ToBlob(entry);
      return new File([blob], entry.name || `receipt-${index + 1}.${receiptExtension(mimeType)}`, { type: mimeType });
    });
    const saveReceiptImagesLocally = async (recordId, images) => {

      const db = await openReceiptDatabase();
      try {
        await new Promise((resolve, reject) => {
          const transaction = db.transaction(RECEIPT_STORE_NAME, 'readwrite');
          transaction.objectStore(RECEIPT_STORE_NAME).put({ recordId, files });
          transaction.oncomplete = resolve;
          transaction.onerror = () => reject(transaction.error || new Error('無法儲存收據圖片'));
          transaction.onabort = () => reject(transaction.error || new Error('收據圖片儲存已取消'));

    const accessActiveDraftAssets = async (operation, snapshot) => {
      const db = await openReceiptDatabase(5000);
      try {
        return await new Promise((resolve, reject) => {
          const transaction = db.transaction(RECEIPT_STORE_NAME, operation === 'read' ? 'readonly' : 'readwrite');
          const store = transaction.objectStore(RECEIPT_STORE_NAME);
          let result = null;
          if (operation === 'read') {
            const request = store.get(ACTIVE_DRAFT_ASSETS_ID);
            request.onsuccess = () => { result = request.result || null; };
          } else if (operation === 'delete') {
            store.delete(ACTIVE_DRAFT_ASSETS_ID);

              revision: snapshot.revision,

              attachments: snapshot.attachments.map(file => ({ name: file.name, type: file.type, lastModified: file.lastModified, blob: file }))
            });

    const createRedactedReceiptFile = (imageData, masks, index, quality = 0.92) => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => {
        try {
          const maxDimension = 4096;
          const scale = Math.min(1, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('無法處理圖片');
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          context.fillStyle = '#000000';
          (masks || []).forEach(mask => {
            const x = Math.max(0, Math.min(1, mask.x));
            const y = Math.max(0, Math.min(1, mask.y));
            const right = Math.max(x, Math.min(1, mask.x + mask.width));
            const bottom = Math.max(y, Math.min(1, mask.y + mask.height));
            context.fillRect(Math.floor(x * canvas.width), Math.floor(y * canvas.height), Math.ceil((right - x) * canvas.width), Math.ceil((bottom - y) * canvas.height));
          });
          canvas.toBlob(blob => {
            if (!blob) { reject(new Error('無法輸出遮蓋後的圖片')); return; }
            resolve(new File([blob], `redacted-receipt-${String(index + 1).padStart(2, '0')}.jpg`, { type: 'image/jpeg' }));
          }, 'image/jpeg', quality);
        } catch (error) { reject(error); }
      };
      image.onerror = () => reject(new Error('無法載入單據圖片'));
      image.src = `data:${imageData.mimeType};base64,${imageData.data}`;
    });

    const compressImageDataForAi = (imageData, maxEdge, quality) => new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => {
        try {
          const longest = Math.max(image.naturalWidth, image.naturalHeight) || 1;
          const scale = Math.min(1, maxEdge / longest);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          const context = canvas.getContext('2d');
          if (!context) throw new Error('無法處理圖片');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const data = dataUrl.split(',')[1];
          if (!data) throw new Error('無法處理圖片');
          resolve({ mimeType: 'image/jpeg', data });
        } catch (error) { reject(error); }
      };
      image.onerror = () => reject(new Error('無法載入單據圖片'));
      image.src = `data:${imageData.mimeType};base64,${imageData.data}`;
    });

              price: toNum(item.price), qty: toNum(item.qty) || 1, totalQty: item.totalQty === null ? null : (toNum(item.totalQty) || toNum(item.qty) || null), unit: String(item.unit || '').trim(), total: toNum(item.total) || (toNum(item.price) * (toNum(item.qty) || 1)) || 0
            };
          });

          setProgress(0);
          setProgressText('處理完成！');

          ocrCompleteRef.current = setTimeout(() => {

            setCurrency(parsedCurrency);
            setDetectedCurrency(parsedCurrency);

            setIsAnalyzing(false);

          setProgressText('');
          setUploadError({ main: '讀取失敗', sub: error?.message || '未知錯誤', detail: error?.detail || '', action: null });

      const retryLastUpload = () => {

      const addItem = () => setItems([...items, { id: String(items.length + 1).padStart(2, '0'), name: '', original: '', ja: '', price: '', qty: 1, totalQty: null, unit: '', total: 0 }]);

      const encodeClaimLinkPayload = (payload) => {
        const bytes = new TextEncoder().encode(JSON.stringify(payload));
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');

      const buildFriendClaimLink = (lang = uiLang) => {

      const calculateSplit = () => {
        setStepError('');
        if (!payer.trim()) { setStepError("⚠️ 請填寫墊支人姓名！"); focusField('payer'); return; }

        const parsed = parseClaims(friendsReplies, items);
        const personClaims = parsed.claims;
        const claimUnits = parsed.claimUnits || {};

        if (parsed.people.length === 0) { setStepError("⚠️ 未能解析！請確保已正確貼上朋友回覆並填寫數量。"); focusField('replies'); return; }

        const itemClaimTotals = {};
        items.forEach(item => { itemClaimTotals[item.id] = 0; Object.keys(personClaims).forEach(person => { itemClaimTotals[item.id] += (personClaims[person][item.id] || 0); }); });

        const reconciliationIssues = items.map(item => {
          const totalQty = toNum(item.totalQty);
          if (totalQty <= 0) return null;
          const actualPeople = Object.keys(personClaims).filter(person => claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          const sharePeople = Object.keys(personClaims).filter(person => !claimUnits[person]?.[item.id] && (personClaims[person][item.id] || 0) > 0);
          if (!actualPeople.length || sharePeople.length) return null;
          const claimedQty = actualPeople.reduce((sum, person) => sum + personClaims[person][item.id], 0);
          const difference = totalQty - claimedQty;
          if (Math.abs(difference) < 0.0001) return null;
          return { itemId: item.id, name: item.name, unit: item.unit || '單位', totalQty, claimedQty, difference, amount: Math.abs(difference) * (toNum(item.total) / totalQty) };
        }).filter(Boolean);
        const hasOverClaim = reconciliationIssues.some(issue => issue.difference < 0);
        if (hasOverClaim) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError('⚠️ 有項目認領數量超過單據總量，請返回修改後再計算。');
          return;
        }
        if (reconciliationIssues.length && !reconciliation?.policy) {
          setReconciliation({ issues: reconciliationIssues, policy: '' });
          setStepError('⚠️ 有實際單位尚未完成數量核對，請選擇剩餘數量由誰承擔。');
          return;
        }

        const personTotals = {}; let totalItemsCost = 0;
        Object.keys(personClaims).forEach(person => { personTotals[person] = { items: [], adjustments: [], subtotal: 0, tax: 0, total: 0 }; });

        items.forEach(item => {
          const totalClaimed = itemClaimTotals[item.id];
          if (totalClaimed <= 0) return;
          const people = Object.keys(personClaims);
          const totalQty = toNum(item.totalQty);
          const canUseActualUnits = totalQty > 0;
          const actualTotal = people.reduce((sum, person) => sum + (canUseActualUnits && claimUnits[person]?.[item.id] ? (personClaims[person][item.id] || 0) : 0), 0);
          const shareTotal = people.reduce((sum, person) => sum + (!(canUseActualUnits && claimUnits[person]?.[item.id]) ? (personClaims[person][item.id] || 0) : 0), 0);
          const unitValue = toNum(item.total) / totalQty;
          const actualCostTotal = actualTotal > 0 ? actualTotal * unitValue : 0;
          const remainingCost = Math.max(0, toNum(item.total) - actualCostTotal);
          people.forEach(person => {
            const claimedQty = personClaims[person][item.id] || 0;
            if (claimedQty <= 0) return;
            const enteredUnit = claimUnits[person]?.[item.id] || '';
            const isActualUnit = canUseActualUnits && Boolean(enteredUnit);
            const cost = isActualUnit
              ? claimedQty * unitValue
              : (actualTotal > 0 ? (shareTotal > 0 ? claimedQty / shareTotal * remainingCost : 0) : claimedQty / totalClaimed * toNum(item.total));
            personTotals[person].items.push({ name: item.name, nameEn: item.nameEn || '', original: item.original || '', ja: item.ja || '', id: item.id, amount: cost, qty: claimedQty, totalClaimed, unit: enteredUnit, unitName: item.unit || '', isActualUnit });
            personTotals[person].subtotal += cost; totalItemsCost += cost;
          });
        });

        reconciliationIssues.forEach(issue => {
          const policy = reconciliation?.policy;
          const item = items.find(candidate => candidate.id === issue.itemId);
          const amount = issue.amount;
          if (policy === 'payer') {
            if (!personTotals[payer]) personTotals[payer] = { items: [], adjustments: [], subtotal: 0, tax: 0, total: 0 };
            personTotals[payer].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference, unit: issue.unit, amount, reason: '墊支人承擔未認領數量' });
            personTotals[payer].subtotal += amount; totalItemsCost += amount;
          } else if (policy === 'equal') {
            const claimants = Object.keys(personClaims).filter(person => personClaims[person][item.id] > 0);
            claimants.forEach(person => {
              const share = amount / claimants.length;
              personTotals[person].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference / claimants.length, unit: issue.unit, amount: share, reason: '已認領人士平均承擔未認領數量' });
              personTotals[person].subtotal += share; totalItemsCost += share;
            });
          } else if (policy && policy.startsWith('person:')) {
            const person = policy.slice(7);
            if (!personTotals[person]) personTotals[person] = { items: [], adjustments: [], subtotal: 0, tax: 0, total: 0 };
            personTotals[person].adjustments.push({ name: item.name, nameEn: item.nameEn || '', qty: issue.difference, unit: issue.unit, amount, reason: '指定承擔未認領數量' });
            personTotals[person].subtotal += amount; totalItemsCost += amount;
          }
        });
        const reconciliationAllocations = reconciliationIssues.map(issue => ({ ...issue, policy: reconciliation?.policy }));

        const taxNum = parseFloat(taxAmount) || 0; const numPeople = Object.keys(personClaims).length;
        Object.keys(personTotals).forEach(person => {
          let taxShare = 0;
          if (taxSplitMethod === 'equal') taxShare = taxNum / numPeople;
          else if (taxSplitMethod === 'proportional' && totalItemsCost > 0) taxShare = taxNum * (personTotals[person].subtotal / totalItemsCost);
          personTotals[person].tax = taxShare; personTotals[person].total = personTotals[person].subtotal + taxShare;
        });

        setResults({ personTotals, totalItemsCost, reconciliationAllocations, date: new Date().toISOString().split('T')[0], currency });
        updatePendingReceiptShare(false); setReceiptShareNudge(0);
        setIsSaved(false); setIsSavingRecord(false); setIncludeReceiptImages(false); setStep(4);

      const paymentDisplay = (value, language = uiLang) => {

          '現金': 'Cash',
          '銀行轉帳': 'Bank transfer',
          'Alipay': 'Alipay',
          '未指定': 'Not specified'
        };
        if (language !== 'en') return value || '未指定';
        return map[value] || value || 'Not specified';
      };
      const unitDisplay = (value, language = uiLang, quantity = null) => {
        if (language !== 'en') return value || '單位';
        const map = { '件': 'piece(s)', '杯': 'cup(s)', '碟': 'plate(s)', '罐': 'can(s)', '份': 'serving(s)', '個': 'piece(s)', '支': 'piece(s)', '串': 'skewer(s)', '碗': 'bowl(s)', '瓶': 'bottle(s)', '包': 'pack(s)', '條': 'piece(s)', '隻': 'piece(s)', '單位': 'unit(s)' };

      const reportCurrencyName = (currency, language) => {

        const code = String(currency || '').toUpperCase();
        const names = { HKD: 'Hong Kong dollars (HKD)', JPY: 'Japanese yen (JPY)', KRW: 'South Korean won (KRW)', TWD: 'New Taiwan dollars (TWD)', THB: 'Thai baht (THB)', USD: 'US dollars (USD)', EUR: 'euros (EUR)', GBP: 'British pounds (GBP)', MOP: 'Macanese patacas (MOP)', CNY: 'Chinese yuan (CNY)', MOP: 'Macanese patacas (MOP)', AUD: 'Australian dollars (AUD)', CAD: 'Canadian dollars (CAD)', SGD: 'Singapore dollars (SGD)' };
        return names[code] || code;
      };
      const getSavedReportText = (record, reportType) => {

        if (reportType === 'detailed') return record.reportData?.detailed?.[language] || record.detailedText || record.detailedFullText || '';
        return record.reportData?.simplified?.[language] || record.simplifiedText || '';
      };

      const getSimplifiedResult = (language = uiLang) => {
        if (!results) return '';
        const english = language === 'en';
        const others = Object.keys(results.personTotals).filter(p => p !== payer);
        const curr = results.currency;
        const paymentLabel = paymentMethods.length ? paymentMethods.map(method => paymentDisplay(method, language)).join(english ? ', ' : '、') : (english ? 'Not specified' : '未指定');
        if (!english) {
          let txt = `💰 *分帳結果｜各人應付金額與收款資料* 💰\n📅 ${results.date} · 💴 結算貨幣：*${reportCurrencyName(curr, language)}*\n💳 請過數俾：*${payer}*\n💵 付款方式：${paymentLabel}\n────────\n`;
          others.forEach(person => { txt += `👤 *${person}* — 應付 ➡️ *${formatMoney(results.personTotals[person].total, curr)}*\n\n`; });
          if (others.length === 0) txt += `（只有墊支人一位，無需過數）\n`;
          txt += `────────\n`;
          const owed = others.reduce((s, p) => s + results.personTotals[p].total, 0);
          txt += `📊 應收合計：*${formatMoney(owed, curr)}*\n`;
          if (results.personTotals[payer]) txt += `🙋 ${payer} 自己一份：${formatMoney(results.personTotals[payer].total, curr)}\n`;
          txt += `\n🙏 收到請覆「已轉」，多謝合作！`;
          return txt;
        }
        let txt = `💰 *Bill Split | Amounts Due & Payment Details* 💰\n📅 ${results.date} · 💴 Settlement currency: *${reportCurrencyName(curr, language)}*\n💳 Pay to: *${payer}*\n💵 Payment methods: ${paymentLabel}\n────────\n`;
        others.forEach(person => { txt += `👤 *${person}* — Amount due ➡️ *${formatMoney(results.personTotals[person].total, curr)}*\n\n`; });
        if (others.length === 0) txt += `(Only the payer is included; no transfer is needed.)\n`;
        txt += `────────\n`;
        const owed = others.reduce((s, p) => s + results.personTotals[p].total, 0);

      const getDetailedResult = (mode = 'zh', language = uiLang) => {
        if (!results) return '';
        const full = mode === 'full';
        const english = language === 'en';
        const curr = results.currency;
        const paymentLabel = paymentMethods.length ? paymentMethods.map(method => paymentDisplay(method, language)).join(english ? ', ' : '、') : (english ? 'Not specified' : '未指定');
        const oneLineName = value => String(value || '').replace(/\s+/g, ' ').trim();
        const splitLabel = taxSplitMethod === 'equal'
          ? (english ? 'Split equally among everyone' : '全部人平均分')
          : (english ? 'Split in proportion to spending' : '按消費比例分');
        let txt = english
          ? `🧾 *Detailed Bill Split | Claimed Items & Amount Due* 🧾\n📅 ${results.date} · 💴 Settlement currency: ${reportCurrencyName(curr, language)}\n💳 Payer: ${payer}\n💵 Payment methods: ${paymentLabel}\n⚖️ Tax / service charge: ${splitLabel}\n────────\n\n`
          : `🧾 *分帳詳細明細｜各人認領項目與應付金額* 🧾\n📅 ${results.date} · 💴 結算貨幣：${reportCurrencyName(curr, language)}\n💳 墊支人：${payer}\n💵 付款方式：${paymentLabel}\n⚖️ 稅／服務費：${splitLabel}\n────────\n\n`;
        let grandTotal = 0;
        Object.keys(results.personTotals).forEach(person => {
          const p = results.personTotals[person];
          txt += `👤 *${person}*\n`;
          p.items.forEach(i => {
            const itemName = receiptPrimaryLabel(i.name, i.nameEn, i.original, english);
            txt += `*${i.id}* ${oneLineName(itemName)}\n`;
            if (full && i.original && oneLineName(i.original) !== oneLineName(itemName)) txt += english ? `🌐 Original: ${oneLineName(i.original)}\n` : `🌐 原文：${oneLineName(i.original)}\n`;
            if (full && i.ja && oneLineName(i.ja) !== oneLineName(i.original) && oneLineName(i.ja) !== oneLineName(itemName)) txt += english ? `🇯🇵 Japanese: ${oneLineName(i.ja)}\n` : `🇯🇵 日文：${oneLineName(i.ja)}\n`;
            const shownUnit = unitDisplay(i.unit || i.unitName || (english ? 'unit(s)' : '單位'), language, i.qty);
            const share = i.isActualUnit
              ? (english ? `(${i.qty} ${shownUnit}, actual quantity)` : `（${i.qty} ${shownUnit}，按實際單位）`)
              : (english ? `(${i.qty}/${i.totalClaimed} shares)` : `（${i.qty}/${i.totalClaimed} 份比例）`);
            txt += `💲 ${formatMoney(i.amount, curr)} ${share}\n\n`;

            txt += `${oneLineName(adjustmentName)}\n${english ? 'Unclaimed quantity covered by this person' : '未認領數量由此人承擔'}\n`;
            txt += english
              ? `💲 ${formatMoney(a.amount, curr)} (${a.qty} ${unitDisplay(a.unit, language)}, ${reasonMap[a.reason] || a.reason})\n\n`
              : `💲 ${formatMoney(a.amount, curr)}（${a.qty} ${unitDisplay(a.unit, language)}，${a.reason}）\n\n`;
          });
          if (p.tax > 0) txt += english ? `▫️ Tax / service charge share 💲 ${formatMoney(p.tax, curr)}\n` : `▫️ 稅／服務費分攤 💲 ${formatMoney(p.tax, curr)}\n`;
          txt += english
            ? `\n━━━━━━━━━━\n💰 *TOTAL DUE*\n\n*${formatMoney(p.total, curr)}*\n━━━━━━━━━━\n`
            : `\n━━━━━━━━━━\n💰 *應付總額*\n\n*${formatMoney(p.total, curr)}*\n━━━━━━━━━━\n`;
          grandTotal += p.total;
        });
        const itemsSum = items.reduce((sum, item) => sum + toNum(item.total), 0);
        const billTotal = itemsSum + toNum(taxAmount);
        const diff = Math.abs(grandTotal - billTotal);
        txt += english
          ? `\n📊 *Totals check*\nItems subtotal: ${formatMoney(itemsSum, curr)}\nTax / service charge: ${formatMoney(taxAmount, curr)}\nReceipt total: ${formatMoney(billTotal, curr)}\nSum of individual amounts: ${formatMoney(grandTotal, curr)}\nDifference: ${formatMoney(diff, curr)} ${diff < 0.05 ? '✅' : '⚠️ Check claimed quantities'}\n`
          : `\n📊 *總核對*\n項目小計：${formatMoney(itemsSum, curr)}\n稅／服務費：${formatMoney(taxAmount, curr)}\n單據總計：${formatMoney(billTotal, curr)}\n各人合計：${formatMoney(grandTotal, curr)}\n差額：${formatMoney(diff, curr)} ${diff < 0.05 ? '✅' : '⚠️ 請檢查認領數量'}\n`;
        if (full && taxNote) txt += english ? `\n📝 Tax note: ${taxNote}\n` : `\n📝 稅費來源：${taxNote}\n`;
        return txt;
      };
      const paymentOptions = ['轉數快 (FPS)', 'PayMe', '現金', '銀行轉帳', 'Alipay'];
      const displayCurrencies = Array.from(new Set([detectedCurrency, 'HKD', 'JPY', 'TWD', 'THB', 'KRW', 'USD', 'MOP', 'GBP', 'EUR'])).filter(Boolean).slice(0, 9);

      // ── 智能提示欄邏輯 (StatusBar) ──
      const statuses = useMemo(() => {
        const list = [];
        const push = (level, id, main, sub, action) => list.push({ level, id, main, sub, action });

        if (!isOnline && (step === 1 || isAnalyzing)) push(4, 'E4', '而家冇網絡，暫時讀唔到單據', '連線後再影相。而家亦可以手動輸入。', { label: '手動輸入', run: () => { setShowSettings(false); startManualEntry(); } });

        if (step === 3 && !payer.trim()) push(2, 'S1', '未填墊支人姓名', '填咗才可以出結果', { label: '跳去輸入', run: () => focusField('payer') });
        if (step === 2 && items.length > 0) {
            const emptyNameIdx = items.findIndex(i => !i.name.trim());
            if (emptyNameIdx !== -1) push(2, 'S2', `項目 ${items[emptyNameIdx].id} 未填寫名稱`, '請填寫名稱以便認領', { label: '填寫', run: () => focusField(`item-name-${emptyNameIdx}`) });
        }
        if (step > 2 && items.length === 0) push(2, 'S3', '請至少新增一個項目', '', { label: '新增', run: () => { setStep(2); addItemAndFocus(); } });
        if (step === 2 && !friendsReplies.trim() && items.length > 0) push(2, 'S4', '尚未貼上朋友的認領回覆', '收集後貼上才能進行運算', { label: '前往貼上', run: () => focusField('replies') });

        if (step === 2 && claimInfo && claimInfo.issues.length > 0) {
            const firstIssue = claimInfo.issues[0];
            let msg = ''; let subMsg = `在第 ${firstIssue.line} 行`;
            if (firstIssue.type === 'unknown_id') msg = `有人填了項目「${firstIssue.id}」，單上冇此編號`;
            else if (firstIssue.type === 'qty_negative') msg = `數量不可為負數`;
            else if (firstIssue.type === 'no_person') msg = `有數量但未指定姓名`;
            else msg = `回覆內容存在格式疑問`;
            push(3, 'C1', msg, subMsg, { label: '查看', run: () => focusReplyLine(firstIssue.line) });
        }

        if (step === 2 && claimInfo && items.length > 0) {
            let unclaimedCount = 0; let unclaimedCost = 0;
            const itemClaimTotals = {};
            items.forEach(item => {
                itemClaimTotals[item.id] = 0;
                if(claimInfo.claims) Object.keys(claimInfo.claims).forEach(person => { itemClaimTotals[item.id] += (claimInfo.claims[person][item.id] || 0); });
            });
            items.forEach(item => { if (itemClaimTotals[item.id] <= 0) { unclaimedCount++; unclaimedCost += toNum(item.total); } });
            if (unclaimedCount > 0) push(3, 'C2', `${unclaimedCount} 項冇人認領（${formatMoney(unclaimedCost, currency)} 未分攤）`, '請補回認領，或刪走冇人食嘅項目', { label: '前往', run: () => jumpToStep(2) });
        }

        if (isAnalyzing) push(4, 'A1', progressText || '已送到免費模型，等候回覆。', '', null);
        else if (step === 2 && items.length > 0 && friendsReplies.trim() && (!claimInfo || claimInfo.issues.length === 0)) {
            push(5, 'G2', '認領資料準備就緒', '下一步先填墊支人，再計算', { label: '下一步', run: goToPayerStep });
        }
        if (list.length === 0 && step >= 2) push(6, 'I1', '貼上回覆時可以連續貼幾份，系統會自動加分隔線。', '', null);

        return list.sort((a, b) => a.level - b.level);
      }, [isOnline, uploadError, lastImageData, apiKey, step, showSettings, showTutorial, showHistory, payer, items, friendsReplies, claimInfo, isAnalyzing, progressText, currency, uiLang]);

      const StatusBar = ({ statuses, expanded, setExpanded, kbOpen }) => {
          if (!statuses.length) return null;
          const top = statuses[0];

          /* 將所有邊框提升至 500 深色系 */
          const TONE = {
              1: { bg: 'bg-red-50', border: 'border-red-500', text: 'text-red-700', dot: '🔴' },
              2: { bg: 'bg-orange-50', border: 'border-orange-500', text: 'text-orange-700', dot: '🟠' },
              3: { bg: 'bg-amber-50', border: 'border-amber-500', text: 'text-amber-800', dot: '🟡' },
              4: { bg: 'bg-blue-50', border: 'border-blue-500', text: 'text-blue-700', dot: '🔵' },
              5: { bg: 'bg-blue-50', border: 'border-blue-500', text: 'text-blue-700', dot: '🔵' },
              6: { bg: 'bg-slate-50', border: 'border-slate-500', text: 'text-slate-600', dot: '⚪' }

          return (
              <React.Fragment>

                      <div className={`flex items-center gap-2.5 px-3 ${kbOpen ? 'py-1.5' : 'py-2'}`}>
                          <span className="shrink-0 text-sm leading-none">{TONE.dot}</span>
                          <div className="flex-1 min-w-0">
                              <div className={`font-bold text-xs leading-tight line-clamp-1 ${TONE.text}`}>
                                  {tr(top.main)} {statuses.length > 1 && <span className="opacity-70 ml-1">(+{statuses.length - 1})</span>}
                              </div>
                              {!kbOpen && top.sub && (<div className="text-[10px] text-slate-500 font-medium mt-0.5 leading-tight line-clamp-1">{tr(top.sub)}</div>)}
                          </div>
                          {!kbOpen && (
                              <div className="shrink-0 text-[10px] font-bold text-slate-500 bg-white/80 px-2 py-1 rounded-md border border-slate-500 shadow-sm">{tr("點擊展開 ⤴")}</div>
                          )}
                      </div>
                  </div>

                  {/* 彈出視窗 (Modal) - 顯示完整文字，不截斷 */}
                  {expanded && (
                      <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-in fade-in duration-200" onClick={() => setExpanded(false)}>
                          <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden mb-4 sm:mb-0 animate-in slide-in-from-bottom-4 duration-300 border border-slate-400" onClick={e => e.stopPropagation()}>
                              <div className="p-4 border-b border-slate-400 flex justify-between items-center bg-slate-50">

                                  <button onClick={() => setExpanded(false)} className="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-slate-400 text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-colors">
                                      <Icon path={icons.x} size={16}/>
                                  </button>
                              </div>
                              <div className="max-h-[60vh] overflow-y-auto p-3 space-y-3 bg-slate-50/50">
                                  {statuses.map(s => {
                                      const ST = { 1: { dot: '🔴', bg: 'bg-red-50', text: 'text-red-800', border: 'border-red-500' }, 2: { dot: '🟠', bg: 'bg-orange-50', text: 'text-orange-800', border: 'border-orange-500' }, 3: { dot: '🟡', bg: 'bg-amber-50', text: 'text-amber-900', border: 'border-amber-500' }, 4: { dot: '🔵', bg: 'bg-blue-50', text: 'text-blue-800', border: 'border-blue-500' }, 5: { dot: '🔵', bg: 'bg-blue-50', text: 'text-blue-800', border: 'border-blue-500' }, 6: { dot: '⚪', bg: 'bg-white', text: 'text-slate-700', border: 'border-slate-500' } }[s.level] || { dot: '⚪', bg: 'bg-white', text: 'text-slate-700', border: 'border-slate-500' };
                                      return (
                                          <div key={s.id} className={`flex flex-col gap-2 p-3.5 rounded-xl border ${ST.border} shadow-sm ${ST.bg}`}>

                                                  <div className="flex-1">
                                                      <div className={`font-bold text-sm leading-relaxed ${ST.text}`}>{tr(s.main)}</div>
                                                      {s.sub && <div className="text-xs text-slate-600 font-medium mt-1 leading-relaxed">{tr(s.sub)}</div>}
                                                  </div>
                                              </div>
                                              {s.action && (
                                                  <div className="flex justify-end mt-2">
                                                      <button onClick={() => { s.action.run(); setExpanded(false); }} className="px-4 py-2 bg-white border border-slate-500 rounded-lg text-xs font-bold shadow-sm text-slate-800 hover:bg-slate-50 active:scale-[0.98] transition-all">
                                                          {tr(s.action.label)} →
                                                      </button>
                                                  </div>
                                              )}
                                          </div>
                                      );
                                  })}
                              </div>
                          </div>
                      </div>
                  )}
              </React.Fragment>
          );
      };

      return (
        <React.Fragment>
          {/* Header */}
          <header className="app-header bg-white border-b border-slate-400 sticky top-0 z-20 shadow-sm backdrop-blur-md bg-white/90">
            <div className="app-header-row w-full px-3 sm:px-4 py-3.5 flex items-center justify-between max-w-2xl mx-auto">
              <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                <div className="app-brand-icon w-10 h-10 bg-brand-600 text-white rounded-xl flex items-center justify-center shadow-inner shrink-0">
                  <Icon path={icons.calculator} size={22} />

                <div>
                  <h1 className="text-xl font-extrabold text-slate-800 tracking-tight"><span className="app-brand-name block sm:inline whitespace-nowrap">{tr("分帳管家")}</span><span className="inline-flex items-baseline gap-1 sm:ml-1 whitespace-nowrap"><span data-testid="app-pro-label" className="text-brand-600 font-black">Pro</span><span data-testid="app-version-label" className="text-[10px] leading-3 font-semibold tracking-normal text-brand-700">V1.0.1</span></span></h1>

              </div>
              <div className="header-actions flex items-center gap-1.5 sm:gap-2">
                <button type="button" data-testid="header-language-toggle" data-ui-language={uiLang === 'en' ? 'zh-HK' : 'en'} onClick={() => changeUiLanguage(uiLang === 'en' ? 'zh-HK' : 'en')} title={uiLang === 'en' ? 'Switch to Traditional Chinese' : '切換至 English'} aria-label={uiLang === 'en' ? 'Switch to Traditional Chinese' : '切換至 English'} className="header-language-button flex items-center justify-center px-2.5 py-2 bg-slate-100 text-slate-700 border border-slate-400 rounded-lg text-xs font-bold transition-colors">
                  <span className="language-divider" aria-hidden="true"></span><span className="language-zh" lang="zh-HK">中</span><span className="language-en" lang="en">Eng</span>
                </button>
                {(showHistory || showSettings || showTutorial) ? (
                  <button onClick={() => {setShowHistory(false); setShowSettings(false); setShowTutorial(false);}} className="header-back-button flex items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition-colors border border-slate-400">
                    <Icon path={icons.arrowLeft} size={16}/>{tr(" 返回")}</button>
                ) : (
                  <React.Fragment>
                    <button onClick={() => setShowTutorial(true)} title={tr("新手教學")} className="guide-button flex items-center gap-1.5 px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-500 rounded-lg text-sm font-semibold transition-colors">
                      <Icon path={icons.bookOpen} size={16}/> <span className="guide-label">{tr("教學")}</span>
                    </button>
                    <button onClick={() => setShowSettings(true)} title={tr("設定")} className="flex items-center gap-1.5 px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-400 rounded-lg text-sm font-semibold transition-colors">
                      <Icon path={icons.settings} size={16}/>
                    </button>
                    <button onClick={() => setShowHistory(true)} title={tr("紀錄")} className="flex items-center gap-1.5 px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-400 rounded-lg text-sm font-semibold transition-colors">
                      <Icon path={icons.history} size={16}/>
                    </button>
                    <button type="button" data-testid="header-clear-current" disabled={!draftReady} onClick={handleGoToStep1} title={bi('清空目前帳單（保留歷史及已存收據）', 'Clear current bill (keep history and saved receipts)')} aria-label={bi('清空目前帳單', 'Clear current bill')} className="header-clear-button flex items-center justify-center gap-1.5 px-2.5 py-2 border rounded-lg text-sm transition-colors">
                      <Icon path={icons.trash} size={16}/><span className="clear-label">{bi('清空', 'Clear')}</span>
                    </button>
                  </React.Fragment>
                )}
              </div>
            </div>

            {/* Steps Indicator */}
            {(!showHistory && !showSettings && !showTutorial) && (
              <div className="stepper-panel bg-slate-50/80 px-4 py-3 border-t border-slate-400 max-w-2xl mx-auto">
                <div className="flex w-full gap-2 mb-2.5">
                  {[1, 2, 3, 4].map(num => (
                    <div key={num} className={`flex-1 h-1.5 rounded-full transition-colors duration-300 ${step > num ? 'bg-brand-500' : step === num ? 'bg-brand-400' : 'bg-slate-300'}`}></div>
                  ))}
                </div>
                <div className="step-nav grid grid-cols-4 gap-1 px-1">
                  {STEP_LABELS.map((label, i) => {
                    const num = i + 1;
                    const done = step > num;
                    const active = step === num;
                    return (
                      <button key={num} onClick={() => jumpToStep(num)} className={`flex min-w-0 flex-col sm:flex-row justify-center items-center gap-1 sm:gap-2 rounded-lg px-1 py-1 text-center transition-all active:scale-[0.98] outline-none ${active ? 'text-brand-700 bg-brand-50' : done ? 'text-slate-600 hover:bg-slate-100' : 'text-slate-400'}`}>
                        <span className={`w-5 h-5 shrink-0 rounded-full flex items-center justify-center text-[11px] font-bold border ${active ? 'bg-brand-600 border-brand-600 text-white shadow-sm' : done ? 'bg-white border-brand-500 text-brand-600' : 'bg-white border-slate-400 text-slate-500'}`}>{done ? '✓' : num}</span>
                        <span className="text-xs font-semibold leading-tight">{tr(label)}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </header>

          <StatusBar statuses={statuses} expanded={statusExpanded} setExpanded={setStatusExpanded} kbOpen={kbOpen} />

          {/* Main Content Area */}
          <main data-current-step={step} className="w-full px-4 py-6 md:py-8 max-w-2xl mx-auto pb-24">
            {!draftReady && <div className="fixed inset-0 z-[70] flex items-center justify-center bg-white/95 text-slate-700" role="status">{tr("正在檢查本機帳單草稿…")}</div>}
            {draftReady && (hasDraftWork || draftNotice || draftSaveError) && (
              <div data-testid="draft-status" className="mb-4 rounded-xl border border-slate-300 bg-slate-50 p-3 text-xs leading-relaxed text-slate-700" role="status" aria-live="polite">
                {draftNotice && <p className="font-semibold mb-1">{tr(draftNotice)}</p>}
                {draftSaveError || ((hasDraftAssets || draftAssets.unavailable) && draftAssetStatus === 'error') ? (
                  <p role="alert" className="font-semibold text-red-700">{draftSaveError || tr("本機附件草稿未能保存，暫不切換 App；請檢查網站儲存權限及剩餘空間。")}</p>
                ) : <p>{hasDraftAssets && draftAssetStatus === 'saving' ? tr("正在保存本機圖片／附件，完成後才可分享…") : tr("草稿已自動保存於本機。切換 App 後請回到同一瀏覽器、同一網址繼續；清除網站資料會刪除草稿。")}</p>}
              </div>
            )}

            {showRedaction && pendingRedactionImages[redactionIndex] && (
              <div className="fixed inset-0 z-50 bg-slate-950/90 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="receipt-redaction-title">
                <div className="min-h-full w-full px-3 py-4 flex items-center justify-center">
                  <Card className="w-full max-w-xl !p-4 sm:!p-6 shadow-2xl">
                    <div className="flex items-start justify-between gap-3 mb-3">
                      <div>
                        <p className="text-xs font-bold uppercase tracking-wider text-brand-700">{tr("隱私保護")}</p>
                        <h2 id="receipt-redaction-title" className="text-xl font-bold text-slate-900 mt-1">{tr("先遮蓋敏感資料")}</h2>
                      </div>
                      <button type="button" onClick={cancelReceiptRedaction} disabled={isPreparingRedacted} aria-label={tr("取消此次掃描")} className="w-10 h-10 shrink-0 rounded-xl border border-slate-400 text-slate-600 hover:bg-slate-100 text-2xl leading-none">×</button>
                    </div>

                    <div className="rounded-xl border border-amber-500 bg-amber-50 p-3 mb-4">
                      <p className="text-sm font-semibold text-amber-900">{bi('如需遮蓋電話、卡號或會員號，先按下方筆鍵，再拖動框選。未啟用時，滑動只會瀏覽圖片。', 'To hide a phone, card or membership number, enable the pen below, then drag a box. With the pen off, swiping only scrolls.')}</p>
                      <p className="text-xs text-amber-900 mt-1.5 leading-relaxed">{tr("請保留菜名、價格、稅費和日期。只有黑框內像素會被永久移除；框外內容仍會隨遮蓋版送到你設定的 AI 服務作 OCR。原圖不會用於 OCR、歷史儲存或分享。")}</p>
                    </div>

                    <div className="flex items-start gap-3 mb-4">
                      <button type="button" data-testid="redaction-pen-toggle" aria-pressed={redactionDrawEnabled} onClick={() => setRedactionDrawingMode(!redactionDrawEnabledRef.current)} disabled={isPreparingRedacted} className={`shrink-0 min-h-[44px] px-3 py-2 rounded-xl border-2 font-bold text-sm flex items-center gap-2 disabled:opacity-50 ${redactionDrawEnabled ? 'bg-brand-600 text-white border-brand-700 shadow-md' : 'bg-white text-brand-900 border-brand-600 hover:bg-brand-50'}`}>
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><g transform="rotate(-45 12 12)"><path d="M6 9H5l-3 3 3 3h1M18 9h1l3 3-3 3h-1"/><rect x="6" y="8" width="12" height="8" rx="1.5"/><path d="M9 8v8M15 8v8"/></g></svg>
                        <span>{redactionDrawEnabled ? bi('關閉遮蓋筆', 'Disable pen') : bi('啟用遮蓋筆', 'Enable pen')}</span>
                      </button>
                      <p data-testid="redaction-mode-status" role="status" className={`min-w-0 text-sm leading-relaxed ${redactionDrawEnabled ? 'font-semibold text-brand-900' : 'text-slate-700'}`}>
                        {redactionDrawEnabled ? bi('遮蓋已啟用：拖動可畫黑框；再按筆鍵退出。', 'Pen on: drag to draw black boxes. Tap the pen again to stop.') : bi('瀏覽模式：可上下滑動，不會畫黑框。', 'View mode: swipe to scroll. No marks will be drawn.')}
                      </p>
                    </div>

                    <div className="flex items-center justify-between gap-2 mb-2">
                      <button type="button" onClick={() => { setRedactionIndex(index => Math.max(0, index - 1)); setRedactionDrag(null); redactionDragRef.current = null; }} disabled={redactionIndex === 0 || isPreparingRedacted} className="px-3 py-2 rounded-lg border border-slate-400 bg-white text-sm font-semibold disabled:opacity-40">{tr("上一張")}</button>
                      <div className="text-center text-sm font-bold text-slate-700">{bi(`第 ${redactionIndex + 1} / ${pendingRedactionImages.length} 張`, `Image ${redactionIndex + 1} of ${pendingRedactionImages.length}`)}<br/><span className="text-xs font-normal text-slate-500">{bi(`已遮蓋 ${(redactionMasks[redactionIndex] || []).length} 處`, `${(redactionMasks[redactionIndex] || []).length} redacted area${(redactionMasks[redactionIndex] || []).length === 1 ? '' : 's'}`)}</span></div>
                      <button type="button" onClick={() => setRedactionMasks(current => { const next = current.slice(); next[redactionIndex] = []; return next; })} disabled={!(redactionMasks[redactionIndex] || []).length || isPreparingRedacted} className="px-3 py-2 rounded-lg border border-slate-400 bg-white text-sm font-semibold disabled:opacity-40">{tr("清除本張")}</button>
                    </div>

                          draggable="false"
                        />
                        <canvas
                          ref={redactionCanvasRef}
                          aria-label={tr("在此拖動框選要永久遮蓋的敏感資料")}
                          data-testid="redaction-canvas"

                          className={`absolute inset-0 w-full h-full ${redactionDrawEnabled ? 'cursor-crosshair' : 'cursor-default'}`}
                          style={{ touchAction: redactionDrawEnabled ? 'none' : 'pan-y pinch-zoom', pointerEvents: redactionDrawEnabled ? 'auto' : 'none' }}
                          onPointerDown={handleRedactionPointerDown}

                          onPointerUp={handleRedactionPointerUp}
