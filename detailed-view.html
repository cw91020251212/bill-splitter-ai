<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#145c3b">
  <title>朋友埋單表格</title>
  <style>
    :root { color-scheme:light; --ink:#1d2a21; --muted:#68756c; --line:#68766c; --separator:#9aa69c; --paper:#f4f6f2; --green:#176a43; --green-dark:#104d31; --green-pale:#e7f2e9; --shadow:0 12px 32px rgba(27,54,35,.07); --readable-text-scale:1; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:calc(16px * var(--readable-text-scale, 1))/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body.small-text { --readable-text-scale:.9; }
    body.large-text { --readable-text-scale:1.2; }
    a,button,summary { -webkit-tap-highlight-color:transparent; }
    a:focus-visible,button:focus-visible,summary:focus-visible { outline:3px solid #b38830; outline-offset:3px; border-radius:7px; }
    .topbar { position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:58px; padding:10px max(20px,calc((100vw - 1020px)/2)); border-bottom:1px solid var(--line); background:rgba(255,255,255,.96); backdrop-filter:blur(10px); }
    .back { color:var(--green-dark); font-weight:750; text-decoration:none; }
    .edit-claims-button { margin-right:auto; min-height:32px; padding:5px 9px; border:1px solid #b9cbbb; border-radius:8px; background:#f7faf7; color:var(--green-dark); font:inherit; font-size:calc((12px) * var(--readable-text-scale, 1)); font-weight:750; white-space:nowrap; cursor:pointer; }
    .edit-claims-button:disabled { opacity:.55; cursor:not-allowed; }
    .font-size-toggle { display:flex; flex:0 0 auto; align-items:center; gap:2px; min-height:44px; padding:2px; border:1px solid #b9cbbb; border-radius:9px; background:#f7faf7; }
    .font-size-option { min-width:38px; min-height:38px; padding:5px 7px; border:1px solid transparent; border-radius:6px; background:transparent; color:var(--green-dark); font:inherit; font-size:14px; font-weight:850; cursor:pointer; }
    .font-size-option[aria-pressed="true"] { border-color:var(--green-dark); background:var(--green-dark); color:#fff; }
    .font-size-option:focus-visible { outline:3px solid rgba(50,111,174,.55); outline-offset:1px; }
    .local-tag { padding:4px 9px; border:1px solid #cee0d0; border-radius:99px; background:#f5faf5; color:#4b6652; font-size:calc((11px) * var(--readable-text-scale, 1)); font-weight:700; white-space:nowrap; }
    main { width:min(100% - 36px,1000px); margin:26px auto 64px; }
    .empty { max-width:480px; margin:14vh auto; padding:30px 24px; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:var(--shadow); text-align:center; }
    .empty h1 { margin:0 0 8px; font-size:calc((23px) * var(--readable-text-scale, 1)); }
    .empty p { margin:0; color:var(--muted); }
    .page-title { margin:0 0 18px; font-size:calc((25px) * var(--readable-text-scale, 1)); line-height:1.25; }
    .member-gate { max-width:500px; margin:15vh auto 0; padding:26px 23px; border:1px solid var(--line); border-radius:19px; background:#fff; box-shadow:var(--shadow); }
    .member-gate h1 { margin:0 0 16px; font-size:calc((23px) * var(--readable-text-scale, 1)); text-align:center; }
    .member-gate select { display:block; width:100%; min-height:50px; padding:10px 40px 10px 13px; border:1px solid #b9cbbb; border-radius:11px; background:#fff; color:var(--ink); font:inherit; font-weight:700; }
    .member-gate select:focus-visible { outline:3px solid #b38830; outline-offset:2px; }
    .share-privacy { margin:12px 0 0; color:#80551f; font-size:calc((12px) * var(--readable-text-scale, 1)); line-height:1.5; }
    .member-gate--selected { display:grid; grid-template-columns:minmax(130px,.45fr) minmax(0,1fr); align-items:center; gap:12px; margin:0 auto 16px; padding:11px 15px; box-shadow:none; }
    .member-gate--selected h1 { margin:0; font-size:calc((14px) * var(--readable-text-scale, 1)); text-align:left; }
    .member-gate--selected .share-privacy { grid-column:1/-1; margin-top:0; }
    .total-card { scroll-margin-top:66px; display:flex; justify-content:space-between; align-items:center; gap:18px; min-height:92px; margin-bottom:22px; padding:20px 25px; border:1px solid #135837; border-radius:19px; background:linear-gradient(120deg,#176a43,#104d31); color:#fff; box-shadow:var(--shadow); }
    .total-label { font-size:calc((15px) * var(--readable-text-scale, 1)); font-weight:750; opacity:.92; }
    .total-value-group { display:flex; min-width:0; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px; }
    .total-value { color:#fff; font-size:calc((clamp(30px,5vw,38px)) * var(--readable-text-scale, 1)); font-weight:900; line-height:1.1; letter-spacing:-.03em; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
    .copy-amount-button { min-height:30px; padding:4px 9px; border:1px solid rgba(255,255,255,.78); border-radius:8px; background:rgba(255,255,255,.12); color:#fff; font:inherit; font-size:calc((12px) * var(--readable-text-scale, 1)); font-weight:800; cursor:pointer; white-space:nowrap; }
    .copy-amount-button:hover { background:rgba(255,255,255,.22); }
    .copy-amount-button:disabled { opacity:.6; cursor:not-allowed; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .content-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr); align-items:start; gap:22px; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:19px; background:#fff; box-shadow:0 7px 22px rgba(27,54,35,.045); }
    .card-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:64px; padding:17px 21px; border-bottom:1px solid var(--separator); }
    .card-heading h2 { margin:0; font-size:calc((19px) * var(--readable-text-scale, 1)); }
    .item-detail-toggle { flex:0 0 auto; min-height:32px; padding:5px 9px; border:1px solid #b9cbbb; border-radius:8px; background:#f7faf7; color:var(--green-dark); font:inherit; font-size:calc((12px) * var(--readable-text-scale, 1)); font-weight:750; white-space:nowrap; cursor:pointer; }
    .item-detail-toggle:disabled { opacity:.55; cursor:not-allowed; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; text-align:left; }
    th { padding:11px 21px; background:#f8faf7; color:#748076; font-size:calc((12px) * var(--readable-text-scale, 1)); font-weight:750; }
    th:last-child { text-align:right; }
    td { padding:19px 21px; border-top:1px solid var(--separator); vertical-align:top; }
    tbody tr:first-child td { border-top:0; }
    .item-name { color:#1e2d23; font-size:calc((16px) * var(--readable-text-scale, 1)); font-weight:760; overflow-wrap:anywhere; }
    .amount { color:#203729; font-size:calc((16px) * var(--readable-text-scale, 1)); font-weight:820; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
    .empty-items { color:var(--muted); text-align:center; }
    .item-details { margin-top:8px; color:var(--muted); font-size:calc((12px) * var(--readable-text-scale, 1)); }
    .item-details summary { width:max-content; max-width:100%; color:#63756a; cursor:pointer; }
    .item-extra { display:grid; gap:7px; margin:10px 0 0; padding:12px 13px; border-radius:11px; background:#f6f8f5; color:#56645a; overflow-wrap:anywhere; }
    .share-list { display:grid; gap:4px; margin:4px 0 0; padding-left:18px; }
    .share-list li { padding-left:2px; }
    .receipt-card { position:sticky; top:78px; }
    .receipt-heading { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .image-count { color:#738076; font-size:calc((12px) * var(--readable-text-scale, 1)); font-weight:650; }
    .receipt-content { padding:17px; }
    .receipt-grid { display:grid; grid-template-columns:1fr; gap:13px; }
    .receipt-photo { overflow:hidden; width:100%; padding:0; border:1px solid var(--line); border-radius:13px; background:#f6f8f5; cursor:zoom-in; text-align:left; }
    .receipt-photo img { display:block; width:100%; height:340px; object-fit:contain; background:#f0f2ee; }
    .receipt-photo span { display:block; padding:8px 11px; border-top:1px solid var(--separator); color:#657268; font-size:calc((12px) * var(--readable-text-scale, 1)); }
    .photo-placeholder { display:grid; min-height:200px; place-items:center; padding:20px; border:1px dashed var(--line); border-radius:13px; background:#fafbf9; color:#758178; font-size:calc((13px) * var(--readable-text-scale, 1)); text-align:center; }
    .optional { overflow:hidden; margin-top:16px; border:1px solid var(--line); border-radius:15px; background:#fff; }
    .optional > summary { display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:56px; padding:14px 18px; color:#33443a; font-size:calc((14px) * var(--readable-text-scale, 1)); font-weight:760; cursor:pointer; list-style:none; }
    .optional > summary::-webkit-details-marker { display:none; }
    .optional > summary::after { content:"＋"; display:grid; place-items:center; flex:0 0 25px; width:25px; height:25px; border:1px solid #d8e2d9; border-radius:50%; color:var(--green); font-size:calc((16px) * var(--readable-text-scale, 1)); }
    .optional[open] > summary::after { content:"−"; }
    .optional-content { padding:0 18px 18px; color:#536158; font-size:calc((13px) * var(--readable-text-scale, 1)); }
    .personal-breakdown { margin:0 0 18px; padding:18px 20px 20px; }
    .personal-breakdown h2 { margin:0 0 11px; font-size:calc((17px) * var(--readable-text-scale, 1)); }
    .personal-breakdown .detail-list { grid-template-columns:1fr auto; }
    #payment-instructions { border:1px solid var(--line); background:#fff9e8; }
    #payment-recipient { color:#203729; font-size:calc((24px) * var(--readable-text-scale, 1)); font-weight:850; }
    .personal-breakdown .detail-list dt:last-of-type,.personal-breakdown .detail-list dd:last-of-type { color:var(--green-dark); font-weight:850; }
    .paid-notice-card { margin:0 0 18px; padding:16px 18px; }
    .paid-notice-button { width:100%; min-height:48px; padding:10px 14px; border:1px solid #104d31; border-radius:11px; background-color:#176a43; background-image:linear-gradient(to top right,#104d31 0%,#176a43 55%,#21845a 100%); color:#fff; box-shadow:none; text-shadow:0 1px 1px rgba(0,0,0,.35); font:inherit; font-weight:800; cursor:pointer; transition:background-color .15s ease,transform .15s ease; }
    .paid-notice-button svg { color:#fff; stroke:#fff; filter:none; }
    .paid-notice-button:not(:disabled):hover { background-image:linear-gradient(to top right,#0d4229 0%,#145c3b 55%,#1b754a 100%); }
    .paid-notice-button:not(:disabled):active { background-image:linear-gradient(to top right,#0a3924 0%,#104d31 55%,#155e3c 100%); }
    .paid-notice-button:focus-visible { outline:3px solid #173c2e; outline-offset:3px; box-shadow:none; }
    .paid-notice-button:disabled { opacity:.58; cursor:not-allowed; }
    .paid-notice-status { margin:7px 0 0; color:#3d5d47; font-size:calc((12px) * var(--readable-text-scale, 1)); }
    .item-subline { margin-top:4px; color:#718076; font-size:calc((12px) * var(--readable-text-scale, 1)); font-weight:500; }
    .detail-list { display:grid; grid-template-columns:minmax(115px,.7fr) 1.3fr; gap:0 14px; margin:0; }
    .detail-list dt,.detail-list dd { margin:0; padding:9px 0; border-top:1px solid var(--separator); }
    .detail-list dt { color:#748076; }
    .detail-list dd { color:#35463b; font-weight:650; overflow-wrap:anywhere; }
    .adjustment-list { display:grid; gap:8px; margin:11px 0 0; padding-left:19px; }
    .notice { margin:10px 0 0; padding:11px 12px; border-radius:10px; background:#f5f7f4; color:#66736a; }
    dialog { width:min(94vw,1000px); max-width:none; max-height:92vh; padding:0; border:0; border-radius:17px; background:#101711; box-shadow:0 20px 70px rgba(0,0,0,.4); }
    dialog::backdrop { background:rgba(15,25,18,.78); }
    .lightbox-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 13px; color:#fff; }
    .lightbox-head button { min-width:40px; min-height:38px; border:1px solid #718077; border-radius:9px; background:#26352b; color:#fff; font-size:calc((20px) * var(--readable-text-scale, 1)); cursor:pointer; }
    .lightbox-image { display:block; width:100%; max-height:calc(92vh - 60px); object-fit:contain; }
    @media(max-width:720px) {
      .topbar { min-height:52px; padding:8px 14px; }
      main { width:calc(100% - 22px); margin:18px auto 42px; }
      .page-title { margin-bottom:13px; font-size:calc((22px) * var(--readable-text-scale, 1)); }
      .total-card { min-height:78px; margin-bottom:15px; padding:17px 14px; gap:10px; }
      .total-label { min-width:0; }
      .total-value-group { gap:6px; }
      .total-value { font-size:calc((clamp(25px,7.7vw,32px)) * var(--readable-text-scale, 1)); }
      .member-gate { margin-top:12vh; padding:22px 17px; }
      .member-gate--selected { grid-template-columns:1fr; gap:5px; margin-bottom:12px; padding:11px 14px; }
      .member-gate--selected h1 { font-size:calc((13px) * var(--readable-text-scale, 1)); }
      .content-grid { grid-template-columns:1fr; gap:14px; }
      .card-heading { min-height:56px; padding:14px 16px; }
      th { padding:9px 15px; }
      td { padding:16px 15px; }
      .receipt-card { position:static; }
      .receipt-content { padding:13px; }
      .receipt-photo img { height:min(68vh,430px); }
      .optional { margin-top:13px; }
    }
    @media(min-width:721px) { .receipt-grid[data-count="2"] { grid-template-columns:1fr; } }
    body.shared-link-view {
      --ink:#203247; --muted:#586d82; --line:#334e68; --separator:#637b91;
      --paper:#bccad7; --green:#70a5dc; --green-dark:#326fae; --green-pale:#c5d3df;
      --shadow:0 12px 32px rgba(32,63,92,.14);
    }
    body.shared-link-view a:focus-visible,
    body.shared-link-view button:focus-visible,
    body.shared-link-view summary:focus-visible { outline:2px solid #203f5c; }
    body.shared-link-view .back,
    body.shared-link-view .member-gate--selected h1 { color:#326fae; }
    body.shared-link-view .edit-claims-button,
    body.shared-link-view .font-size-toggle,
    body.shared-link-view .item-detail-toggle {
      border-color:#334e68; background:#c5d3df; color:#234f80;
    }
    body.shared-link-view .member-gate select { border-color:#334e68; background:#c6d4e0; }
    body.shared-link-view .member-gate select:focus-visible { outline:2px solid #203f5c; }
    body.shared-link-view .total-card {
      border-color:#334e68; background:linear-gradient(120deg,#4b88c4,#3978b6);
      box-shadow:0 8px 22px rgba(47,96,150,.12);
    }
    body.shared-link-view .copy-amount-button { border-color:rgba(255,255,255,.85); background:rgba(255,255,255,.14); }
    body.shared-link-view .paid-notice-button {
      border-color:#334e68; background-color:#3978b6;
      background-image:linear-gradient(to top right,#326fae 0%,#3978b6 60%,#4c8dc9 100%);
    }
    body.shared-link-view .paid-notice-button:not(:disabled):hover {
      background-image:linear-gradient(to top right,#2d68a3 0%,#3674ae 60%,#4683bd 100%);
    }
    body.shared-link-view .paid-notice-button:focus-visible { outline-color:#326fae; }
    body.shared-link-view .paid-notice-status,
    body.shared-link-view .personal-breakdown .detail-list dt:last-of-type,
    body.shared-link-view .personal-breakdown .detail-list dd:last-of-type { color:#326fae; }
    body.shared-link-view .optional > summary::after { border-color:#334e68; color:#234f80; }
    body.shared-link-view .topbar { background:rgba(188,202,215,.98); }
    body.shared-link-view .empty,
    body.shared-link-view .member-gate,
    body.shared-link-view .card,
    body.shared-link-view .optional { border-color:#334e68; background-color:#d5dfe8; }
    body.shared-link-view .local-tag { border-color:#334e68; background:#c1cfdb; }
    body.shared-link-view th { background:#c1cfdb; color:#203f5c; }
    body.shared-link-view .item-extra,
    body.shared-link-view .receipt-photo,
    body.shared-link-view .photo-placeholder,
    body.shared-link-view .notice { background:#c8d6e1; }
    body.shared-link-view .receipt-photo { border-color:#334e68; }
    body.shared-link-view .receipt-photo img { background:#c8d6e1; }
    body.shared-link-view #payment-instructions { border-color:#334e68; background:#c8d6e1; }
    body.shared-link-view .copy-amount-button { border-color:#203f5c; background:#c5d3df; color:#203f5c; }
    body.shared-link-view .copy-amount-button:hover { background:#bac8d6; }
    body.shared-link-view .paid-notice-button:focus-visible { outline:2px solid #203f5c; }
  </style>
</head>
<body>
  <header class="topbar">
    <span id="friend-page-heading" class="back">分帳結果</span>
    <button id="edit-claims" class="edit-claims-button" type="button" hidden disabled>修改認帳</button>
    <a id="local-back" class="back" hidden>← 返回分帳報告</a>
    <span id="local-tag" class="local-tag" hidden>本機預覽・不會公開</span>
    <div id="font-size-toggle" class="font-size-toggle" role="group" aria-label="字體大小 / Text size">
      <button class="font-size-option" type="button" data-font-size="small" aria-label="小字體 / Smaller text" title="小字體 / Smaller text" aria-pressed="false">A−</button>
      <button class="font-size-option" type="button" data-font-size="normal" aria-label="標準字體 / Standard text" title="標準字體 / Standard text" aria-pressed="true">A</button>
      <button class="font-size-option" type="button" data-font-size="large" aria-label="大字體 / Larger text" title="大字體 / Larger text" aria-pressed="false">A+</button>
    </div>
  </header>
  <main>
    <section id="loading-state" class="empty" aria-live="polite">
      <h1>載入中…</h1>
    </section>
    <section id="empty-state" class="empty" hidden>
      <h1>未有分帳資料</h1>
      <p>請返回分帳報告，再開一次朋友埋單頁。</p>
    </section>
    <div id="preview-content" hidden>
      <section id="member-gate" class="member-gate">
        <h1 id="member-gate-heading">朋友埋單</h1>
        <select id="member-select" data-testid="member-select" aria-label="請選擇成員"><option value="">請揀你個名</option></select>
        <p id="share-privacy" class="share-privacy" hidden>持有此連結者可查看全單及收據。<br><strong id="share-expiry" data-testid="share-expiry"></strong></p>
      </section>
      <div id="member-content" hidden>
      <h1 id="page-title" class="page-title"></h1>
      <section id="friend-amount-summary" class="total-card" data-testid="friend-amount-summary" aria-label="分帳總額">
        <span id="total-label" class="total-label">全單總額</span>
        <div class="total-value-group">
          <strong id="grand-total" class="total-value" data-testid="preview-grand-total">—</strong>
          <button id="copy-payable" class="copy-amount-button" data-testid="copy-payable" type="button" aria-label="複製應付金額" disabled>複製</button>
          <span id="copy-payable-status" class="visually-hidden" role="status" aria-live="polite"></span>
        </div>
      </section>
      <section id="personal-breakdown" class="card personal-breakdown" data-testid="personal-breakdown" hidden>
        <h2 id="personal-title"></h2>
        <dl id="personal-details" class="detail-list"></dl>
      </section>
      <section id="payment-instructions" class="card personal-breakdown" data-testid="payment-instructions" aria-label="付款">
        <h2>付款</h2>
        <dl class="detail-list"><dt>收款人</dt><dd id="payment-recipient">未指定</dd><dt>方式</dt><dd id="payment-methods">未指定</dd></dl>
      </section>
      <section class="card paid-notice-card" data-testid="paid-notice-card" aria-label="WhatsApp 通知收款人">
        <button id="share-paid-notice" data-testid="share-paid-notice" class="paid-notice-button" type="button">付款後請通知收款人</button>
        <p id="paid-notice-status" data-testid="paid-notice-status" class="paid-notice-status" role="status" aria-live="polite"></p>
      </section>
      <div class="content-grid">
        <section class="card items-card" aria-labelledby="items-title">
          <div class="card-heading"><h2 id="items-title">項目明細</h2><button id="toggle-all-item-details" class="item-detail-toggle" data-testid="toggle-all-item-details" type="button" aria-controls="item-rows" aria-expanded="false" disabled>展開全部明細</button></div>
          <div class="table-wrap">
            <table data-testid="detail-items-table">
              <thead><tr><th id="item-heading" scope="col">項目／分食比例</th><th id="amount-heading" scope="col">分攤金額</th></tr></thead>
              <tbody id="item-rows"></tbody>
            </table>
          </div>
        </section>
        <aside class="card receipt-card" aria-labelledby="receipt-title">
          <div class="card-heading">
            <div class="receipt-heading"><h2 id="receipt-title">單據相片</h2><span id="image-count" class="image-count"></span></div>
          </div>
          <div id="receipt-content" class="receipt-content"><div class="photo-placeholder">載入中…</div></div>
        </aside>
      </div>
      <details id="other-details" class="optional" data-testid="other-details">
        <summary>其他單據資料（折扣、稅項及匯率）</summary>
        <div class="optional-content">
          <dl id="bill-details" class="detail-list"></dl>
          <p id="adjustment-note" class="notice" hidden></p>
        </div>
      </details>
      </div>
    </div>
  </main>
  <dialog id="photo-dialog" aria-label="放大收據相片">
    <div class="lightbox-head"><span id="photo-caption">單據相片</span><button id="close-photo" type="button" aria-label="關閉">×</button></div>
    <img id="lightbox-image" class="lightbox-image" alt="放大的單據相片">
  </dialog>
  <script src="./share-config.js"></script>
  <script src="./bill-share-api.js?v=v106-small-optional-code"></script>
  <script>
    (async () => {
      'use strict';
      const PREVIEW_KEY = 'billSplitterDetailTablePreviewV1';
      const $ = selector => document.querySelector(selector);
      const fontSizeToggle = $('#font-size-toggle');
      const fontSizeOptions = Array.from(fontSizeToggle.querySelectorAll('[data-font-size]'));
      const fontSizePreferenceKey = 'billSplitResultTextSizeV2';
      const legacyFontSizePreferenceKey = 'billSplitResultLargeTextV1';
      const setTextSize = (size, persist = false) => {
        const value = ['small', 'normal', 'large'].includes(size) ? size : 'normal';
        document.body.classList.toggle('small-text', value === 'small');
        document.body.classList.toggle('large-text', value === 'large');
        fontSizeOptions.forEach(option => option.setAttribute('aria-pressed', String(option.dataset.fontSize === value)));
        if (persist) {
          try {
            localStorage.setItem(fontSizePreferenceKey, value);
            localStorage.setItem(legacyFontSizePreferenceKey, value === 'large' ? '1' : '0');
          } catch (_) {}
        }
      };
      let savedTextSize = 'normal';
      try {
        const saved = localStorage.getItem(fontSizePreferenceKey);
        savedTextSize = ['small', 'normal', 'large'].includes(saved)
          ? saved
          : (localStorage.getItem(legacyFontSizePreferenceKey) === '1' ? 'large' : 'normal');
      } catch (_) {}
      setTextSize(savedTextSize);
      fontSizeOptions.forEach(option => option.addEventListener('click', () => setTextSize(option.dataset.fontSize, true)));
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
      const number = value => Number.isFinite(Number(value)) ? Number(value) : 0;
      const formatMoney = (value, currency, allowFraction = false) => {
        const code = /^[A-Z]{3}$/.test(String(currency || '')) ? currency : 'HKD';
        try {
          if (allowFraction) {
            const defaults = new Intl.NumberFormat('zh-HK', { style:'currency', currency:code }).resolvedOptions();
            return new Intl.NumberFormat('zh-HK', { style:'currency', currency:code, minimumFractionDigits:defaults.minimumFractionDigits, maximumFractionDigits:Math.max(6, defaults.maximumFractionDigits) }).format(number(value));
          }
          return new Intl.NumberFormat('zh-HK', { style:'currency', currency:code, maximumFractionDigits:['JPY','KRW'].includes(code) ? 0 : 2 }).format(number(value));
        } catch (_) { return `${code} ${number(value).toFixed(allowFraction ? 6 : 2)}`; }
      };
      const formatQuantity = value => new Intl.NumberFormat('zh-HK', { maximumFractionDigits:3 }).format(number(value));
      const gcd = (a, b) => { let left = Math.abs(Math.round(a)); let right = Math.abs(Math.round(b)); while (right) { const remainder = left % right; left = right; right = remainder; } return left || 1; };
      const formatReducedFraction = (numerator, denominator) => {
        const ratio = number(numerator) / number(denominator);
        if (!Number.isFinite(ratio) || ratio <= 0) return '';
        let value = ratio;
        let previousNumerator = 0, currentNumerator = 1, previousDenominator = 1, currentDenominator = 0;
        for (let index = 0; index < 32; index += 1) {
          const whole = Math.floor(value);
          const nextNumerator = whole * currentNumerator + previousNumerator;
          const nextDenominator = whole * currentDenominator + previousDenominator;
          if (nextDenominator > 1000000 || !Number.isSafeInteger(nextNumerator)) break;
          previousNumerator = currentNumerator; currentNumerator = nextNumerator;
          previousDenominator = currentDenominator; currentDenominator = nextDenominator;
          if (Math.abs(currentNumerator / currentDenominator - ratio) <= Math.max(1e-10, Math.abs(ratio) * 1e-7)) break;
          const remainder = value - whole;
          if (remainder <= 1e-12) break;
          value = 1 / remainder;
        }
        if (currentDenominator <= 0) return '';
        const divisor = gcd(currentNumerator, currentDenominator);
        return `${currentNumerator / divisor}/${currentDenominator / divisor}`;
      };
      const shareParams = new URLSearchParams(window.location.search);
      const shareId = shareParams.get('share') || '';
      const expectedExpiry = Number(shareParams.get('e') || 0);
      // A shared URL never exposes the organizer's local-preview navigation,
      // even during loading, on errors, or when the share id is empty.
      const isSharedLink = shareParams.has('share');
      document.body.classList.toggle('shared-link-view', isSharedLink);
      if (isSharedLink) document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#4b88c4');
      const isEmbeddedShared = isSharedLink && window.parent !== window;
      let claimResultReady = false;
      let pendingClaimContext = null;
      let applyClaimContext = null;
      if (isEmbeddedShared) {
        window.addEventListener('message', event => {
          if (event.origin !== location.origin || event.source !== window.parent) return;
          const context = event.data;
          if (!context || context.type !== 'bill-claim-result-context' || context.sessionId !== shareId) return;
          pendingClaimContext = context;
          if (claimResultReady) applyClaimContext(context);
        });
      }
      if (!isSharedLink) {
        $('#friend-page-heading').hidden = true;
        $('#local-back').href = './index.html';
        $('#local-back').hidden = false;
      }
      let data = null;
      let shareExpiresAt = '';
      if (isSharedLink) {
        try {
          if (!window.BillShareApi?.getShare) throw new Error('分享服務尚未載入，請重新開啟連結。');
          const stored = await window.BillShareApi.getShare(shareId, expectedExpiry);
          data = stored.data;
          shareExpiresAt = stored.expiresAt || (expectedExpiry ? new Date(expectedExpiry * 1000).toISOString() : '');
        } catch (error) {
          $('#loading-state').hidden = true;
          $('#empty-state').hidden = false;
          $('#empty-state h1').textContent = /到期/.test(error?.message || '') ? '連結已到期' : '未能載入分帳';
          $('#empty-state p').textContent = '請向發起人索取新連結。';
          return;
        }
      } else {
        try { data = JSON.parse(localStorage.getItem(PREVIEW_KEY) || 'null'); } catch (_) {}
      }
      if (!data || ![1, 2].includes(Number(data.version)) || !data.bill || !Array.isArray(data.items)) {
        $('#loading-state').hidden = true;
        $('#empty-state').hidden = false;
        if (isSharedLink) {
          $('#empty-state h1').textContent = '連結無效或已到期';
          $('#empty-state p').textContent = '請向發起人索取新連結。';
        }
        return;
      }
      $('#loading-state').hidden = true;
      $('#preview-content').hidden = false;
      const bill = data.bill;
      if (isSharedLink) {
        $('#local-tag').hidden = true;
        $('#share-privacy').hidden = false;
        $('#share-expiry').textContent = shareExpiresAt ? `有效至 ${new Intl.DateTimeFormat('zh-HK', { timeZone: 'Asia/Hong_Kong', dateStyle: 'medium', timeStyle: 'short' }).format(new Date(shareExpiresAt))}` : '有效 7 日';
      }
      const currency = bill.currency || 'HKD';
      const sourceCurrency = bill.sourceCurrency || currency;
      const isSourceBreakdown = Number(data.version) >= 2;
      const breakdownCurrency = isSourceBreakdown ? sourceCurrency : currency;
      const formatBreakdownMoney = value => formatMoney(value, breakdownCurrency, isSourceBreakdown);
      const participants = Array.isArray(data.participants) ? data.participants : [];
      const sharedImages = isSharedLink && Array.isArray(data.images) ? data.images.filter(image => image && typeof image.data === 'string' && /^[A-Za-z0-9+/]+={0,2}$/.test(image.data) && ['image/jpeg','image/png','image/webp'].includes(image.mimeType)) : [];
      const memberSelect = $('#member-select');
      const memberGateHeading = $('#member-gate-heading');
      const editClaimsButton = $('#edit-claims');
      let canEditClaims = false;
      let ownClaimName = '';
      const syncEditClaimsButton = () => {
        editClaimsButton.hidden = !isEmbeddedShared || !canEditClaims;
        editClaimsButton.disabled = !canEditClaims || !memberSelect.value || !participants.some(person => person.name === memberSelect.value);
      };
      const adjustments = Array.isArray(data.adjustments) ? data.adjustments : [];
      if (participants.length) {
        memberSelect.innerHTML = '<option value="">請揀你個名</option>' + participants.map(person => `<option value="${escapeHtml(person.name)}">${escapeHtml(person.name)}</option>`).join('');
      } else {
        memberSelect.innerHTML = '<option value="">呢張單未有成員</option>';
        memberSelect.disabled = true;
        memberGateHeading.textContent = '呢張單未有成員';
      }
      const payerName = String(bill.payer || '').trim();
      $('#payment-recipient').textContent = payerName || '未指定';
      $('#payment-methods').textContent = Array.isArray(bill.paymentMethods) && bill.paymentMethods.length ? bill.paymentMethods.join('、') : '未指定';
      const paidNoticeButton = $('#share-paid-notice');
      const paidNoticeStatus = $('#paid-notice-status');
      const copyPayableButton = $('#copy-payable');
      const toggleAllItemDetailsButton = $('#toggle-all-item-details');
      const getSelectedForNotice = () => participants.find(person => person.name === memberSelect.value);
      const copyText = async text => {
        if (navigator.clipboard && window.isSecureContext) {
          try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
        }
        const temporary = document.createElement('textarea');
        temporary.value = text; temporary.setAttribute('readonly', '');
        temporary.style.position = 'fixed'; temporary.style.opacity = '0';
        document.body.append(temporary); temporary.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch (_) {}
        temporary.remove();
        return copied;
      };
      const syncItemDetailToggleButton = () => {
        const details = Array.from($('#item-rows').querySelectorAll('details.item-details'));
        const allOpen = details.length > 0 && details.every(detail => detail.open);
        toggleAllItemDetailsButton.disabled = details.length === 0;
        toggleAllItemDetailsButton.setAttribute('aria-expanded', String(allOpen));
        toggleAllItemDetailsButton.textContent = allOpen ? '收起全部明細' : '展開全部明細';
      };
      toggleAllItemDetailsButton.addEventListener('click', () => {
        const details = Array.from($('#item-rows').querySelectorAll('details.item-details'));
        const shouldOpen = details.some(detail => !detail.open);
        details.forEach(detail => { detail.open = shouldOpen; });
        syncItemDetailToggleButton();
      });
      const getShareContextUrl = () => {
        if (!isSharedLink || !shareId) return '';
        const apiBaseUrl = String(window.BillShareConfig?.apiBaseUrl || '').trim();
        if (!apiBaseUrl) return window.location.href;
        try {
          const shortUrl = new URL(`/s/${encodeURIComponent(shareId)}`, apiBaseUrl);
          if (expectedExpiry > 0) shortUrl.searchParams.set('e', String(expectedExpiry));
          return shortUrl.href;
        } catch (_) { return window.location.href; }
      };
      const buildPaidNoticeMessage = selected => {
        const recipient = payerName || '收款人';
        const message = `${recipient}你好，我係${selected.name}，已轉帳 ${formatMoney(selected.total, currency)} 畀你。`;
        const shareUrl = getShareContextUrl();
        return shareUrl ? `${message}\n分帳：${shareUrl}` : message;
      };
      const notifyPayerOfPayment = () => {
        const selected = getSelectedForNotice();
        if (!selected || !payerName || selected.name === payerName) return;
        window.open(`https://wa.me/?text=${encodeURIComponent(buildPaidNoticeMessage(selected))}`, '_blank', 'noopener,noreferrer');
        paidNoticeStatus.textContent = 'WhatsApp 已開啟';
      };
      const detailEntries = [
        ['日期', bill.date || '未提供']
      ];
      if (sourceCurrency !== currency) {
        detailEntries.push(['匯率', `1 ${sourceCurrency} = ${bill.exchangeRate || '—'} ${currency}`]);
        detailEntries.push(['匯率日期／來源', [bill.exchangeRateDate, bill.exchangeProvider].filter(Boolean).join(' · ') || '未提供']);
      }
      if (isSourceBreakdown) {
        detailEntries.push(['原幣分帳總額', `${formatMoney(bill.sourceBillTotal ?? bill.sourceTotal, sourceCurrency, true)} ${sourceCurrency}`]);
        detailEntries.push(['結算總額', `${formatMoney(bill.billTotal, currency)} ${currency}`]);
      }
      $('#bill-details').innerHTML = detailEntries.map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`).join('');
      if (bill.receiptAdjustmentNote) {
        $('#adjustment-note').hidden = false;
        $('#adjustment-note').textContent = bill.receiptAdjustmentNote;
      }

      const renderSelectedMember = () => {
        syncEditClaimsButton();
        const selected = participants.find(person => person.name === memberSelect.value);
        if (!selected) {
          $('#member-content').hidden = true;
          $('#local-tag').hidden = true;
          $('#member-gate').classList.remove('member-gate--selected');
          memberGateHeading.textContent = '朋友埋單';
          paidNoticeButton.disabled = true;
          copyPayableButton.disabled = true;
          toggleAllItemDetailsButton.disabled = true;
          paidNoticeStatus.textContent = '';
          return;
        }
        $('#member-content').hidden = false;
        copyPayableButton.disabled = false;
        copyPayableButton.textContent = '複製';
        $('#copy-payable-status').textContent = '';
        $('#local-tag').hidden = isSharedLink;
        if (!isSharedLink) $('#local-tag').textContent = '本機預覽';
        $('#member-gate').classList.add('member-gate--selected');
        const isPayer = Boolean(payerName) && selected.name === payerName;
        paidNoticeButton.disabled = !payerName || isPayer;
        paidNoticeStatus.textContent = !payerName ? '未設定收款人' : '';
        memberGateHeading.textContent = '切換成員';
        $('#page-title').textContent = `${selected.name}嘅賬單`;
        $('#total-label').textContent = isSourceBreakdown ? `你要埋單幾多（${currency}）` : '你要埋單幾多';
        $('#grand-total').textContent = formatMoney(selected.total, currency);
        $('#items-title').textContent = '項目明細';
        $('#item-heading').textContent = '項目／分食比例';
        $('#amount-heading').textContent = isSourceBreakdown ? `分攤金額（${sourceCurrency}）` : '分攤金額';
        const preDiscount = number(selected.subtotal) + number(selected.discount);
        const personalEntries = [];
        if (isSourceBreakdown || number(selected.discount) || number(selected.tax)) {
          personalEntries.push([isSourceBreakdown ? `項目及額外分攤小計（${breakdownCurrency}）` : '項目及額外分攤小計', formatBreakdownMoney(preDiscount)]);
          if (number(selected.discount)) personalEntries.push([isSourceBreakdown ? `折扣（${breakdownCurrency}）` : '折扣', `−${formatBreakdownMoney(selected.discount)}`]);
          if (number(selected.tax)) personalEntries.push([isSourceBreakdown ? `稅項／服務費（${breakdownCurrency}）` : '稅項／服務費', formatBreakdownMoney(selected.tax)]);
          personalEntries.push([isSourceBreakdown ? `你要埋單（${currency}）` : '你要埋單', formatMoney(selected.total, currency)]);
          $('#personal-breakdown').hidden = false;
          $('#personal-title').textContent = '金額明細';
          $('#personal-details').innerHTML = personalEntries.map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`).join('');
        } else {
          $('#personal-breakdown').hidden = true;
        }

        const rows = data.items.flatMap(item => {
          const itemShares = Array.isArray(item.shares) ? item.shares : [];
          const share = itemShares.find(entry => entry.person === selected.name);
          if (!share) return [];
          const extras = [];
          if (item.original) extras.push(`<div><strong>單據原文：</strong>${escapeHtml(item.original)}</div>`);
          if (item.ja) extras.push(`<div><strong>日文：</strong>${escapeHtml(item.ja)}</div>`);
          extras.push(`<div><strong>全單項目金額：</strong>${escapeHtml(formatMoney(item.sourceAmount, sourceCurrency, isSourceBreakdown))}`);
          const quantity = number(share.quantity);
          const activeShares = itemShares.filter(entry => number(entry.quantity) > 0 || number(entry.amount) > 0);
          const dinerNames = new Set();
          let unknownDiner = false;
          activeShares.forEach(entry => {
            const name = String(entry.person || '').trim();
            if (name) dinerNames.add(name);
            else unknownDiner = true;
          });
          const dinerCount = !unknownDiner && dinerNames.size ? dinerNames.size : 0;
          const allocationTotal = number(share.allocationTotal);
          let fraction = allocationTotal > 0 ? formatReducedFraction(quantity, allocationTotal) : '';
          if (!fraction && isSourceBreakdown && number(item.sourceAmount) > 0) {
            fraction = formatReducedFraction(share.amount, item.sourceAmount);
          }
          const shareAmountTotal = itemShares.reduce((sum, entry) => sum + number(entry.amount), 0);
          const amountTotal = isSourceBreakdown && number(item.sourceAmount) > 0
            ? number(item.sourceAmount)
            : number(item.allocatedAmount) || shareAmountTotal;
          if (!fraction && number(share.amount) > 0 && amountTotal > 0) {
            fraction = formatReducedFraction(share.amount, amountTotal);
          }
          const allocatedQuantity = itemShares.reduce((sum, entry) => sum + number(entry.quantity), 0);
          const itemQuantity = number(item.quantity);
          if (!fraction && quantity > 0 && allocatedQuantity > 0 && (!itemQuantity || Math.abs(allocatedQuantity - itemQuantity) < 0.000001)) {
            fraction = formatReducedFraction(quantity, itemQuantity || allocatedQuantity);
          }
          const quantityText = fraction && dinerCount
            ? `共 ${dinerCount} 人分食，你分 ${fraction} 份`
            : fraction
              ? `你分 ${fraction} 份`
              : dinerCount
                ? `共 ${dinerCount} 人分食`
                : '';
          return [`<tr class="item-row" data-testid="personal-item-row"><td><div class="item-name">${escapeHtml(item.name || '未命名項目')}</div>${quantityText ? `<div class="item-subline">${escapeHtml(quantityText)}</div>` : ''}<details class="item-details"><summary>睇單據原文</summary><div class="item-extra">${extras.join('')}</div></details></td><td class="amount">${escapeHtml(formatBreakdownMoney(share.amount))}</td></tr>`];
        });
        adjustments.filter(entry => entry.person === selected.name).forEach(entry => {
          const quantity = number(entry.quantity);
          const quantityText = quantity ? ` · ${formatQuantity(quantity)}${entry.unit ? ` ${entry.unit}` : ''}` : '';
          rows.push(`<tr class="adjustment-row" data-testid="personal-adjustment-row"><td><div class="item-name">額外分攤：${escapeHtml(entry.name)}</div><div class="item-subline">${escapeHtml(entry.reason || '單據調整')}${escapeHtml(quantityText)}</div></td><td class="amount">${escapeHtml(formatBreakdownMoney(entry.amount))}</td></tr>`);
        });
        $('#item-rows').innerHTML = rows.length ? rows.join('') : '<tr><td colspan="2" class="empty-items">今次冇要埋單嘅項目</td></tr>';
        $('#item-rows').querySelectorAll('details.item-details').forEach(detail => detail.addEventListener('toggle', syncItemDetailToggleButton));
        syncItemDetailToggleButton();
        $('#other-details').open = false;
        if (!receiptsLoaded) {
          if (isSharedLink) {
            receiptsLoaded = true;
            if (sharedImages.length) {
              images.push(...sharedImages);
              imageCountLabel.textContent = `${sharedImages.length} 張`;
              renderPhotos(sharedImages);
            } else {
              showPhotoMessage('沒有收據相片。');
            }
          } else {
            loadReceiptImages();
          }
        }
      };

      const receiptContent = $('#receipt-content');
      const imageCountLabel = $('#image-count');
      const images = [];
      let receiptsLoaded = false;
      const imageCount = isSharedLink ? sharedImages.length : number(bill.receiptImageCount);
      imageCountLabel.textContent = imageCount ? `${imageCount} 張` : '';
      const showPhotoMessage = message => { receiptContent.innerHTML = `<div class="photo-placeholder">${escapeHtml(message)}</div>`; };
      const renderPhotos = files => {
        receiptContent.innerHTML = `<div class="receipt-grid" data-count="${files.length}">${files.map((image,index) => `<button class="receipt-photo" type="button" data-photo-index="${index}" aria-label="放大收據 ${index + 1}"><img loading="eager" src="data:${image.mimeType};base64,${image.data}" alt="收據 ${index + 1}"><span>第 ${index + 1} 張 · 點圖放大</span></button>`).join('')}</div>`;
        receiptContent.querySelectorAll('[data-photo-index]').forEach(button => button.addEventListener('click', () => {
          const image = files[Number(button.dataset.photoIndex)];
          if (!image) return;
          $('#lightbox-image').src = `data:${image.mimeType};base64,${image.data}`;
          $('#photo-caption').textContent = `收據 ${Number(button.dataset.photoIndex) + 1}`;
          $('#photo-dialog').showModal();
        }));
      };
      const loadReceiptImages = async () => {
        if (receiptsLoaded) return;
        receiptsLoaded = true;
        if (!imageCount) { showPhotoMessage('沒有收據相片。'); return; }
        if (!window.indexedDB) { showPhotoMessage('無法讀取本機收據相片。'); return; }
        try {
          const db = await new Promise((resolve,reject) => {
            const request = indexedDB.open('billSplitterLocalData',1);
            request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains('receipts')) request.result.createObjectStore('receipts',{keyPath:'recordId'}); };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error || new Error('讀取失敗'));
          });
          const record = await new Promise((resolve,reject) => {
            if (!db.objectStoreNames.contains('receipts')) { resolve(null); return; }
            const transaction = db.transaction('receipts','readonly');
            let result = null;
            const request = transaction.objectStore('receipts').get('active-bill-draft-assets-v1');
            request.onsuccess = () => { result = request.result || null; };
            request.onerror = () => reject(request.error || new Error('讀取失敗'));
            transaction.oncomplete = () => resolve(result);
            transaction.onerror = () => reject(transaction.error || new Error('讀取失敗'));
          });
          db.close();
          if (!record || record.revision !== data.assetRevision) { showPhotoMessage('找不到本機收據相片。'); return; }
          const files = (Array.isArray(record.images) ? record.images : []).filter(image => image && typeof image.data === 'string' && /^[A-Za-z0-9+/]+={0,2}$/.test(image.data) && ['image/jpeg','image/png','image/webp'].includes(image.mimeType));
          if (!files.length) { showPhotoMessage('沒有可顯示的收據相片。'); return; }
          images.push(...files);
          imageCountLabel.textContent = `${files.length} 張`;
          renderPhotos(files);
        } catch (_) {
          showPhotoMessage('未能讀取收據相片，請稍後再試。');
        }
      };
      $('#close-photo').addEventListener('click', () => $('#photo-dialog').close());
      $('#photo-dialog').addEventListener('click', event => { if (event.target === $('#photo-dialog')) $('#photo-dialog').close(); });
      copyPayableButton.addEventListener('click', async () => {
        const selected = getSelectedForNotice();
        if (!selected) return;
        const amountText = formatMoney(selected.total, currency).replace(/,/g, '').replace(/[^\d.-]/g, '');
        const copied = await copyText(amountText);
        $('#copy-payable-status').textContent = copied ? `已複製應付金額：${amountText}` : '複製失敗，請手動抄寫金額。';
        copyPayableButton.textContent = copied ? '已複製' : '重試複製';
        window.setTimeout(() => { copyPayableButton.textContent = '複製'; }, 1600);
      });
      paidNoticeButton.addEventListener('click', notifyPayerOfPayment);
      memberSelect.addEventListener('change', () => {
        renderSelectedMember();
        if (!memberSelect.value) return;
        requestAnimationFrame(() => $('#friend-amount-summary').scrollIntoView({ behavior:'smooth', block:'start' }));
      });
      editClaimsButton.addEventListener('click', () => {
        if (!isEmbeddedShared || !claimResultReady || !canEditClaims || !memberSelect.value || !getSelectedForNotice()) return;
        window.parent.postMessage({ type:'bill-claim-edit', sessionId:shareId, name:memberSelect.value }, location.origin);
      });
      applyClaimContext = context => {
        canEditClaims = context.canEdit === true;
        editClaimsButton.textContent = context.language === 'en' ? 'Edit my items' : '修改認帳';
        const personName = typeof context.person === 'string' && context.person.trim() ? context.person : '';
        ownClaimName = personName;
        if (personName && context.cleared === true && !participants.some(person => person.name === personName)) {
          participants.push({ name:personName, total:0, sourceTotal:0, subtotal:0,tax:0,discount:0 });
          memberSelect.append(new Option(personName, personName));
          memberSelect.options[0].textContent = '請揀你個名';
          memberSelect.disabled = false;
        }
        if (personName && participants.some(person => person.name === personName)) {
          memberSelect.value = personName;
          renderSelectedMember();
        } else {
          syncEditClaimsButton();
        }
      };
      // All render dependencies and listeners must exist before parent preselection.
      claimResultReady = true;
      if (pendingClaimContext) applyClaimContext(pendingClaimContext);
      if (isEmbeddedShared) {
        window.parent.postMessage({ type:'bill-claim-result-ready', sessionId:shareId }, location.origin);
      }
    })();
  </script>
</body>
</html>
